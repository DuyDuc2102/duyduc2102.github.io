<!DOCTYPE html>
<html lang="vi" class="antialiased">
<head>
  <meta charset="UTF-8" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.16/400.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.16/500.css" />

  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#fafafa',
              100: '#f5f5f5',
              200: '#e5e5e5',
              300: '#d4d4d4',
              400: '#a3a3a3',
              500: '#525252',
              600: '#171717',
              700: '#0a0a0a',
              800: '#262626',
              900: '#171717',
            }
          }
        }
      }
    };
  </script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js"></script>

  <style>
    /* Thiết lập chung và hiệu ứng mượt mà */
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    /* Hiệu ứng lật thẻ Flashcard 3D */
    .flashcard-scene {
      perspective: 1200px;
    }
    .flashcard-inner {
      position: relative;
      width: 100%;
      min-height: 320px;
      transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
      transform-style: preserve-3d;
    }
    .flashcard-inner.is-flipped {
      transform: rotateY(180deg);
    }
    .flashcard-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .flashcard-back {
      transform: rotateY(180deg);
    }

    /* Thanh cuộn tinh gọn */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.45);
      border-radius: 9999px;
    }

    /* Tối ưu khi xuất PDF qua lệnh in trình duyệt */
    @media print {
      body {
        background: #ffffff !important;
        color: #111827 !important;
      }
      #app-root, #toast-container, #modal-root {
        display: none !important;
      }
      #print-area {
        display: block !important;
      }
      .print-break-avoid {
        break-inside: avoid;
        page-break-inside: avoid;
      }
    }
    #print-area {
      display: none;
    }

    /* Công tắc gạt tối giản trắng đen */
    .mono-switch {
      position: relative;
      display: inline-flex;
      align-items: center;
      width: 38px;
      height: 22px;
      border-radius: 9999px;
      transition: background-color 0.2s ease;
      cursor: pointer;
    }
    .mono-switch-thumb {
      width: 16px;
      height: 16px;
      border-radius: 9999px;
      transition: transform 0.2s ease;
    }
  </style>
</head>
<body class="bg-neutral-50 text-neutral-900 dark:bg-neutral-950 dark:text-neutral-100 min-h-screen transition-colors duration-200">
  <!-- Vùng chính của ứng dụng -->
  <div id="app-root" class="min-h-screen flex flex-col">
    <!-- Thanh điều hướng trên cùng (gọn, trắng đen) -->
    <header class="sticky top-0 z-30 bg-white/90 dark:bg-neutral-950/90 backdrop-blur border-b border-neutral-200 dark:border-neutral-800">
      <div class="max-w-3xl mx-auto px-4 h-13 py-2.5 flex items-center justify-between gap-2">
        <button id="btn-go-home" type="button" class="flex items-center gap-2 text-left group focus:outline-none">
          <div class="w-7 h-7 rounded-lg bg-neutral-900 dark:bg-white text-white dark:text-neutral-950 flex items-center justify-center transition">
            <i data-lucide="graduation-cap" class="w-4 h-4"></i>
          </div>
          <span class="font-bold text-sm tracking-tight text-neutral-900 dark:text-white">ÔnThiPro</span>
        </button>

        <div class="flex items-center gap-1">
          <button id="btn-open-merge" type="button" class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-medium text-neutral-600 dark:text-neutral-300 hover:bg-neutral-100 dark:hover:bg-neutral-900 transition" title="Gộp nhiều bộ đề">
            <i data-lucide="layers" class="w-3.5 h-3.5"></i>
            <span class="hidden sm:inline">Gộp đề</span>
          </button>
          <button id="btn-open-settings" type="button" class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-medium text-neutral-600 dark:text-neutral-300 hover:bg-neutral-100 dark:hover:bg-neutral-900 transition" title="Cài đặt AI & API">
            <i data-lucide="settings" class="w-3.5 h-3.5"></i>
            <span class="hidden sm:inline">AI</span>
            <span id="api-status-dot" class="w-1.5 h-1.5 rounded-full bg-neutral-400"></span>
          </button>
          <button id="btn-toggle-theme" type="button" class="p-1.5 rounded-lg text-neutral-600 dark:text-neutral-300 hover:bg-neutral-100 dark:hover:bg-neutral-900 transition" title="Chuyển chế độ sáng/tối" aria-label="Chuyển chế độ sáng tối">
            <i id="theme-icon" data-lucide="sun" class="w-4 h-4"></i>
          </button>
        </div>
      </div>
    </header>

    <!-- Nội dung động theo từng màn hình (khung thu nhỏ gọn max-w-3xl) -->
    <main id="main-content" class="flex-1 max-w-3xl w-full mx-auto px-4 py-5">
      <!-- Render bởi JavaScript -->
    </main>

    <!-- Chân trang gọn nhẹ -->
    <footer class="border-t border-neutral-200 dark:border-neutral-800 py-3 text-center text-[11px] text-neutral-500 dark:text-neutral-500">
      <div class="max-w-3xl mx-auto px-4">
        Dữ liệu bộ đề, câu đã sai và kết quả được lưu cục bộ trên trình duyệt (localStorage).
      </div>
    </footer>
  </div>

  <!-- Vùng hiển thị Modal (Hộp thoại) -->
  <div id="modal-root"></div>

  <!-- Vùng hiển thị thông báo Toast -->
  <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 max-w-sm w-[calc(100%-2rem)] pointer-events-none"></div>

  <!-- Vùng ẩn dùng riêng cho Xuất PDF / In ấn -->
  <div id="print-area" class="p-8 max-w-4xl mx-auto"></div>

  <script>
    /* =========================================================================
       ÔnThiPro — Ứng dụng Ôn tập Trắc nghiệm Bằng Tiếng Việt
       Cấu trúc mã nguồn:
       1. Hằng số, lưu trữ (localStorage) & Dữ liệu mẫu khởi tạo
       2. Quản lý trạng thái toàn cục (State)
       3. Tiện ích UI (Toast, Modal, Escape HTML, Định dạng thời gian)
       4. Xử lý đọc tài liệu (PDF, DOCX, TXT) & Chia nhỏ văn bản (Chunking)
       5. Dịch vụ gọi AI API (Claude, OpenAI, Gemini) + Retry JSON + Chế độ cục bộ
       6. Bộ phân tích đề trắc nghiệm có sẵn (Smart Quiz Parser)
       7. Xuất / Nhập bộ đề (JSON, Word .doc, PDF in ấn)
       8. Các màn hình (Home, CreateFromDoc, ImportQuiz, EditSet, Quiz, Result, Flashcard)
       9. Khởi chạy & Sự kiện toàn cục
       ========================================================================= */

    (function () {
      'use strict';

      // Cấu hình PDF.js worker
      if (window.pdfjsLib) {
        window.pdfjsLib.GlobalWorkerOptions.workerSrc =
          'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      }

      /* -----------------------------------------------------------------------
         1. HẰNG SỐ, LƯU TRỮ & DỮ LIỆU MẪU
         ----------------------------------------------------------------------- */
      const STORAGE_KEYS = {
        SETS: 'onthipro_sets_v1',
        HISTORY: 'onthipro_history_v1',
        SETTINGS: 'onthipro_settings_v1',
        THEME: 'onthipro_theme_v2_mono',
        WRONG_IDS: 'onthipro_wrong_ids_v1'
      };

      const LETTERS = ['A', 'B', 'C', 'D', 'E'];

      function safeGetStorage(key, fallback) {
        try {
          const raw = localStorage.getItem(key);
          return raw ? JSON.parse(raw) : fallback;
        } catch (err) {
          return fallback;
        }
      }

      function safeSetStorage(key, value) {
        try {
          localStorage.setItem(key, JSON.stringify(value));
          return true;
        } catch (err) {
          showToast('Không thể lưu vào bộ nhớ trình duyệt (có thể bộ nhớ đã đầy).', 'error');
          return false;
        }
      }

      function generateId(prefix) {
        return (prefix || 'id') + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
      }

      // Dữ liệu tích hợp sẵn: Triết học Mác – Lênin Phần 1 (308 câu) và Phần 2 (541 câu)
      const BUILTIN_TRIET_P1 = [["Hình thức tồn tại của vật chất là gì?",["Không gian, thời gian","Vận động, phát triển","Nguyên nhân, kết quả","Linh hồn, ý niệm"],0],["Một trong những ý nghĩa phương pháp luận rút ra từ việc nghiên cứu cặp phạm trù “khả năng – hiện thực” là gì?",["Luôn đề cao tuyệt đối vai trò của nhân tố chủ quan trong mọi trường hợp","Chỉ coi trọng điều kiện khách quan, bỏ qua nhân tố chủ quan","Cần tránh sai lầm: hoặc tuyệt đối hóa vai trò của nhân tố chủ quan, hoặc xem thường vai trò ấy trong quá trình biến đổi khả năng thành hiện thực","Chỉ cần dự báo khả năng, không cần chú ý điều kiện hiện thực hóa"],2],["Trường phái triết học nào thừa nhận sự tồn tại của các sự vật, hiện tượng nhưng phủ nhận đặc trưng “tự thân tồn tại” của chúng?",["Thuyết khả tri","Chủ nghĩa duy vật","Chủ nghĩa duy tâm","Thuyết nhị nguyên"],2],["Hình thức đầu tiên trong lịch sử của chủ nghĩa duy vật là gì?",["Chủ nghĩa duy vật biện chứng","Chủ nghĩa duy vật chất phác","Chủ nghĩa duy vật siêu hình","Chủ nghĩa duy vật lịch sử"],1],["Phạm trù nào chỉ tổng thể các tiền đề của sự biến đổi, sự hình thành của hiện thực mới, là cái “có thể có” nhưng ngay lúc này còn chưa có?",["Hiện thực","Tất nhiên","Khả năng","Ngẫu nhiên"],2],["Trong tác phẩm Chống Đuyrinh, khi bàn về các quy luật, Ph. Ăngghen định nghĩa phép biện chứng là gì?",["Khoa học về mâu thuẫn.","“Chẳng qua chỉ là môn khoa học về những quy luật phổ biến của sự vận động và sự phát triển của tự nhiên, của xã hội loài người và tư duy.”","Khoa học về phủ định.","Hệ thống các quy tắc tư duy nhằm phản bác siêu hình học trong nhận thức."],1],["Quan điểm nào xem vật chất, vận động, không gian, thời gian như những thực thể khác nhau, không có mối liên hệ nội tại với nhau?",["Thuyết nhị nguyên","Chủ nghĩa duy tâm chủ quan","Chủ nghĩa duy vật biện chứng","Chủ nghĩa duy vật siêu hình thế kỷ XVII–XVIII"],3],["Phạm trù nào chỉ tổng thể các tiền đề của sự biến đổi, sự hình thành của hiện thực mới, là cái “có thể có” nhưng ngay lúc này còn chưa có?",["Khả năng","Tất nhiên","Ngẫu nhiên","Hiện thực"],0],["Khái niệm nào dùng để chỉ biện chứng của bản thân thế giới tồn tại khách quan, độc lập với ý thức con người?",["Biện chứng chủ quan","Biện chứng khách quan","Siêu hình học","Duy tâm chủ quan"],1],["Điểm tương đồng của các quan niệm duy vật thời Cổ đại về vật chất là gì?",["Đồng nhất vật chất với ý niệm","Quy vật chất về cảm giác","Xem vật chất là năng lượng thuần túy","Đồng nhất vật chất với vật thể"],3],["Theo chủ nghĩa duy tâm, vai trò của vật chất đối với ý thức là gì?",["Vật chất quyết định ý thức","Vật chất và ý thức hoàn toàn độc lập","Nhấn mạnh một chiều vai trò của ý thức sinh ra vật chất, thế giới vật chất chỉ là bản sao biểu hiện khác của tinh thần","Ý thức chỉ phản ánh trung thực vật chất"],2],["Theo triết học Mác – Lênin, phương thức tồn tại của vật chất là gì?",["Nhận thức","Vận động","Phản ánh","Tư duy"],1],["Theo triết học Mác – Lênin, nguồn gốc xã hội cho sự ra đời của triết học là gì?",["Lao động trí óc tách khỏi lao động chân tay","Ra đời của tôn giáo","Phát minh chữ viết","Sự xuất hiện của nhà nước"],0],["Theo triết học Mác – Lênin, chủ nghĩa duy vật là gì?",["Thuyết cho rằng ý niệm có trước và quyết định thế giới vật chất","Lập trường cho rằng vật chất và ý thức bình đẳng, không quyết định lẫn nhau","Quan điểm hoài nghi khả năng nhận thức thế giới khách quan","Trường phái thừa nhận bản chất của thế giới là vật chất: vật chất là tính thứ nhất, ý thức là tính thứ hai; vật chất quyết định ý thức"],3],["Quan điểm nào xem vật chất, vận động, không gian, thời gian như những thực thể khác nhau, không có mối liên hệ nội tại với nhau?",["Thuyết nhị nguyên","Chủ nghĩa duy vật siêu hình thế kỷ XVII–XVIII","Chủ nghĩa duy tâm khách quan","Chủ nghĩa duy vật biện chứng"],1],["Theo phép biện chứng duy vật, phạm trù nào chỉ tổng thể tất cả những mặt, yếu tố tạo nên sự vật, hiện tượng?",["Kết cấu","Nội dung","Hình thức","Bản chất"],1],["Theo chủ nghĩa Mác - Lênin, phạm trù “chất” được hiểu là:",["Khả năng biến đổi mang tính ngẫu nhiên","Thuộc tính tồn tại mang tính chủ quan","Một phạm trù triết học dùng để chỉ tính qui định khách quan vốn có của sự vật, là sự thống nhất hữu cơ của những thuộc tính làm cho sự vật nó là nó chứ không phải là cái khác.","Sự phản ánh mang tính kinh nghiệm cảm tính"],2],["Học thuyết triết học nào khẳng định con người có khả năng nhận thức được thế giới?",["Thuyết hoài nghi","Thuyết bất khả tri","Học thuyết khả tri luận","Thuyết duy tâm chủ quan"],2],["Hạn chế của các quan niệm về phạm trù vật chất ở thời Cổ đại là:",["Không thừa nhận vật chất tồn tại","Đồng nhất vật chất với ý thức","Có tính trực quan, ngây thơ, chất phác","Chỉ thừa nhận tinh thần tuyệt đối"],2],["Điền vào chỗ trống: “Tiến hóa là một dạng của phát triển, … và thường là sự biến đổi hình thức tồn tại xã hội từ đơn giản đến phức tạp”.",["Diễn ra một cách đột ngột","Phủ nhận mọi mâu thuẫn","Chỉ phụ thuộc vào chủ quan","Diễn ra theo cách từ từ"],3],["Quan điểm chủ nghĩa duy vật về mặt thứ nhất trong vấn đề cơ bản của mọi triết học là:",["Ý thức có trước, vật chất có sau","Ý thức quyết định vật chất","Vật chất và ý thức ngang bằng","Vật chất có trước, ý thức có sau, vật chất quyết định ý thức"],3],["Ưu điểm của chủ nghĩa duy vật trước Mác về bản chất thế giới là:",["Phủ nhận tồn tại khách quan của vật chất","Xem vật chất chỉ là cảm giác","Thừa nhận sự tồn tại khách quan của thế giới vật chất, lấy bản thân giới tự nhiên để giải thích về tự nhiên","Tuyệt đối hóa vai trò tinh thần tuyệt đối"],2],["Trường phái triết học nào thừa nhận sự tồn tại của các sự vật, hiện tượng của thế giới nhưng phủ nhận đặc trưng “tự thân tồn tại”?",["Chủ nghĩa duy vật biện chứng","Chủ nghĩa vô thần","CNDT","Chủ nghĩa thực chứng"],2],["Khái niệm nào dùng để chỉ biện chứng của bản thân thế giới tồn tại khách quan, độc lập với ý thức?",["Biện chứng chủ quan","Siêu hình học","Chủ nghĩa duy tâm","Biện chứng khách quan"],3],["Hình thức tồn tại của vật chất vận động xét về mặt độ dài diễn biến, sự kế tiếp của các quá trình được gọi là gì?",["Không gian","Quá trình","Nhận thức","Thời gian"],3],["Ưu điểm của chủ nghĩa duy vật trước Mác về bản chất thế giới là:",["Khẳng định vật chất chỉ do cảm giác tạo ra","Đưa mọi giải thích về Thượng đế","Thừa nhận sự tồn tại khách quan của thế giới vật chất, lấy bản thân giới tự nhiên để giải thích về tự nhiên","Cho rằng ý thức quyết định toàn bộ thực tại"],2],["Phép biện chứng duy vật cho rằng xu hướng của sự phát triển được mô phỏng theo đồ thức gì?",["Đường thẳng tuyến tính từ thấp đến cao","Đường sóng tuần hoàn mang tính lặp lại","Đường xoáy ốc","Chu kỳ khép kín không thay đổi bản chất"],2],["Trong triết học Mác - Lênin, cơ sở lý luận của nguyên tắc phát triển là gì?",["Học thuyết về phủ định biện chứng tự phát","Học thuyết về mối liên hệ phổ biến giữa các sự vật","Sự tác động thuần túy của ý thức lên tồn tại xã hội","Nguyên lý về sự phát triển"],3],["Nhà triết học nào khẳng định thế giới “ý niệm”, hay “ý niệm tuyệt đối” là bản thể sinh ra toàn bộ thế giới hiện thực?",["Platôn","Cantơ","Hêghen","Arixtốt"],2],["Nhà triết học nào quan niệm cơ sở đầu tiên của mọi vật trong vũ trụ là Apeiron – một dạng vật chất đơn nhất, vô định, vô hạn và tồn tại vĩnh viễn?",["Hêraclít","Talét","Anaximander","Pitago"],2],["Trong triết học Mác – Lênin, khái niệm nào dùng để chỉ sự quy định, sự tác động và chuyển hóa lẫn nhau giữa các sự vật, hiện tượng, hay giữa các mặt, các yếu tố của mỗi sự vật, hiện tượng trong thế giới?",["Bản chất","Hiện tượng","Mối liên hệ","Quy luật khách quan"],2],["Theo duy vật biện chứng, vận động là gì?",["Sự thay đổi do tác động thuần túy của tư duy chủ quan","Vận động bao gồm mọi sự thay đổi và mọi quá trình diễn ra trong vũ trụ, kể từ sự thay đổi vị trí giản đơn cho đến tư duy","Quá trình hình thành do lực lượng siêu nhiên chi phối","Sự đứng yên kéo dài trong mọi hình thái tồn tại"],1],["Kết cấu của ý thức gồm những yếu tố nào?",["Cảm giác, tri giác, vận động và phản ánh","Tri thức, tình cảm, ý trí, niềm tin","Bản năng, kinh nghiệm, cảm xúc và ngôn ngữ","Nhận thức, lý trí, tư duy và hành vi"],1],["Lần đầu tiên trong lịch sử, C. Mác và Ph. Ăngghen công khai tính giai cấp của triết học, biến triết học của mình thành vũ khí tinh thần cho giai cấp nào?",["Giai cấp tư sản","Tầng lớp tiểu nông","Giai cấp vô sản","Địa chủ phong kiến"],2],["Nhà triết học Anaximander quan niệm cơ sở đầu tiên của mọi vật trong vũ trụ là gì?",["Nguyên tử bất biến trong không gian trống rỗng","Một dạng vật chất đơn nhất, vô định, vô hạn và tồn tại vĩnh viễn – Apeirôn","Sự hòa hợp của các yếu tố lửa, nước, khí và đất","Hỗn mang do thần linh điều khiển từ bên ngoài"],1],["Nhà triết học Lơxíp và Đêmôcrít quan niệm cơ sở đầu tiên của mọi vật trong vũ trụ là gì?",["Khí nguyên sinh phát tán trong vũ trụ","Linh hồn bất tử điều khiển vận động","Nguyên tử","Các yếu tố hình thức do ý niệm sáng tạo ra"],2],["Theo chủ nghĩa duy vật biện chứng, hình thức vận động cao nhất và phức tạp nhất là gì?",["Vận động sinh học","Vận động cơ giới","Vận động hóa học","Vận động xã hội"],3],["Phạm trù nào dùng để chỉ mối liên hệ thống nhất và quy định lẫn nhau giữa chất với lượng; là giới hạn tồn tại của sự vật, hiện tượng mà trong đó sự thay đổi về lượng chưa dẫn đến sự thay đổi về chất; sự vật, hiện tượng vẫn là nó, chưa chuyển hóa thành sự vật, hiện tượng khác?",["Giới hạn nội tại của vận động phát triển","Độ","Ngưỡng biến đổi trong điều kiện cụ thể","Quy mô chuyển tiếp giữa các trạng thái"],1],["Tác động của lao động và ngôn ngữ đối với sự hình thành và phát triển của ý thức?",["Là quá trình tự hoàn thiện thông qua kinh nghiệm cảm tính","Là làm chuyển biến dần bộ óc của loài vượn người thành bộ óc con người và tâm lý động vật thành ý thức con người","Là tạo ra sự khác biệt giữa hành vi bản năng và hành vi thuần lý","Là cung cấp phương tiện giao tiếp đơn giản và trao đổi tri thức"],1],["Phương pháp tư duy nào chi phối chủ nghĩa duy vật thế kỷ XV – XVIII là gì?",["Phương pháp trực giác kinh nghiệm tổng hợp","Phương pháp tư duy siêu hình","Phương pháp suy luận diễn dịch thuần túy","Phương pháp chứng minh bằng khải huyền"],1],["Thuật ngữ “Philosophia – yêu mến sự thông thái” xuất hiện đầu tiên ở quốc gia nào?",["Ai Cập cổ đại","Hy Lạp Cổ đại","Ấn Độ cổ đại","Ba Tư cổ đại"],1],["V.I. Lênin sinh ngày tháng năm nào?",["22 tháng 4 năm 1868","22/4/1870","21 tháng 3 năm 1872","23 tháng 5 năm 1871"],1],["Điền vào chỗ trống: “Vấn đề cơ bản lớn của mọi triết học, đặc biệt là của triết học hiện đại, là vấn đề quan hệ giữa……với……”.",["Linh hồn, vũ trụ","Thượng đế, thế giới","Tư duy, tồn tại","Ý niệm, thực tại"],2],["Đêmôcrít quan niệm cơ sở đầu tiên của mọi vật trong vũ trụ là:",["Hơi ấm và sinh khí phổ quát","Vòng xoáy của hỗn mang nguyên sơ","Nguyên tử","Các yếu tố đất, nước, lửa, khí"],2],["Định nghĩa hoàn chỉnh về giai cấp lần đầu tiên được Lênin đề cập trong tác phẩm nào?",["Nhà nước và Cách mạng","Chủ nghĩa Đế quốc – Giai đoạn tột cùng","Sáng kiến vĩ đại","Bút ký triết học về phép biện chứng"],2],["Điểm tương đồng của các quan niệm duy vật về vật chất thời Cổ đại là:",["Xem vật chất là khái niệm mang tính tinh thần","Phủ nhận vật chất tồn tại độc lập","Đồng nhất vật chất với vật thể","Quy vật chất về cảm giác chủ quan"],2],["Biểu hiện của tính năng động, tích cực, sáng tạo của ý thức con người ở giai đoạn xử lý thông tin là:",["Sao chép hoàn toàn thông tin từ thực tế","Mô hình hóa đối tượng và mã hóa thông tin để xử lý thông tin được tiếp nhận","Tiếp nhận dữ liệu một cách thụ động và tái trình bày","Phản ứng theo bản năng dựa trên kinh nghiệm sẵn có"],1],["Trạng thái vận động nào chưa làm thay đổi cơ bản về chất của sự vật?",["Vận động hóa học làm biến dạng cấu trúc","Vận động trong thăng bằng","Vận động sinh học làm biến đổi nội dung","Vận động xã hội làm chuyển hóa bản thể"],1],["Giải quyết mặt thứ hai trong vấn đề cơ bản của triết học đã xác lập nên những trường phái lớn nào?",["Thuyết duy linh và thuyết duy vật","Thuyết hiện sinh và thuyết bản thể","Khả tri luận và bất khả tri luận","Thuyết nhị nguyên và thuyết thực chứng"],2],["Quan điểm triết học nào xem vật chất, vận động, không gian, thời gian như những thực thể khác nhau, không có mối liên hệ nội tại với nhau?",["Chủ nghĩa duy tâm chủ quan","Chủ nghĩa thực chứng kinh nghiệm","Chủ nghĩa duy vật thế kỷ XV – XVIII","Thuyết ngộ đạo cổ đại"],2],["Phản ánh gì có tính chủ động lựa chọn thông tin, xử lý thông tin để tạo ra những thông tin mới, phát hiện ý nghĩa của thông tin?",["Trực giác cảm tính","Bản năng sinh học","Ý thức","Trải nghiệm tinh thần"],2],["Theo triết học Mác – Lênin, phạm trù ngẫu nhiên là:",["Hoàn toàn không chịu quy luật chi phối","Có thể không xuất hiện; có thể xuất hiện thế này hoặc có thể xuất hiện thế khác","Khẳng định chắc chắn xảy ra theo một tất yếu duy nhất","Không phụ thuộc điều kiện khách quan bất kỳ"],1],["Điền vào chỗ trống: “Quy luật là những mối liên hệ khách quan,……, tất nhiên, phổ biến và lặp lại giữa các mặt, các yếu tố, các thuộc tính bên trong mỗi một sự vật, hay giữa các sự vật, hiện tượng với nhau”.",["Gián đoạn và cô lập","Bản chất","Thuần túy ngẫu nhiên","Mang tính ước lệ"],1],["Phương pháp tư duy chi phối chủ nghĩa duy vật thế kỷ XV – XVIII?",["Phương pháp biện chứng nội tại","Phương pháp mô hình hóa nhân tạo","Phương pháp tư duy siêu hình","Phương pháp phản tỉnh thực nghiệm"],2],["Định nghĩa vật chất của V.I. Lênin được đề cập trong tác phẩm nào?",["Bút ký triết học về Hêghen","Nhà nước và Cách mạng","Chủ nghĩa duy vật và chủ nghĩa kinh nghiệm phê phán","Chủ nghĩa Đế quốc – Giai đoạn tột cùng"],2],["Vai trò tích cực của chủ nghĩa duy vật siêu hình thế kỷ XV–XVIII là gì?",["Khẳng định vật chất tồn tại vĩnh viễn, bất biến","Chống lại thế giới quan duy tâm, tôn giáo","Bác bỏ mọi quy luật khách quan của tự nhiên","Đề cao trực giác hơn thực nghiệm"],1],["Điền vào chỗ trống theo định nghĩa của V.I. Lênin: “Vật chất là một phạm trù triết học dùng để chỉ thực tại khách quan được đem lại cho con người trong ……, được …… của chúng ta chép lại, chụp lại, phản ánh và tồn tại không lệ thuộc vào ……”",["cảm xúc; ký ức; suy tưởng","tri giác; tri giác; tri giác","cảm giác; cảm giác; cảm giác","nhận thức; nhận thức; nhận thức"],2],["Theo chủ nghĩa duy vật biện chứng, bản chất của ý thức là gì?",["Sự phản ứng sinh lý thuần túy của hệ thần kinh","Sự phản ánh hiện thực khách quan vào bộ óc con người một cách tích cực, sáng tạo","Sản phẩm do Thượng đế ban tặng cho con người","Bản nguyên đầu tiên tạo ra vật chất"],1],["Theo phép biện chứng duy vật, “đấu tranh giữa các mặt đối lập” là gì?",["Sự điều hòa tự phát giữa các mặt giống nhau","Sự tác động qua lại theo hướng bài trừ, phủ định lẫn nhau giữa các mặt đối lập, gắn liền với sự khác nhau và thống nhất của chúng trong một mâu thuẫn","Sự biến đổi chỉ về lượng, không làm thay đổi chất","Sự thay thế ngẫu nhiên không có quy luật"],1],["Nhà triết học nào thừa nhận vật chất và ý thức là hai bản nguyên song song cùng tồn tại, cùng quyết định nguồn gốc và sự vận động của thế giới?",["Spinoza","Đêcáctơ (Descartes)","Kant","Hegel"],1],["Trong triết học Mác – Lênin, “phép biện chứng” được hiểu là gì?",["Nghệ thuật hùng biện để thuyết phục đám đông","Hệ thống tín điều bất biến về thế giới","Khoa học về những quy luật phổ biến của sự vận động và phát triển của tự nhiên, xã hội và tư duy","Phương pháp suy luận hình thức"],2],["Định nghĩa vật chất của V.I. Lênin khẳng định thuộc tính cơ bản nhất của mọi dạng vật chất là gì?",["Tính cảm tính","Tồn tại khách quan","Tính vận động cơ giới","Tính đồng nhất với năng lượng"],1],["Một nội dung trọng yếu của định nghĩa vật chất theo V.I. Lênin là gì?",["Vật chất đồng nhất với khối lượng","Vật chất là tập hợp ý niệm","Vật chất là thực tại khách quan, tồn tại bên ngoài và không lệ thuộc vào ý thức","Vật chất chỉ tồn tại khi có người quan sát"],2],["Hình thức mô phỏng quá trình phát triển biện chứng thể hiện tính kế thừa, lặp lại và tiến lên là:",["Đường thẳng song song","Đường xoáy ốc","Đường tròn khép kín","Đường gấp khúc ngẫu nhiên"],1],["Nguồn gốc ra đời của triết học nói chung gồm:",["Nguồn gốc tự nhiên và nguồn gốc tôn giáo","Nguồn gốc kinh nghiệm và nguồn gốc thần thoại","Nguồn gốc nhận thức và nguồn gốc xã hội","Nguồn gốc tiên nghiệm và nguồn gốc hậu nghiệm"],2],["Trong các yếu tố hợp thành ý thức, yếu tố quan trọng nhất là:",["Niềm tin","Tri thức","Tình cảm","Ý chí"],1],["Hình thức tồn tại của vật chất xét về quãng tính, sự cùng tồn tại, trật tự, kết cấu và sự tác động lẫn nhau được gọi là:",["Thời gian","Nhân quả","Không gian","Vận động"],2],["Khi nghiên cứu nguyên lý về mối liên hệ phổ biến, cần quán triệt:",["Nguyên tắc lịch sử – cụ thể","Nguyên tắc toàn diện","Nguyên tắc tối giản","Nguyên tắc hình thức"],1],["Theo triết học Mác – Lênin, tiền đề cho sự thống nhất của thế giới là:",["Ý niệm tuyệt đối","Sự tồn tại của thế giới vật chất","Linh hồn vũ trụ","Mối quan hệ ngôn ngữ – ký hiệu"],1],["Nội dung khái quát của định nghĩa vật chất theo V.I. Lênin gồm:",["Tính cảm tính; tính chủ quan; tính bất biến","Tính năng lượng; tính khối lượng; tính không – thời gian","(i) Thực tại khách quan; (ii) đem lại cảm giác; (iii) ý thức chỉ là sự phản ánh của nó","Tính hữu cơ; tính cơ giới; tính mục đích luận"],2],["Phát minh nào của khoa học tự nhiên cuối thế kỷ XIX–đầu XX đã bác bỏ quan niệm xem vật chất, vận động, không gian, thời gian như những thực thể tách biệt, không liên hệ nội tại?",["Thuyết lượng tử của Planck","Thuyết tương đối (Einstein)","Định luật bảo toàn điện tích","Phát hiện electron của Thomson"],1],["Theo triết học Mác – Lênin, sự phát triển có các tính chất cơ bản nào?",["Tính chủ quan; tính tuyệt đối; tính khép kín","Tính phân mảnh; tính ngẫu nhiên; tính bất biến","Tính khách quan; tính phổ biến; tính kế thừa; tính đa dạng – phong phú","Tính tuyến tính; tính đơn điệu; tính lặp nguyên trạng"],2],["Theo chủ nghĩa duy vật biện chứng, “vận động” được hiểu là:",["Chỉ sự thay đổi vị trí cơ học trong không gian","Sự biến đổi tâm lý chủ quan của con người","Mọi sự thay đổi và mọi quá trình diễn ra trong vũ trụ, từ thay đổi vị trí đơn giản đến tư duy","Sự dịch chuyển mang tính chu kỳ khép kín"],2],["Điền đúng tiếp theo định nghĩa của V.I. Lênin (nhắc lại theo đúng thứ tự): Vật chất được đem lại “… trong ……, được …… của chúng ta chép lại, chụp lại, phản ánh, và tồn tại không lệ thuộc vào ……”",["cảm giác; cảm giác; cảm giác","tri giác; ký ức; nhận thức","ý niệm; ý niệm; ý niệm","trực giác; trực giác; trực giác"],0],["Theo quan điểm triết học Mác – Lênin, nguồn gốc xã hội cho sự ra đời của triết học là:",["Sự phân công lao động; xuất hiện giai cấp và nhà nước; tách lao động trí óc khỏi lao động chân tay","Bao gồm tất cả đều đúng","Chỉ có phân công lao động là đủ","Chỉ cần sự dư dả vật chất của xã hội là đủ"],1],["Các “lớp cấu trúc” cơ bản trong ý thức thường được nêu gồm:",["Tri thức, phương tiện, kỹ năng, kinh nghiệm","Tri thức, tình cảm, niềm tin, ý chí","Tri thức, ký ức, ngôn ngữ, tư duy","Tình cảm, cảm giác, trực giác, ảo giác"],1],["Theo V.I. Lênin, sự phát triển vượt bậc của khoa học tự nhiên cuối thế kỷ XIX – đầu XX đã:",["Khẳng định thế giới chỉ là phức hợp cảm giác","Làm xuất hiện thuyết duy tâm mới trong vật lý","Giới hạn hiểu biết trước đây của con người về thế giới vật chất","Phủ nhận mọi quy luật khách quan của tự nhiên"],2],["Theo chủ nghĩa duy vật biện chứng, hình thức vận động nào cao nhất và phức tạp nhất?",["Vận động cơ học","Vận động sinh học","Vận động hóa học","Vận động xã hội"],3],["Phương pháp tư duy nào nhận thức đối tượng trong các mối liên hệ phổ biến vốn có của nó?",["Phương pháp tư duy siêu hình","Phương pháp thực chứng kinh nghiệm","Phương pháp tư duy biện chứng","Phương pháp quy nạp – diễn dịch thuần túy"],2],["Trường phái nào thừa nhận sự tồn tại của sự vật nhưng phủ nhận đặc trưng “tự thân tồn tại” của chúng?",["Chủ nghĩa duy vật","Chủ nghĩa nhị nguyên","Thuyết hoài nghi","Chủ nghĩa duy tâm"],3],["Nội dung định nghĩa vật chất của V.I. Lênin có ý nghĩa giải phóng khoa học tự nhiên khỏi khủng hoảng thế giới quan là:",["Vật chất là năng lượng thuần túy","Vật chất là tổng số cảm giác","Vật chất là thực tại khách quan, tồn tại ngoài và không lệ thuộc vào ý thức","Vật chất đồng nhất với khối lượng bất biến"],2],["Từ quan hệ giữa vật chất và ý thức, rút ra nguyên tắc phương pháp luận nào?",["Đề cao tuyệt đối tính chủ quan","Xem nhẹ mọi điều kiện khách quan","Tôn trọng khách quan, đồng thời phát huy tính năng động chủ quan","Quy tất cả về quyết định luận cơ giới"],2],["Theo chủ nghĩa duy vật biện chứng, đặc điểm của vận động là:",["Do ngoại lực siêu nhiên chi phối","Ngẫu nhiên, không phổ biến","Tự thân vận động và mang tính phổ biến","Chỉ thuộc về vật thể vi mô"],2],["Phép biện chứng duy vật có những nguyên lý cơ bản nào?",["Nguyên lý về lượng – chất và nguyên lý phủ định của phủ định","Nguyên lý đồng nhất và nguyên lý không mâu thuẫn","Nguyên lý về mối liên hệ phổ biến và nguyên lý về sự phát triển","Nguyên lý nhân quả và nguyên lý mục đích luận"],2],["Theo triết học Mác – Lênin, các hình thức vận động cơ bản của vật chất gồm:",["Cơ học, tâm lý, đạo đức, xã hội","Cơ học, vật lý, hóa học, sinh học, xã hội","Quang học, âm học, nhiệt học, điện học","Cá thể, cộng đồng, dân tộc, nhân loại"],1],["“Phủ định biện chứng” được hiểu là:",["Phủ định triệt tiêu, cắt đứt hoàn toàn cái cũ","Phủ định ngẫu nhiên, không theo quy luật","Sự phủ định làm tiền đề, tạo điều kiện cho sự phát triển của sự vật","Sự lặp lại nguyên trạng, không có kế thừa"],2],["Phạm trù chỉ giai đoạn chuyển hóa cơ bản về chất do tích lũy lượng đến điểm nút là:",["Độ","Điểm nút","Bước nhảy","Cân bằng tĩnh"],2],["Hình thức vận động thấp nhất và giản đơn nhất của vật chất là:",["Vận động cơ học","Vận động sinh học","Vận động xã hội","Vận động hóa học"],0],["Căn cứ xác định mâu thuẫn chủ yếu và mâu thuẫn thứ yếu là:",["Căn cứ vào số lượng các mặt đối lập","Căn cứ vào tính gay gắt chủ quan cảm nhận","Căn cứ vào vai trò của mâu thuẫn đối với sự tồn tại và phát triển trong từng giai đoạn","Căn cứ vào thời điểm phát sinh mâu thuẫn"],2],["Theo duy vật biện chứng, hình thức vận động cao nhất và phức tạp nhất là:",["Vận động vật lý","Vận động hóa học","Vận động sinh học","Vận động xã hội"],3],["Vai trò của việc giải quyết “vấn đề cơ bản của triết học” đối với phân loại triết học là:",["Làm rõ phạm vi của logic hình thức","Tiêu chuẩn xác định lập trường thế giới quan của triết gia và học thuyết","Căn cứ để chia các ngành khoa học tự nhiên","Cơ sở để phân loại các trường phái ngôn ngữ học"],1],["Khẳng định tính thứ nhất của ý thức, chủ nghĩa duy tâm chủ quan coi:",["Ý thức xã hội là bản nguyên","Ý niệm tuyệt đối là bản thể","Ý thức con người là bản nguyên","Tinh thần khách quan là bản thể"],2],["Điểm tương đồng của các quan niệm duy vật thời cổ đại về vật chất là:",["Vật chất là trường lực vô hình","Vật chất là tập hợp quy luật","Đồng nhất vật chất với vật thể cụ thể","Đồng nhất vật chất với không – thời gian"],2],["Theo chủ nghĩa duy vật biện chứng, các dạng vật chất cụ thể biểu hiện sự tồn tại của mình ở đâu và bằng gì?",["Ngoài không – thời gian, nhờ vào nhận thức","Trong ý thức, nhờ vào tinh thần","Trong không gian, thời gian và biểu hiện qua vận động","Trong ngôn ngữ, nhờ vào ký hiệu"],2],["Hình thức tồn tại của vật chất vận động xét về độ dài diễn biến và sự kế tiếp quá trình là:",["Không gian","Quan hệ","Nhân quả","Thời gian"],3],["Những cố gắng huy động mọi tiềm năng để vượt trở ngại, đạt mục tiêu được gọi là:",["Nhu cầu","Ý chí","Tình cảm","Thói quen"],1],["Điền vào chỗ trống: “Tiến hóa là một dạng của phát triển, … và thường là sự biến đổi hình thức của tồn tại xã hội từ đơn giản đến phức tạp.”",["diễn ra theo chu kỳ khép kín","diễn ra bằng bước nhảy đột ngột","diễn ra theo cách từ từ","diễn ra do ngoại lực siêu hình"],2],["Ph. Ăngghen dựa trên cơ sở nào để sắp xếp 5 hình thức vận động từ thấp đến cao?",["Trình độ ý thức của con người","Mức độ nhận thức khoa học","Trình độ kết cấu của thế giới vật chất","Tính phức tạp của ngôn ngữ triết học"],2],["Theo chủ nghĩa duy vật biện chứng, điều nào sai khi nói về “đứng im”?",["Đứng im là trạng thái tương đối","Đứng im là hình thức đặc biệt của vận động","Đứng im là sự cân bằng tạm thời","Đứng im là tuyệt đối"],3],["Ý nghĩa phương pháp luận từ nguyên lý phát triển của triết học Mác – Lênin là:",["Xem sự vật ở trạng thái bất biến","Chỉ quan tâm nguồn gốc sự vật","Phải xem sự vật trong quá trình vận động và phát triển đi lên","Loại bỏ mọi mâu thuẫn trong phân tích"],2],["Theo chủ nghĩa duy vật biện chứng, phạm trù chỉ tính có thực của thế giới xung quanh là:",["Bản chất","Hiện tượng","Tồn tại","Ý niệm"],2],["Phương pháp tư duy nào coi nguyên nhân biến đổi nằm bên ngoài đối tượng?",["Phương pháp mô tả thuần túy","Phương pháp tư duy siêu hình","Phương pháp lôgic hình thức","Phương pháp biện chứng khách quan"],1],["Ai khẳng định “ý niệm tuyệt đối” là bản thể sinh ra toàn bộ thế giới hiện thực?",["Aristoteles","Kant","Hêghen (Hegel)","Feuerbach"],2],["Trạng thái vận động nào chưa làm thay đổi cơ bản về chất của sự vật?",["Vận động nhảy vọt","Vận động cách mạng","Vận động trong thăng bằng","Vận động đột biến"],2],["Nhà triết học duy danh nào cho rằng cái riêng là tồn tại cảm tính trực tiếp?",["Spinoza","Hegel","Occam","Descartes"],2],["Hạt nhân lý luận của thế giới quan theo triết học Mác – Lênin là:",["Sử học","Khoa học tự nhiên","Triết học","Đạo đức học"],2],["Điều kiện cần và đủ cho sự ra đời của ý thức theo chủ nghĩa duy vật biện chứng là:",["Lao động cơ khí và kỹ năng","Ngôn ngữ và công cụ","Tiền đề tự nhiên và xã hội","Sản xuất và trao đổi hàng hóa"],2],["Lần đầu tiên, Mác – Ăngghen công khai tính giai cấp của triết học, biến triết học thành vũ khí tinh thần của:",["Giai cấp tư sản","Giai cấp nông dân","Giai cấp vô sản","Giai cấp trung lưu"],2],["Phạm trù nào dùng để chỉ hình thức tồn tại của vật chất?",["Hình thái và cấu trúc","Vật chất và năng lượng","Không gian và thời gian","Bản chất và hiện tượng"],2],["Chủ nghĩa nhị nguyên có cùng bản chất với khuynh hướng nào?",["Chủ nghĩa kinh nghiệm","Chủ nghĩa duy tâm","Chủ nghĩa thực chứng","Chủ nghĩa vị lợi"],1],["Theo biện chứng duy vật, “phủ định biện chứng” là:",["Sự triệt tiêu hoàn toàn cái cũ","Sự phủ nhận ngẫu nhiên","Sự phủ định làm tiền đề cho sự phát triển","Sự quay trở lại trạng thái ban đầu"],2],["Theo chủ nghĩa duy vật biện chứng, mối liên hệ phổ biến có các tính chất nào?",["Ngẫu nhiên và chủ quan","Tạm thời và biệt lập","Tính khách quan, tính phổ biến, tính phong phú đa dạng","Tuyệt đối và bất biến"],2],["Hình thức tồn tại của vật chất xét về quảng tính, trật tự, cấu trúc và tác động là:",["Thời gian","Quan hệ nhân quả","Không gian","Vận động"],2],["Phạm trù nào chỉ giới hạn tồn tại của sự vật, trong đó biến đổi lượng chưa làm thay đổi chất?",["Bước nhảy","Điểm nút","Độ","Chu kỳ"],2],["V.I. Lênin sinh ngày tháng năm nào?",["15/03/1869","22/04/1870","09/01/1871","01/05/1872"],1],["Khi xét chiều sâu thế giới nội tâm, ý thức có các cấp độ:",["Bản năng – nhận thức – lý trí","Cảm giác – tri giác – hồi tưởng","Tự ý thức – tiềm thức – vô thức","Tình cảm – ý chí – tâm linh"],2],["Ưu điểm của chủ nghĩa duy vật trước Mác về bản chất thế giới là:",["Đồng nhất vật chất với cảm giác","Thừa nhận tồn tại khách quan của thế giới vật chất","Phủ nhận mọi vận động","Tuyệt đối hóa tinh thần"],1],["Năm 1842, C.Mác trở thành biên tập viên linh hồn của tờ báo nào?",["Tờ Nhân dân","Tờ Ánh sáng mới","Tờ báo Sông Ranh (Rheinische Zeitung)","Tờ Tự do Đức"],2],["Ăngghen sinh ngày tháng năm nào?",["05/05/1818","28/11/1820","14/03/1824","22/04/1870"],1],["Ý nghĩa phương pháp luận của việc nghiên cứu cặp phạm trù “tất nhiên và ngẫu nhiên” là gì?",["Chỉ cần quan tâm đến tất nhiên, bỏ qua ngẫu nhiên","Không thể nhận thức tất nhiên trong đời sống","Chỉ có thể tìm ra tất nhiên thông qua việc nghiên cứu những ngẫu nhiên mà tất nhiên đi qua","Tất nhiên và ngẫu nhiên luôn tách rời nhau"],2],["Hình thức tồn tại của vật chất vận động xét về độ dài diễn biến, sự kế tiếp các quá trình là:",["Nguyên nhân","Không gian","Quan hệ","Thời gian"],3],["Triết học nào khẳng định thế giới vật chất tồn tại vĩnh viễn, vô tận, không được sinh ra và không mất đi?",["Chủ nghĩa duy tâm khách quan","Chủ nghĩa kinh nghiệm","Chủ nghĩa duy vật biện chứng","Chủ nghĩa thực chứng"],2],["Khi nước chuyển từ lỏng sang khí tại nhiệt độ sôi (trong điều kiện bình thường), đó là minh họa cho quy luật nào?",["Tích lũy lượng","Điểm nút","Độ ổn định","Bước nhảy"],3],["Theo chủ nghĩa duy vật biện chứng, phát biểu nào sau đây đúng?",["Không gian và thời gian tồn tại độc lập với vật chất","Thời gian tồn tại nhưng không có không gian","Không gian – thời gian do ý thức con người tạo ra","Không gian và thời gian là hình thức tồn tại của vật chất, không tách rời vật chất"],3],["Ví dụ nào minh họa đúng quy luật mâu thuẫn trong tiến hóa sinh giới?",["Quang hợp và hô hấp","Đồng hóa và dị hóa","Sinh trưởng và suy tàn","Bảo tồn và tiêu hao năng lượng"],1],["Theo triết học Mác – Lênin, phạm trù “nguyên nhân” là gì?",["Mối liên hệ ngẫu nhiên giữa các hiện tượng","Tính chủ quan trong nhận thức","Sự tác động lẫn nhau giữa các mặt trong một sự vật hoặc giữa các sự vật gây nên biến đổi nhất định","Kết quả trực tiếp của tư duy logic"],2],["Điền vào chỗ trống trong câu nói của C. Mác: “Phương pháp … của tôi không những khác phương pháp của Hêghen, mà còn đối lập hẳn với phương pháp ấy”.",["Thực nghiệm","Siêu hình","Lôgic – hình thức","Biện chứng"],3],["Trong triết học Mác – Lênin, “điểm nút” là gì?",["Mốc đánh dấu sự ổn định của chất","Giai đoạn lặp lại của sự phát triển","Thời điểm mà sự thay đổi lượng dẫn đến thay đổi về chất","Vận động thuần túy không đổi chất"],2],["Theo triết học Mác – Lênin, tiền đề cho sự thống nhất của thế giới là:",["Ý niệm tuyệt đối","Linh hồn vũ trụ","Sự tồn tại của thế giới vật chất","Cảm giác con người"],2],["Trong triết học Mác – Lênin, phạm trù ngẫu nhiên được hiểu là gì?",["Mối liên hệ mang tính tất yếu, quyết định bản chất của sự vật","Mối liên hệ do bản thân sự vật tự quy định","Mối liên hệ xuất hiện tất yếu, không thể khác được","Mối liên hệ không bản chất, do nguyên nhân bên ngoài quy định; có thể xuất hiện hoặc không; có thể xuất hiện theo cách này hoặc cách khác"],3],["Chủ nghĩa duy vật biện chứng khẳng định vai trò quyết định của vật chất đối với ý thức ở điểm nào sau đây?",["Ý thức quyết định sự vận động của vật chất","Vật chất quyết định nguồn gốc, nội dung, bản chất, sự vận động và phát triển của ý thức","Vật chất và ý thức ngang nhau về vai trò quyết định","Ý thức có trước, vật chất có sau"],1],["Phép biện chứng duy vật bao gồm những nguyên lý cơ bản nào?",["Nguyên lý đồng nhất và nguyên lý không mâu thuẫn","Nguyên lý về mối liên hệ phổ biến và nguyên lý về sự phát triển","Nguyên lý nhân quả và nguyên lý thực chứng","Nguyên lý quy giản và nguyên lý công cụ"],1],["Theo triết học Mác – Lênin, “cái chung” là gì?",["Chỉ những thuộc tính riêng biệt của từng sự vật","Những mặt, thuộc tính không chỉ có ở một sự vật mà còn lặp lại ở nhiều sự vật, hiện tượng khác","Những yếu tố ngẫu nhiên, không ổn định của sự vật","Những dấu hiệu cảm tính thuần tuý, nhất thời"],1],["Khẳng định nào sau đây là đúng về bản chất của ý thức?",["Ý thức là vật chất đã phát triển đến trình độ cao","Ý thức là hình ảnh chủ quan của thế giới khách quan","Ý thức là “vật tự nó” tồn tại độc lập","Ý thức là tập hợp cảm giác rời rạc"],1],["Quan điểm nào xem vật chất, vận động, không gian, thời gian như những thực thể tách rời, không liên hệ nội tại?",["Chủ nghĩa duy vật chất phác thời cổ đại","Chủ nghĩa duy vật siêu hình thế kỷ XVII–XVIII","Chủ nghĩa duy tâm khách quan cổ điển Đức","Chủ nghĩa kinh nghiệm phê phán hiện đại"],1],["Theo triết học Mác – Lênin, hình thức phản ánh cao nhất trong thế giới vật chất là:",["Phản xạ sinh học","Phản ánh tâm lý","Phản ánh ý thức","Phản hồi cơ học"],2],["Theo chủ nghĩa duy vật biện chứng, phạm trù nào chỉ tính có thực của thế giới xung quanh con người?",["Bản chất","Tồn tại","Hiện tượng","Khái niệm"],1],["Hình thức tồn tại của vật chất là:",["Năng lượng, trường","Không gian, thời gian","Lực, chuyển động","Chất, lượng"],1],["Nhà triết học duy danh nào coi cảm giác là hình thức tồn tại của cái riêng?",["Locke","Berkeley","Hume","Bacon"],1],["Theo triết học Mác – Lênin, sự phát triển có những tính chất nào?",["Tính chủ quan; tính cục bộ; tính gián đoạn","Tính ngẫu nhiên; tính biệt lập; tính tuần hoàn","Tính khách quan; tính phổ biến; tính kế thừa; tính đa dạng, phong phú","Tính tất định cơ giới; tính ổn định tuyệt đối"],2],["Xét theo chiều sâu đời sống nội tâm, kết cấu của ý thức gồm:",["Cảm giác, tri giác, biểu tượng","Tư duy, ngôn ngữ, trí nhớ","Tự ý thức, tiềm thức, vô thức","Tình cảm, ý chí, thói quen"],2],["Đặc trưng kế thừa, qua khâu trung gian, tính lặp lại và tiến lên của phát triển biện chứng được mô phỏng theo đồ thức nào?",["Đường thẳng tuyến tính","Chu kỳ khép kín","Đường xoáy ốc","Dao động tuần hoàn"],2],["Theo chủ nghĩa duy vật biện chứng, “tính thống nhất vật chất của thế giới” khẳng định điều gì?",["Thế giới thống nhất ở tính tinh thần","Bản chất của thế giới là vật chất, thế giới thống nhất ở tính vật chất","Vật chất và ý thức đồng nguyên, đồng nhất","Thế giới do ý niệm tuyệt đối sinh ra"],1],["Đêmôcrít quan niệm cơ sở đầu tiên của mọi vật trong vũ trụ là:",["Tứ đại: đất, nước, lửa, khí","Nguyên tử","Ý niệm tuyệt đối","Hình dạng và trật tự"],1],["Vì sao trong tồn tại, các nhóm sự vật dần hình thành những điểm chung?",["Do ngẫu nhiên thuần túy, không liên hệ","Vì các sự vật, hiện tượng liên hệ, tương tác, chuyển hóa nên xuất hiện thuộc tính chung","Do quy ước của ngôn ngữ hằng ngày","Do tri giác chủ quan của con người"],2],["Quan điểm nào khẳng định thế giới vật chất không do ai sinh ra, không tự mất đi, tồn tại vĩnh viễn, vô hạn, vô tận?",["Chủ nghĩa duy tâm khách quan","Chủ nghĩa duy vật biện chứng","Thuyết khả tri hoài nghi","Chủ nghĩa kinh nghiệm cực đoan"],1],["Theo chủ nghĩa duy vật biện chứng, cấp độ cao nhất của cấu trúc vật chất là:",["Tế bào sống","Hệ sinh thái","Xã hội loài người","Vũ trụ vật lý"],2],["Quan điểm nào giải thích đúng thuật ngữ “phát triển bền vững” trong kinh tế học hiện đại?",["Tăng trưởng nhanh trong ngắn hạn","Tối đa hóa lợi nhuận hiện tại","Phát triển hiện tại vẫn bảo đảm khả năng phát triển của các thế hệ tương lai","Ổn định tuyệt đối, không thay đổi"],2],["Trường phái nào quan niệm ý thức là nguyên thể đầu tiên, vĩnh viễn, sinh thành và chi phối thế giới vật chất?",["Chủ nghĩa duy vật chất phác","Chủ nghĩa duy tâm","Thuyết nhị nguyên Descartes","Chủ nghĩa kinh nghiệm thực chứng"],1],["Trong “Chống Đuyrinh”, Ăngghen định nghĩa phép biện chứng là:",["Khoa học về tư duy hình thức","Nghệ thuật tranh luận hùng biện","Môn khoa học về những quy luật phổ biến của vận động và phát triển của tự nhiên, xã hội và tư duy","Phép quy nạp từ kinh nghiệm"],2],["Phạm trù nào là cơ sở phương pháp luận để nắm bắt các hình thức tồn tại của sự vật, phản ánh tính đa dạng của nhận thức và thực tiễn?",["Bản chất, hiện tượng","Cái riêng, cái chung","Nội dung, hình thức","Nguyên nhân, kết quả"],1],["Phương pháp tư duy nào coi nguyên nhân biến đổi nằm bên ngoài đối tượng?",["Phương pháp lịch sử – cụ thể","Phương pháp siêu hình","Phương pháp biện chứng","Phương pháp quy nạp – diễn dịch"],1],["Một trong những nguồn gốc xã hội dẫn đến sự ra đời của triết học là gì?",["Sự phát triển của tôn giáo thần quyền","Lao động trí óc tách khỏi lao động chân tay","Xuất hiện của chế độ chiếm hữu nô lệ","Sự ra đời của chữ viết và nghệ thuật"],1],["Theo chủ nghĩa duy vật biện chứng, hình thức vận động thấp nhất và giản đơn nhất là:",["Vận động sinh học","Vận động xã hội","Vận động cơ học","Vận động hóa học"],2],["Nhà triết học nào cho rằng nguồn gốc của ý thức là “ý niệm tuyệt đối”, là bản thể sinh ra toàn bộ thế giới hiện thực?",["Kant","Hêghen","Feuerbach","Berkeley"],1],["Phạm trù nào chỉ tổng thể các mối liên hệ khách quan, tất nhiên, tương đối ổn định bên trong, quy định sự vận động và phát triển của sự vật?",["Hiện tượng","Bản chất","Quy luật","Hình thức"],1],["Theo chủ nghĩa duy vật biện chứng, bản chất của ý thức là:",["Tự sản sinh từ bản năng sinh học","Sự phản ánh hiện thực khách quan một cách tích cực, sáng tạo","Do Thượng đế ban tặng cho con người","Chỉ là cảm giác thuần túy bên ngoài"],1],["Trường phái nào quan niệm rằng “óc tiết ra ý thức như gan tiết ra mật”?",["Chủ nghĩa duy tâm chủ quan","Chủ nghĩa duy vật tầm thường thế kỷ XVIII","Chủ nghĩa kinh nghiệm phê phán","Thuyết nhị nguyên Descartes"],1],["Theo triết học Mác – Lênin, khái niệm nào chỉ sự quy định, tác động và chuyển hóa lẫn nhau giữa các sự vật, hiện tượng?",["Quy luật","Bản chất","Mối liên hệ","Kết cấu"],2],["Theo chủ nghĩa duy vật biện chứng, điều kiện cần và đủ cho sự ra đời của ý thức là:",["Lao động tập thể","Sự phát triển của ngôn ngữ","Nguồn gốc tự nhiên và nguồn gốc xã hội","Phát triển của công cụ sản xuất"],2],["Thành ngữ “Góp gió thành bão” thể hiện quy luật nào trong phép biện chứng?",["Phủ định của phủ định","Tích lũy về lượng dẫn đến biến đổi về chất","Thống nhất và đấu tranh của các mặt đối lập","Chuyển hóa giữa nguyên nhân và kết quả"],1],["Theo triết học Mác – Lênin, phạm trù nào thể hiện quan hệ giữa hai đối tượng khi sự thay đổi của một tất yếu dẫn đến thay đổi của đối tượng kia?",["Mâu thuẫn","Quy luật","Liên hệ","Thực tiễn"],2],["Những cặp phạm trù nào là cơ sở phương pháp luận để chỉ ra các mối liên hệ và sự phát triển của các sự vật như quá trình tự nhiên?",["Bản chất – hiện tượng; nguyên nhân – kết quả","Cái riêng – cái chung; tất nhiên – ngẫu nhiên","Nội dung – hình thức; khả năng – hiện thực","Toàn thể – bộ phận; lượng – chất"],1],["Trường phái nào thừa nhận sự tồn tại của sự vật, hiện tượng nhưng phủ nhận tính “tự thân tồn tại” của chúng?",["Chủ nghĩa hiện thực phê phán","Chủ nghĩa duy tâm","Chủ nghĩa duy vật biện chứng","Thuyết nhị nguyên Descartes"],1],["Ý nghĩa phương pháp luận của việc tìm hiểu quy luật thống nhất và đấu tranh của các mặt đối lập là gì?",["Phải tuyệt đối hóa một mặt của mâu thuẫn để giải quyết xung đột","Phải giải quyết mâu thuẫn bằng điều hòa, tránh đấu tranh","Phải chỉ dựa vào điều kiện chủ quan của chủ thể để xử lý mâu thuẫn","Bao gồm tất cả các nguyên tắc: thừa nhận tính khách quan của mâu thuẫn, giải quyết trên cơ sở điều kiện khách quan và xem xét quá trình phát sinh – phát triển của mâu thuẫn"],3],["Đối tượng của triết học Mác – Lênin là:",["Mọi hiện tượng siêu nhiên và thần học","Quan hệ vật chất–ý thức trên lập trường duy vật biện chứng và các quy luật vận động, phát triển chung nhất của tự nhiên, xã hội, tư duy","Nghệ thuật biện luận và hùng biện thuần túy","Lịch sử các học thuyết triết học cổ đại"],1],["Hình thức nào được xem là “đỉnh cao” của phép biện chứng?",["Phép biện chứng cổ đại phương Đông","Phép biện chứng duy tâm Đức","Phép biện chứng duy vật","Phép siêu hình thực chứng"],2],["Học thuyết nào khẳng định con người có khả năng nhận thức được thế giới?",["Bất khả tri luận","Khả tri luận","Hoài nghi luận","Duy tâm chủ quan"],1],["Theo chủ nghĩa duy vật biện chứng, nguồn gốc xã hội của ý thức là:",["Trao đổi hàng hoá và thị trường","Lao động và ngôn ngữ","Bản năng sinh học bẩm sinh","Tôn giáo và nghi lễ cộng đồng"],1],["Phạm trù chỉ giai đoạn chuyển hoá cơ bản về chất do tích luỹ lượng trước đó gây ra là:",["Phủ định của phủ định","Lượng – chất","Bước nhảy","Điểm nút"],2],["Ý nghĩa phương pháp luận rút ra từ cặp phạm trù “nội dung – hình thức” là:",["Hình thức quyết định tuyệt đối nội dung","Hình thức chỉ thúc đẩy nội dung khi phù hợp với nội dung","Nội dung phải tuân theo mọi khuôn mẫu hình thức","Có thể thay hình thức bất kỳ mà không ảnh hưởng nội dung"],1],["Học thuyết nào khẳng định con người có khả năng nhận thức được thế giới?",["Duy tâm khách quan","Thuyết nhị nguyên","Khả tri luận","Thực chứng luận"],2],["Triết học nào xem thế giới như một cỗ máy cơ giới khổng lồ, các bộ phận biệt lập và tĩnh tại?",["Chủ nghĩa duy vật lịch sử","Chủ nghĩa duy vật siêu hình","Chủ nghĩa duy tâm tuyệt đối","Chủ nghĩa hiện sinh"],1],["Sự dịch chuyển vị trí của vật thể trong không gian là đặc trưng của hình thức vận động nào?",["Vận động sinh học","Vận động hoá học","Vận động cơ học","Vận động xã hội"],2],["Điền đúng cụm từ còn thiếu: “Trước hết là …; sau lao động và đồng thời với lao động là …; đó là hai kích thích chủ yếu làm bộ óc vượn dần thành bộ óc người.”",["Ngôn ngữ; lao động","Công cụ; ngôn ngữ","Lao động; ngôn ngữ","Tập quán; tri thức"],2],["Yếu tố nào là sự thống nhất hữu cơ giữa tri thức và tình cảm, điều khiển – thúc đẩy con người vượt khó để hoạt động hiệu quả?",["Nhu cầu sinh lý","Thói quen hành vi","Ý chí","Bản năng tự vệ"],2],["Phương pháp tư duy nào nhận thức đối tượng ở trạng thái cô lập, tách rời khỏi các mối quan hệ?",["Phương pháp lịch sử – cụ thể","Phương pháp siêu hình","Phương pháp biện chứng","Phương pháp hệ thống – cấu trúc"],1],["Sự ra đời của triết học Mác làm thay đổi chức năng xã hội của triết học như thế nào?",["Chỉ dừng ở giải thích thế giới đã có","Trở thành công cụ nhận thức khoa học để cải tạo thế giới bằng cách mạng","Quay về chiêm nghiệm thuần túy tinh thần","Chuyển sang nghiên cứu ngôn ngữ học"],1],["Vai trò của lao động và ngôn ngữ đối với sự hình thành, phát triển của ý thức là:",["Làm tăng phản xạ sinh học đơn thuần","Chuyển biến bộ óc vượn người thành bộ óc người và tâm lý động vật thành ý thức người","Chỉ giúp tích lũy kinh nghiệm cá thể","Chỉ nâng cao trí nhớ cảm tính"],1],["Phát minh khoa học tự nhiên cuối thế kỷ XIX – đầu XX đặt cơ sở đầu tiên bác bỏ quan niệm “vật chất đồng nhất với nguyên tử” là:",["Electron của J. J. Thomson","Hiện tượng phóng xạ của Becquerel","Tia X của Rơnghen (Röntgen)","Thuyết lượng tử của Planck"],2],["Việc phân loại các hình thức vận động, theo Ph. Ăngghen, đã đặt cơ sở nào cho khoa học?",["Phân biệt mô tả, không cần hệ thống","Phân loại – phân ngành và hợp loại – hợp ngành khoa học","Thay thế mọi ngành bằng triết học","Chỉ còn lại một khoa học thống nhất"],1],["Nhà duy tâm Berkeley cho rằng nền tảng của mối liên hệ giữa các đối tượng là:",["Quy ước ngôn ngữ thuần túy","Ý niệm bẩm sinh tiên nghiệm","Cảm giác (tri giác) của chủ thể","Thực thể vật chất tự thân"],2],["Theo triết học Mác – Lênin, hình thức phản ánh cao nhất trong thế giới vật chất là:",["Phản xạ sinh học","Phản ánh tâm lý","Phản ánh ý thức","Phản hồi cơ học"],2],["Theo quan điểm Mác – Lênin, phát triển là:",["Sự lặp lại tuần hoàn như cũ","Thay đổi ngẫu nhiên, không quy luật","Vận động từ thấp đến cao, từ kém hoàn thiện đến hoàn thiện hơn, từ chất cũ đến chất mới","Tăng về lượng nhưng giữ nguyên chất"],2],["Quan niệm về vật chất của chủ nghĩa duy vật siêu hình thế kỷ XVII–XVIII là:",["Đồng nhất vật chất với năng lượng","Đồng nhất vật chất với khối lượng","Đồng nhất vật chất với lực hấp dẫn","Đồng nhất vật chất với không gian"],1],["Điền vào chỗ trống: “Vật chất là một phạm trù triết học dùng để chỉ thực tại khách quan được đem lại cho con người trong ……, được …… của chúng ta chép lại, chụp lại, phản ánh và tồn tại không lệ thuộc vào ……”.",["Trực giác; ý thức; lý trí","Cảm giác; cảm giác; cảm giác","Trải nghiệm; tri giác; tư duy","Nhận thức; ký ức; ngôn ngữ"],1],["Trong phép biện chứng duy vật, phạm trù nào chỉ những mặt, đặc điểm chỉ vốn có ở một sự vật, không lặp lại ở sự vật khác?",["Cái chung","Cái phổ biến","Cái đơn nhất","Cái bản chất"],2],["Nghiên cứu nguyên lý về sự phát triển cho thấy muốn nắm bản chất, khuynh hướng vận động của sự vật phải tuân thủ nguyên tắc nào?",["Nguyên tắc lịch sử – cụ thể","Nguyên tắc phát triển","Nguyên tắc toàn diện","Nguyên tắc khách quan"],1],["Kiểu phản ánh nào chủ động lựa chọn, xử lý thông tin, tạo thông tin mới và phát hiện ý nghĩa của thông tin?",["Phản xạ sinh học","Phản ánh tâm lý","Ý thức","Sao chép cơ học"],2],["Trong lịch sử triết học, ai là người đầu tiên xác lập đối tượng triết học một cách hợp lý nhất?",["Hêghen","C. Mác","Kant","Feuerbach"],1],["Nguồn gốc của triết học được xác định là:",["Nguồn gốc tôn giáo và thần thoại","Nguồn gốc nhận thức và nguồn gốc xã hội","Nguồn gốc kinh tế và chính trị","Nguồn gốc tự nhiên thuần túy"],1],["Hình thức đầu tiên của phép biện chứng là gì?",["Phép biện chứng duy tâm","Phép biện chứng tự phát","Phép biện chứng cổ điển Đức","Phép biện chứng duy vật"],1],["Theo duy vật biện chứng, bản chất của ý thức là:",["Bản năng sinh học đã tinh luyện","Hình ảnh chủ quan của thế giới khách quan; quá trình phản ánh tích cực, sáng tạo","Sự sao chép thụ động hiện thực bên ngoài","Sản phẩm thuần túy của ngôn ngữ"],1],["Theo triết học Mác – Lênin, khái niệm nào chỉ toàn bộ quan điểm về thế giới và vị trí con người trong đó?",["Nhận thức luận","Thế giới quan","Phương pháp luận","Lôgic học"],1],["Hình thức nào được xem là đỉnh cao của phép biện chứng?",["Phép biện chứng cổ đại","Phép biện chứng duy tâm","Phép biện chứng duy vật","Phép siêu hình hiện đại"],2],["Mặt thứ nhất của vấn đề cơ bản trong triết học theo quan điểm duy vật khẳng định:",["Ý thức có trước, vật chất có sau","Vật chất có trước, ý thức có sau; vật chất quyết định ý thức","Vật chất và ý thức đồng nguyên","Ý niệm tuyệt đối sinh ra vật chất"],1],["Khẳng định nào diễn đạt đúng “tính thống nhất vật chất của thế giới”?",["Thế giới thống nhất ở tính tinh thần","Bản chất của thế giới là vật chất; thế giới thống nhất ở tính vật chất","Thế giới thống nhất ở luật lôgic hình thức","Thế giới do ý niệm tuyệt đối quy định"],1],["Điểm khác biệt giữa phản ánh ý thức và các hình thức phản ánh khác là:",["Có tính ngẫu nhiên, rời rạc","Chỉ sao chép nguyên xi hiện thực","Có tính tích cực, sáng tạo","Hoàn toàn không phụ thuộc chủ thể"],2],["Theo chủ nghĩa Mác – Lênin, triết học là:",["Là khoa học về những quy luật vận động, phát triển chung nhất của tự nhiên","Là khoa học về những quy luật vận động, phát triển chung nhất của xã hội và tư duy","Là hệ thống quan điểm lý luận chung nhất về thế giới và vị trí con người trong thế giới đó","Tất cả"],3],["Vai trò của lao động và ngôn ngữ đối với sự hình thành và phát triển của ý thức là:",["Chỉ giúp tăng trí nhớ cảm tính của cá thể","Làm phong phú kinh nghiệm nhưng không đổi chất","Làm chuyển biến bộ óc vượn thành bộ óc người và tâm lý động vật thành ý thức con người","Chỉ hỗ trợ giao tiếp ở mức bản năng"],2],["Tác phẩm nào của V. I. Lênin nghiên cứu, bổ sung và phát triển phép biện chứng duy vật?",["Nhà nước và cách mạng","Bút ký triết học","Chủ nghĩa đế quốc – giai đoạn tột cùng của CNTB","Chủ nghĩa duy vật và chủ nghĩa kinh nghiệm phê phán"],1],["Một trong những đặc trưng bản chất của ý thức là:",["Tính sao chép thụ động hiện thực","Tính tích cực, sáng tạo gắn bó chặt chẽ với thực tiễn xã hội","Tính ngẫu hứng, phi mục đích","Tính tự phát thuần sinh học"],1],["Điền vào chỗ trống: “Vấn đề cơ bản lớn của mọi triết học, đặc biệt là của triết học hiện đại, là vấn đề quan hệ giữa …… với ……”.",["Tồn tại; vật chất","Tư duy; tồn tại","Linh hồn; thể xác","Khoa học; tôn giáo"],1],["Theo duy vật biện chứng, ý thức tác động thế nào đối với vật chất?",["Không thể tác động vì ý thức là tinh thần","Tác động trở lại vật chất thông qua hoạt động thực tiễn của con người","Tác động trực tiếp bằng năng lượng tinh thần","Chỉ tác động trong lĩnh vực mỹ học"],1],["Những cố gắng, nỗ lực huy động mọi tiềm năng để vượt trở ngại và đạt mục tiêu được gọi là:",["Thói quen","Nhu cầu","Ý chí","Bản năng"],2],["Tác phẩm nào của V. I. Lênin đưa ra định nghĩa kinh điển về vật chất, giải quyết triệt để vấn đề cơ bản của triết học?",["Bút ký triết học","Chủ nghĩa duy vật và chủ nghĩa kinh nghiệm phê phán","Biện chứng của tự nhiên","Hệ tư tưởng Đức"],1],["Khẳng định nào sau đây đúng về bản chất của ý thức?",["Ý thức là vật chất ở trình độ cao","Ý thức là hình ảnh chủ quan của thế giới khách quan","Ý thức tồn tại độc lập ngoài xã hội","Ý thức chỉ là tổng hợp cảm giác rời rạc"],1],["Theo triết học Mác – Lênin, phạm trù “nguyên nhân” là:",["Sự kế tiếp ngẫu nhiên của các sự kiện","Sự tương tác giữa các mặt trong một sự vật, hoặc giữa các sự vật với nhau, gây nên biến đổi nhất định","Kết quả cuối cùng của một quá trình","Quy luật vận động của tư duy thuần tuý"],1],["Anaximander quan niệm cơ sở đầu tiên của mọi vật trong vũ trụ là:",["Nước","Không khí","Apeirôn – vật chất đơn nhất, vô định, vô hạn, vĩnh viễn","Lửa"],2],["Thành tựu khoa học nào khắc phục được những hạn chế duy tâm trong quan niệm về xã hội?",["Học thuyết “ý niệm tuyệt đối” của Hêghen","Thuyết tiến hóa xã hội dựa trên chủ nghĩa thực chứng","Định nghĩa về giai cấp của V.I. Lênin","Thuyết “ý chí sống” của Sôpenhauer"],2],["Các lớp cấu trúc của ý thức gồm:",["Tưởng tượng, kinh nghiệm, cảm giác, bản năng","Tri thức, tình cảm, ý chí, niềm tin","Linh cảm, vô thức, tiềm thức, bản ngã","Cảm xúc, hành vi, thói quen, chuẩn mực"],1],["Nguồn gốc lý luận trực tiếp hình thành triết học Mác là:",["Chủ nghĩa duy vật Pháp thế kỷ XVIII","Kinh tế chính trị học cổ điển Anh","Chủ nghĩa xã hội không tưởng phê phán","Triết học cổ điển Đức"],3],["Nội dung và phương thức tồn tại của ý thức là gì?",["Tri thức","Lao động","Giao tiếp","Nhu cầu"],0],["Trong thời đại đế quốc chủ nghĩa, giai cấp tư sản muốn thay thế chủ nghĩa duy vật biện chứng và chủ nghĩa duy vật lịch sử của C. Mác bằng lý luận nào?",["Thuyết bất khả tri và chủ nghĩa kinh nghiệm mới","Chủ nghĩa thực chứng logic thuần túy","Lý luận chiết trung, pha trộn của thế giới quan duy tâm, tôn giáo","Thuyết công cụ của chân lý (pragmatism)"],2],["Chủ nghĩa duy tâm có những hình thức cơ bản nào?",["Chủ nghĩa duy tâm siêu hình và chủ nghĩa duy tâm trực giác","Chủ nghĩa duy tâm kinh nghiệm và chủ nghĩa duy tâm cảm giác","Chủ nghĩa duy tâm thần học và chủ nghĩa duy tâm đạo đức","Chủ nghĩa duy tâm khách quan và chủ nghĩa duy tâm chủ quan"],3],["Trong phép biện chứng duy vật, phạm trù nào dùng để chỉ những biến đổi xuất hiện do sự tương tác giữa các yếu tố mang tính nguyên nhân gây nên?",["Phạm trù nguyên nhân","Phạm trù kết quả","Phạm trù hiện tượng","Phạm trù bản chất"],1],["Căn cứ vào quan hệ giữa các mặt đối lập với sự vật, hiện tượng, có thể phân chia thành những loại mâu thuẫn nào?",["Mâu thuẫn bên trong và mâu thuẫn bên ngoài","Mâu thuẫn chủ quan và mâu thuẫn khách quan","Mâu thuẫn phổ biến và mâu thuẫn cá biệt","Mâu thuẫn cơ bản và mâu thuẫn không cơ bản"],0],["Theo chủ nghĩa duy vật biện chứng, vận động là gì?",["Chỉ sự thay đổi vị trí của vật thể trong không gian","Mọi biến đổi do tác động bên ngoài thuần túy","Sự tăng giảm về lượng trong các sự vật riêng lẻ","Mọi sự thay đổi và mọi quá trình diễn ra trong vũ trụ, từ thay đổi vị trí giản đơn đến tư duy"],3],["Trong phép biện chứng duy vật, quy luật nào vạch ra cách thức chung nhất của sự vận động, phát triển của thế giới hiện thực khách quan?",["Quy luật phủ định của phủ định","Quy luật thống nhất và đấu tranh của các mặt đối lập","Quy luật chuyển hóa từ những thay đổi về lượng dẫn đến những thay đổi về chất và ngược lại","Quy luật phù hợp giữa lực lượng sản xuất và quan hệ sản xuất"],2],["Khi xem xét ý thức theo chiều sâu của thế giới nội tâm con người, yếu tố nào giúp con người thực hiện những hành vi đạo đức một cách tự giác?",["Tập quán xã hội","Tự ý thức","Dư luận xã hội","Pháp luật hiện hành"],1],["Mặt thứ hai trong vấn đề cơ bản của triết học trả lời cho câu hỏi nào dưới đây?",["Thế giới có tồn tại vĩnh viễn hay không?","Con người có khả năng nhận thức được thế giới hay không?","Vật chất hay ý thức có trước?","Bản chất của tồn tại là gì?"],1],["Chọn quan điểm đúng theo triết học Mác – Lênin về tình cảm:",["Tình cảm chỉ là sản phẩm của bản năng sinh học tự nhiên","Tình cảm phản ánh quan hệ giữa người với người và quan hệ giữa người với thế giới khách quan","Tình cảm không có vai trò trong hoạt động nhận thức","Tình cảm chỉ mang tính cá nhân, không gắn với xã hội"],1],["Theo chủ nghĩa duy vật biện chứng, điều kiện cần và đủ cho sự ra đời của ý thức là:",["Sự tiến hóa của tự nhiên thuần túy","Hoạt động ngôn ngữ tự phát","Điều kiện tự nhiên và xã hội","Sự tồn tại của bản năng sinh tồn"],2],["Điền vào chỗ trống: “Phương pháp … của tôi không những khác phương pháp của Hêghen về cơ bản, mà còn đối lập hẳn với phương pháp ấy nữa.”",["Trực quan","Siêu hình","Biện chứng","Thực chứng"],2],["Theo quan niệm của triết học Mác – Lênin, đấu tranh giữa các mặt đối lập là:",["Sự dung hòa để giữ trạng thái cân bằng tĩnh tại","Sự tác động theo xu hướng bài trừ và phủ định lẫn nhau giữa các mặt của sự vật, hiện tượng","Sự vận động không tạo ra biến đổi","Sự thỏa hiệp để loại bỏ mâu thuẫn"],1],["Một trong những nội dung định nghĩa vật chất của V.I. Lênin là:",["Vật chất là sản phẩm của cảm giác con người","Vật chất chỉ tồn tại khi con người nhận thức","Vật chất là thực tại khách quan, tồn tại độc lập với ý thức","Vật chất là cái không thể nhận thức bằng giác quan"],2],["Theo triết học Mác - Lênin, nguồn gốc của sự vận động và phát triển của các sự vật hiện tượng trong thế giới là do:",["Sự tác động từ lực lượng siêu nhiên","Sự sắp đặt của tất định khách quan","Sự đấu tranh giữa các mặt đối lập bên trong sự vật, hiện tượng","Sự biến hóa ngẫu nhiên không quy luật"],2],["Những cố gắng, nỗ lực, khả năng huy động mọi tiềm năng trong mỗi con người vào hoạt động để vượt qua trở ngại, đạt mục tiêu được gọi là:",["Niềm tin","Động cơ","Ý chí","Năng lực"],2],["Căn cứ để phân biệt mâu thuẫn đối kháng và mâu thuẫn không đối kháng trong sự tồn tại và phát triển của sự vật, hiện tượng là:",["Mức độ gay gắt của xung đột cảm xúc","Khả năng dung hòa tạm thời","Sự tồn tại khách quan hay chủ quan","Lợi ích cơ bản đối lập nhau giữa các giai cấp trong một giai đoạn lịch sử nhất định"],3],["Theo triết học Mác – Lênin, phạm trù hình thức là gì?",["Toàn bộ mặt bên ngoài của sự vật","Phương thức tồn tại và phát triển của sự vật, hiện tượng, là hệ thống các mối liên hệ tương đối bền vững giữa các yếu tố của nó","Những yếu tố ngẫu nhiên tạo nên sự vật","Bản chất khách quan của sự vật trong vận động"],1],["Nguyên nhân dẫn đến những hạn chế của phép biện chứng thời cổ đại là:",["Ảnh hưởng thần thoại và tôn giáo","Trình độ nhận thức của con người và khoa học tự nhiên chưa phát triển","Thiếu lập luận logic hình thức","Không quan tâm đến kinh nghiệm thực nghiệm"],1],["Khi xem xét ý thức theo chiều sâu nội tâm con người, các cấp độ của ý thức gồm những yếu tố nào?",["Cảm giác, tri giác, khái niệm","Bản năng, phản xạ, hành vi","Tự ý thức, tiềm thức, vô thức","Lý trí, xúc cảm, kinh nghiệm"],2],["Trong phép biện chứng duy vật, phạm trù nào dùng để chỉ tổng thể tất cả những mặt, yếu tố tạo nên sự vật, hiện tượng?",["Hình thức","Nội dung","Bản chất","Quy luật"],1],["Một trong những nội dung chủ yếu của bước ngoặt cách mạng do C. Mác và Ph. Ăngghen thực hiện trong triết học là:",["Xây dựng học thuyết về ý niệm tuyệt đối","Phê phán tôn giáo từ lập trường vô thần","Sáng tạo ra chủ nghĩa duy vật biện chứng","Khẳng định chân lý tuyệt đối của cảm giác"],2],["Phương pháp tư duy chi phối chủ nghĩa duy vật thế kỷ XV–XVIII là:",["Phương pháp biện chứng chủ quan","Phương pháp tư duy siêu hình","Phương pháp trực giác duy cảm","Phương pháp hiện tượng học"],1],["Khi xem xét ý thức theo chiều sâu thế giới nội tâm con người, kết cấu của ý thức gồm những yếu tố nào?",["Cảm giác, tri giác, tư duy","Tri thức, tình cảm, ý chí","Tự ý thức, tiềm thức, vô thức","Bản năng, cảm xúc, hành vi"],2],["Hình thức đầu tiên của chủ nghĩa duy vật là:",["Chủ nghĩa duy vật biện chứng","Chủ nghĩa duy vật siêu hình","Chủ nghĩa duy vật chất phác","Chủ nghĩa duy vật lịch sử"],2],["Chủ nghĩa duy tâm có những hình thức cơ bản nào?",["Duy tâm thực nghiệm và duy tâm thần học","Duy tâm khách quan và duy tâm sinh học","Chủ nghĩa duy tâm khách quan và chủ nghĩa duy tâm chủ quan","Duy tâm trí tuệ và duy tâm lý tưởng"],2],["Những tri thức mà chủ thể có từ trước, gần như đã trở thành bản năng, kỹ năng, nằm ở tầng sâu ý thức dưới dạng tiềm tàng được gọi là:",["Vô thức","Tiềm thức","Bản năng","Trực giác"],1],["Phép biện chứng duy vật có những nguyên lý cơ bản nào?",["Nguyên lý phủ định của phủ định và nguyên lý lượng – chất","Nguyên lý về mối liên hệ phổ biến và nguyên lý về sự phát triển","Nguyên lý tất yếu và nguyên lý ngẫu nhiên","Nguyên lý logic hình thức và nguyên lý siêu hình"],1],["Trên cơ sở phạm trù cái riêng và cái chung, tại sao các nhóm sự vật trong sự tồn tại của mình lại dần hình thành những điểm chung?",["Do sự ảnh hưởng của tư duy con người","Do sự áp đặt của chủ quan logic","Các sự vật, hiện tượng riêng lẻ có liên hệ, tương tác, chuyển hóa lẫn nhau nên hình thành thuộc tính chung","Do chúng có cùng nguồn gốc lịch sử xã hội"],2],["Chủ nghĩa duy vật và chủ nghĩa duy tâm đối lập nhau về phương diện nào?",["Phương pháp luận nhận thức","Thế giới quan","Quy luật logic biện chứng","Lý thuyết kinh tế - xã hội"],1],["Nhà triết học Đêmôcrít quan niệm cơ sở đầu tiên của mọi vật trong vũ trụ là gì?",["Bản thể thuần lý","Ý niệm tuyệt đối","Nguyên tử","Chân lý cảm tính"],2],["Những hiện tượng tâm lý không do lý trí điều khiển, nằm ngoài phạm vi kiểm soát của ý thức trong một thời điểm nhất định được gọi là gì?",["Tiềm thức","Vô thức","Trực giác","Bản năng"],1],["Yếu tố nào là sự thống nhất hữu cơ giữa tri thức và tình cảm, có vai trò điều khiển, thúc đẩy con người vượt qua khó khăn?",["Niềm tin","Khát vọng","Ý chí","Động cơ"],2],["Theo chủ nghĩa duy vật biện chứng, mối quan hệ giữa vận động và đứng im là gì?",["Đứng im phủ định hoàn toàn vận động","Đứng im là trạng thái vĩnh viễn","Vận động là tuyệt đối, đứng im là tương đối, không tách rời nhau","Vận động chỉ tồn tại khi không có đứng im"],2],["Theo quan điểm của chủ nghĩa duy tâm, vai trò của vật chất đối với ý thức là gì?",["Vật chất quyết định toàn bộ nội dung của ý thức","Vật chất tồn tại độc lập và sinh ra ý thức","Ý thức là cái có trước, tuyệt đối, từ đó sinh ra tất cả","Ý thức chỉ phản ánh vật chất một cách thụ động"],2],["Trong những năm 30 – 40 của thế kỷ XIX, địa vị chính trị của giai cấp công nhân thay đổi như thế nào?",["Vẫn lệ thuộc vào giai cấp tư sản","Chỉ tồn tại dưới dạng tự phát và phân tán","Trở thành lực lượng chính trị độc lập trong xã hội tư bản","Chưa có tổ chức và chưa hình thành đấu tranh giai cấp"],2],["Khẳng định tính thứ nhất của ý thức, chủ nghĩa duy tâm chủ quan cho rằng:",["Ý thức là sản phẩm của kinh nghiệm xã hội","Ý thức cá nhân con người là thực tại duy nhất có trước","Ý thức chỉ là sự phản ánh vật chất","Ý thức không có quan hệ với thực tiễn"],1],["Vai trò của triết học Mác – Lênin trong sự nghiệp đổi mới toàn diện ở Việt Nam theo định hướng xã hội chủ nghĩa là gì?",["Cung cấp kinh nghiệm lịch sử về cách mạng tư sản","Đưa ra mô hình xã hội không giai cấp","Là cơ sở lý luận khoa học, mà hạt nhân là phép biện chứng duy vật","Thay thế toàn bộ hệ tư tưởng truyền thống dân tộc"],2],["Thuật ngữ triết học “Dar’sana” xuất hiện ở quốc gia nào?",["Hy Lạp cổ đại","Trung Hoa cổ đại","Ấn Độ cổ đại","Ai Cập cổ đại"],2],["Quan điểm của chủ nghĩa duy vật biện chứng về vai trò quyết định của vật chất đối với ý thức là:",["Ý thức quyết định bản chất của vật chất","Vật chất quyết định nguồn gốc, nội dung, bản chất, vận động và phát triển của ý thức","Ý thức và vật chất hoàn toàn tách rời nhau","Vật chất chỉ ảnh hưởng một phần tới ý thức"],1],["Quy luật nào vạch ra nguyên nhân, động lực của sự vận động và phát triển sự vật, hiện tượng?",["Quy luật phủ định của phủ định","Quy luật chuyển hóa lượng – chất","Quy luật thống nhất và đấu tranh của các mặt đối lập","Quy luật nguyên nhân – kết quả"],2],["Theo triết học Mác – Lênin, cơ sở lý luận của quan điểm lịch sử – cụ thể là gì?",["Nguyên lý phủ định của phủ định","Nguyên lý về mối liên hệ phổ biến","Nguyên lý về sự phát triển","Nguyên lý khách quan"],1],["Nguồn gốc lý luận trực tiếp hình thành triết học Mác là:",["Chủ nghĩa duy vật Pháp thế kỷ XVIII","Kinh tế chính trị học cổ điển Anh","Chủ nghĩa xã hội không tưởng","Triết học cổ điển Đức"],3],["Những cặp phạm trù nào là cơ sở phương pháp luận của các phương pháp như phân tích – tổng hợp, diễn dịch – quy nạp, khái quát hóa – trừu tượng hóa?",["Nguyên nhân – kết quả; hình thức – nội dung","Cái riêng – cái chung; tất nhiên – ngẫu nhiên; bản chất – hiện tượng","Cấu trúc – chức năng; mục đích – phương tiện","Thực tiễn – lý luận; trực quan – tư duy"],1],["Theo chủ nghĩa duy vật biện chứng, đặc điểm về nguồn gốc của vận động là gì?",["Vận động do lực siêu nhiên tạo ra","Vận động xuất phát từ ý thức","Vận động là sự tự thân vận động của vật chất","Vận động chỉ xuất hiện khi bị tác động bên ngoài"],2],["Ý nghĩa phương pháp luận rút ra từ việc nghiên cứu nguyên lý về sự phát triển trong triết học Mác – Lênin là gì?",["Chỉ xem xét sự vật khi đã hoàn thiện","Phải xem sự vật trong quá trình phát triển đi lên","Phủ nhận mọi bước thụt lùi trong vận động","Xem sự vật tồn tại bất biến, không thay đổi"],1],["Theo chủ nghĩa duy vật biện chứng, sự tác động của ý thức đối với vật chất phải thông qua hoạt động nào của con người?",["Thông qua cảm xúc tự phát","Thông qua suy luận thuần túy","Thông qua hoạt động thực tiễn của con người","Thông qua ước muốn chủ quan"],2],["Về mặt nhận thức luận, quan niệm của học thuyết bất khả tri là gì?",["Thừa nhận khả năng nhận thức vô hạn","Cho rằng chân lý là tuyệt đối dễ đạt","Phủ nhận khả năng nhận thức của con người về thế giới","Khẳng định cảm giác là nguồn gốc duy nhất của tri thức"],2],["Nhà triết học nào thừa nhận vật chất và ý thức là hai bản nguyên song song, cùng quyết định nguồn gốc và sự vận động của thế giới?",["Cantơ","Hêghen","Đêcáctơ","Phơbách"],2],["Một trong những nguồn gốc xã hội cho sự ra đời của triết học là:",["Sự phát triển của tư duy huyền thoại và tôn giáo nguyên thủy","Lao động trí óc đã tách khỏi lao động chân tay","Sự xuất hiện của nền sản xuất nông nghiệp và thương nghiệp","Sự suy tàn của các hình thức tín ngưỡng cổ đại"],1],["Giải quyết mặt thứ nhất trong vấn đề cơ bản của triết học đã xác lập nên những trường phái lớn nào?",["Chủ nghĩa duy vật và chủ nghĩa duy tâm","Chủ nghĩa duy lý và chủ nghĩa kinh nghiệm","Thuyết khả tri và thuyết bất khả tri","Chủ nghĩa biện chứng và chủ nghĩa siêu hình"],0],["Ý nghĩa phương pháp luận của việc tìm hiểu quy luật thống nhất và đấu tranh của các mặt đối lập là gì?",["Phải tuyệt đối hóa một mặt của mâu thuẫn để giải quyết xung đột","Phải giải quyết mâu thuẫn bằng điều hòa, tránh đấu tranh","Phải chỉ dựa vào điều kiện chủ quan của chủ thể để xử lý mâu thuẫn","Bao gồm tất cả các nguyên tắc: thừa nhận tính khách quan của mâu thuẫn, giải quyết trên cơ sở điều kiện khách quan và xem xét quá trình phát sinh – phát triển của mâu thuẫn"],3],["Theo triết học Mác - Lênin, phương thức tồn tại của vật chất là:",["Không gian","Thời gian","Vận động","Năng lượng"],2],["Từ mối quan hệ giữa vật chất và ý thức trong triết học Mác - Lênin, rút ra nguyên tắc phương pháp luận là gì?",["Nguyên tắc phát huy tuyệt đối tính chủ quan của con người","Nguyên tắc xem ý thức là yếu tố quyết định mọi hoạt động","Nguyên tắc tôn trọng khách quan kết hợp phát huy tính năng động chủ quan","Nguyên tắc coi vật chất và ý thức là tách rời nhau"],2],["Theo chủ nghĩa duy vật biện chứng, hình thức vận động thấp nhất và giản đơn nhất là:",["Vận động cơ học","Vận động vật lý","Vận động sinh học","Vận động xã hội"],0],["Trong phép biện chứng duy vật, phạm trù nào dùng để chỉ các mặt, các đặc điểm vốn có ở một sự vật, hiện tượng nào đó mà không lặp lại ở sự vật, hiện tượng khác?",["Cái đơn nhất","Cái chung","Cái riêng","Cái bản chất"],0],["Tính khoa học và cách mạng rõ nét nhất của phép biện chứng duy vật Mác - Lênin thể hiện như thế nào?",["Dừng lại ở việc giải thích hiện tượng tự nhiên","Phủ nhận khả năng cải tạo hiện thực","Không dừng lại ở sự giải thích thế giới mà còn là công cụ để nhận thức và cải tạo thế giới","Xem thế giới như bất biến và tĩnh tại"],2],["Trạng thái vận động nào chưa làm thay đổi cơ bản về vị trí, hình dáng, kết cấu của sự vật?",["Vận động phát triển","Vận động xã hội","Vận động trong thế cân bằng","Vận động hóa học"],2],["Khái niệm dùng để chỉ biện chứng của bản thân thế giới tồn tại khách quan, độc lập với ý thức con người là:",["Biện chứng chủ quan","Biện chứng khách quan","Biện chứng logic","Biện chứng hình thức"],1],["Theo quan điểm triết học Mác – Lênin, cơ sở của sự tồn tại đa dạng các mối liên hệ giữa các sự vật, hiện tượng là:",["Tính năng động của ý thức con người","Sự phát triển của khoa học kỹ thuật","Tính thống nhất vật chất của thế giới","Tính kế thừa trong lịch sử xã hội"],2],["Theo chủ nghĩa duy vật biện chứng, hình thức vận động cao nhất và phức tạp nhất là:",["Vận động cơ học","Vận động hóa học","Vận động sinh học","Vận động xã hội"],3],["Theo triết học Mác - Lênin, nguồn gốc của sự vận động, phát triển của các sự vật hiện tượng trong thế giới là do:",["Sự áp đặt từ các lực lượng siêu nhiên","Ảnh hưởng của các tác động bên ngoài thuần túy","Sự đấu tranh giữa các mặt đối lập bên trong sự vật, hiện tượng","Sự ngẫu nhiên thuần túy của hoàn cảnh"],2],["Theo triết học Mác - Lênin, vai trò của tất nhiên và ngẫu nhiên trong quá trình phát triển của sự vật, hiện tượng là:",["Ngẫu nhiên quyết định hoàn toàn sự phát triển","Tất nhiên chỉ là yếu tố phụ thuộc vào ngẫu nhiên","Tất nhiên chi phối sự phát triển, ngẫu nhiên có thể làm cho sự phát triển diễn ra nhanh hay chậm","Ngẫu nhiên và tất nhiên hoàn toàn không liên quan đến nhau"],2],["Theo phép biện chứng duy vật, quy luật được hiểu là:",["Những sự kiện xảy ra một cách bất ngờ và không lặp lại","Sự phỏng đoán của con người về thế giới khách quan","Mối liên hệ phổ biến, khách quan, bản chất, bền vững, tất yếu giữa các sự vật khi có điều kiện phù hợp","Những quy ước chủ quan do tư duy con người đặt ra"],2],["Ph. Ăngghen dựa trên cơ sở nào để sắp xếp 5 hình thức vận động theo trình độ từ thấp đến cao?",["Theo mục đích sử dụng của con người","Theo sự phát triển của khoa học kỹ thuật","Theo trình độ kết cấu của thế giới vật chất","Theo cấp độ phức tạp của nhận thức cảm tính"],2],["Theo triết học Mác - Lênin, cơ sở lý luận của quan điểm toàn diện là gì?",["Nguyên tắc phủ định của phủ định","Nguyên lý phát triển","Nguyên lý về mối liên hệ phổ biến","Quan điểm lịch sử – cụ thể"],2],["Điền vào chỗ trống: “Trước hết là ……; sau lao động và đồng thời với lao động là ……; đó là hai sức kích thích chủ yếu đã ảnh hưởng đến bộ óc của con vượn, làm cho bộ óc đó dần chuyển thành bộ óc con người\".",["Tư duy, tín ngưỡng","Văn hóa, đạo đức","Lao động, ngôn ngữ","Công cụ, xã hội"],2],["Theo V.I. Lênin, ông kịch liệt phê phán phái Makhơ vì đã đồng nhất vấn đề gì?",["Quy luật vật lý với quy luật tâm lý","Quy luật sinh học với quy luật lịch sử","Quy luật đạo đức với quy luật thẩm mỹ","Quy luật logic với quy luật tự nhiên"],1],["Điền vào chỗ trống: “Mối liên hệ là khái niệm dùng để chỉ sự …… lẫn nhau giữa các sự vật, hiện tượng, hay giữa các mặt, các yếu tố của mỗi sự vật, hiện tượng trong thế giới”.",["Đối lập và phủ định","Quy định, tác động và chuyển hóa","Bài trừ và phủ nhận","Tách biệt và cô lập"],1],["Điền vào chỗ trống: “Vật chất là một phạm trù triết học dùng để chỉ thực tại khách quan được đem lại cho con người trong …, được … của chúng ta chép lại, chụp lại, phản ánh và tồn tại không lệ thuộc vào …”",["Cảm giác, cảm giác, cảm giác","Trải nghiệm, lý trí, ý thức","Tri giác, kinh nghiệm, nhận thức","Nhận thức, lý tính, tư duy"],0],["Vai trò của triết học Mác - Lênin trong sự nghiệp đổi mới toàn diện ở Việt Nam theo định hướng xã hội chủ nghĩa là:",["Công cụ tiên tri về mọi biến động xã hội","Hệ thống đạo đức thuần túy cho cá nhân","Cơ sở thực nghiệm của các khoa học tự nhiên","Cơ sở lý luận khoa học, trong đó hạt nhân là phép biện chứng duy vật"],3],["Theo triết học Mác – Lênin, phạm trù nào dùng để chỉ giai đoạn chuyển hóa cơ bản về chất của sự vật, hiện tượng do những thay đổi về lượng trước đó gây ra, là bước ngoặt cơ bản trong sự biến đổi về lượng?",["Độ","Điểm nút","Bước nhảy","Mâu thuẫn"],2],["Điền vào chỗ trống: “Quy luật là những mối liên hệ khách quan, …… , tất nhiên, phổ biến và lặp lại giữa các mặt, các yếu tố, các thuộc tính bên trong mỗi một sự vật, hay giữa các sự vật, hiện tượng với nhau.”",["ngẫu nhiên","bản chất","chủ quan","cục bộ"],1],["Theo triết học Mác – Lênin, khẳng định nào sau đây là đúng?",["Định nghĩa vật chất của V.I. Lênin phủ nhận sự tồn tại khách quan của thế giới.","Định nghĩa vật chất của V.I. Lênin đồng nhất vật chất với nguyên tử vật lý.","Định nghĩa vật chất của V.I. Lênin cho rằng ý thức quyết định tồn tại.","Định nghĩa vật chất của V.I. Lênin đã giải quyết đúng đắn vấn đề cơ bản của triết học."],3],["Trong các yếu tố tạo thành của ý thức, yếu tố tình cảm giữ vai trò gì?",["Chi phối trực tiếp mọi tri giác cảm tính.","Tạo nên sự gắn bó giữa con người với thế giới hiện thực.","Là nguồn gốc duy nhất của tri thức khoa học.","Không có vai trò trong cấu trúc ý thức."],1],["Sự phản ánh có tính chủ động lựa chọn thông tin, xử lý thông tin để tạo ra những thông tin mới, phát hiện ý nghĩa của thông tin là gì?",["Phản xạ thần kinh","Tri giác","Ý thức","Bản năng"],2],["Ưu điểm của các nhà triết học duy vật trước C. Mác là:",["Gắn nguồn gốc thế giới vào “ý niệm tuyệt đối”.","Thừa nhận sự tồn tại khách quan của thế giới vật chất, lấy bản thân giới tự nhiên để giải thích tự nhiên.","Đồng nhất vật chất với cảm giác chủ quan.","Phủ nhận vai trò của thực tiễn trong nhận thức."],1],["Triết học Mác ra đời dựa trên những tiền đề lý luận nào?",["Triết học cổ điển Đức; Kinh tế chính trị cổ điển Anh; Chủ nghĩa xã hội không tưởng, phê phán.","Chủ nghĩa kinh nghiệm Pháp; Hình học Ơ-clit; Thần học.","Chủ nghĩa duy linh; Tâm lý học trực giác; Nhân học tôn giáo.","Chủ nghĩa dân túy Nga; Chủ nghĩa vị lợi; Ngôn ngữ học so sánh."],0],["Điền vào chỗ trống: “Vấn đề cơ bản lớn của mọi triết học, đặc biệt là của triết học hiện đại, là vấn đề quan hệ giữa …… với …….”",["linh hồn, thể xác","tư duy, tồn tại","khoa học, tôn giáo","tất nhiên, ngẫu nhiên"],1],["Các lớp cấu trúc của ý thức gồm:",["Tri thức, tình cảm, niềm tin, ý chí.","Tri giác, xúc cảm, bản năng, bản ngã.","Vật chất, năng lượng, vận động, không gian.","Nhận thức, lao động, ngôn ngữ, công cụ."],0],["Theo triết học Mác – Lênin, khái niệm dùng để chỉ sự quy định, sự tác động và chuyển hóa lẫn nhau giữa các sự vật, hiện tượng, hay giữa các mặt, các yếu tố của mỗi sự vật, hiện tượng trong thế giới là:",["Bản chất","Hiện tượng","Quy luật","Mối liên hệ"],3],["
