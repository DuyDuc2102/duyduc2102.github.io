Theo triết học Mác – Lênin, cơ sở của mối liên hệ giữa các sự vật, hiện tượng là:",["Ý thức xã hội","Tồn tại xã hội","Tính thống nhất vật chất của thế giới","Tính tương đối của tri thức"],2],["Theo triết học Mác – Lênin, cơ sở của mối liên hệ giữa các sự vật, hiện tượng là:",["Ý thức xã hội","Tồn tại xã hội","Tính tương đối của tri thức","Tính thống nhất vật chất của thế giới"],3],["Theo triết học Mác – Lênin, cơ sở lý luận của nguyên tắc toàn diện là:",["Nguyên lí về mối liên hệ phổ biến","Nguyên lí về sự phát triển","Quy luật lượng – chất","Quy luật phủ định của phủ định"],0],["Đảng ta đã vận dụng quan điểm nào để xác định phương châm vừa phát huy nội lực, vừa tranh thủ thời cơ của quốc tế hóa và toàn cầu hóa nhằm thực hiện mục tiêu “dân giàu, nước mạnh, công bằng, dân chủ, văn minh”?",["Quan điểm siêu hình","Quan điểm duy tâm chủ quan","Quan điểm toàn diện và lịch sử – cụ thể","Quan điểm trực quan sinh động"],2],["Lênin đã chỉ ra thực chất của cuộc khủng hoảng trong vật lý học cuối thế kỷ XIX – đầu thế kỷ XX là:",["Khủng hoảng thực nghiệm","Khủng hoảng toán học thuần túy","Khủng hoảng kỹ thuật đo lường","Khủng hoảng về thế giới quan và phương pháp luận"],3],["Phương pháp tư duy coi nguyên nhân của sự biến đổi nằm bên ngoài đối tượng là:",["Phương pháp biện chứng","Phương pháp tư duy siêu hình","Phương pháp thực chứng","Phương pháp trực quan"],1],["Theo triết học Mác – Lênin, phạm trù “ngẫu nhiên” là:",["Do nguyên nhân, hoàn cảnh bên ngoài quy định","Chỉ những mối liên hệ không bản chất","Có thể xuất hiện hoặc không; có thể xuất hiện theo nhiều cách khác nhau","Tất cả các ý trên"],3],["Phát minh nổi bật nào của khoa học tự nhiên cuối thế kỷ XIX – đầu thế kỷ XX đặt cơ sở đầu tiên bác bỏ quan niệm vật chất đồng nhất với nguyên tử bất biến?",["Phát minh ra tia X của Rơngen","Phát hiện electron của J. J. Thomson","Thuyết lượng tử của Planck","Thuyết tương đối hẹp của Einstein"],0],["Kết quả phản ánh của ý thức phụ thuộc chủ yếu vào:",["Phẩm chất, năng lực, kinh nghiệm sống của chủ thể","Đối tượng phản ánh","Điều kiện lịch sử – xã hội","Tất cả các ý trên"],3],["Những cố gắng, nỗ lực huy động mọi tiềm năng của mỗi con người vào hoạt động để vượt qua trở ngại, đạt mục đích đề ra được gọi là:",["Niềm tin","Ý chí","Tình cảm","Trực giác"],1],["Theo chủ nghĩa duy vật biện chứng, sự hình thành và phát triển của ý thức là kết quả của:",["Phản ánh sinh học thích nghi tự nhiên","Hoạt động điện – sinh lý của não bộ thuần tuý","Ngôn ngữ bẩm sinh của cá thể","Hoạt động thực tiễn của con người nhằm cải tạo thế giới khách quan"],3],["Theo triết học Mác – Lênin, phạm trù “nội dung” là:",["Hình thức tổ chức bên ngoài của sự vật","Bản chất tất yếu ẩn sau hiện tượng","Quy luật vận động phổ quát của giới tự nhiên","Tổng hợp tất cả những mặt, những mối liên hệ tất nhiên, tương đối ổn định bên trong sự vật, quy định sự vận động và phát triển của sự vật"],3],["Thời kỳ nào triết học Mác – Lênin tiếp tục được các Đảng Cộng sản và công nhân bổ sung, phát triển?",["1844 – 1848","1871 – 1873","1895 – 1917","1924 đến nay"],3],["Theo triết học Mác – Lênin, tiền đề cho sự thống nhất của thế giới là:",["Tính nhân quả phổ quát","Tính khả tri của thế giới","Tồn tại của thế giới","Tính phản ánh của ý thức"],2],["C. Mác và Ph. Ăngghen bổ sung và phát triển toàn diện lý luận triết học diễn ra chủ yếu vào thời kỳ:",["1835 – 1844","1867 – 1875","1848 – 1895","1895 – 1917"],2]];
      const BUILTIN_TRIET_P2 = [["Hình thức tồn tại của vật chất là gì?",["Vận động và đứng im.","Không gian và thời gian.","Nguyên nhân và kết quả.","Nội dung và hình thức."],1],["Một trong những ý nghĩa phương pháp luận được rút ra từ việc nghiên cứu cặp phạm trù khả năng và hiện thực là gì?",["Phải luôn tuyệt đối hóa vai trò của nhân tố chủ quan trong mọi hoạt động.","Mọi khả năng khách quan đều tự động biến thành hiện thực, không cần điều kiện.","Cần tránh sai lầm, hoặc tuyệt đối hóa vai trò của nhân tố chủ quan, hoặc xem thường vai trò ấy trong quá trình biến đổi khả năng thành hiện thực.","Chỉ cần chú ý đến điều kiện khách quan, không cần quan tâm đến nhân tố chủ quan."],2],["Trường phái triết học nào thừa nhận sự tồn tại của các sự vật, hiện tượng của thế giới nhưng phủ nhận đặc trưng “tự thân tồn tại” của chúng?",["Chủ nghĩa duy vật biện chứng.","Chủ nghĩa nhị nguyên.","Chủ nghĩa duy tâm.","Thuyết bất khả tri."],2],["Hình thức đầu tiên của chủ nghĩa duy vật là:",["Chủ nghĩa duy vật biện chứng.","Chủ nghĩa duy vật chất phác.","Chủ nghĩa duy vật lịch sử.","Chủ nghĩa duy vật siêu hình cận đại."],1],["Phạm trù nào chỉ tổng thể các tiền đề của sự biến đổi, sự hình thành của hiện thực mới, là cái có thể có, nhưng ngay lúc này còn chưa có?",["Hiện thực.","Bản chất.","Ngẫu nhiên.","Khả năng."],3],["Trong tác phẩm Chống Đuyrinh, khi bàn về các quy luật, Ph. Ăngghen định nghĩa phép biện chứng là gì?",["Là học thuyết triết học nghiên cứu mối quan hệ giữa vật chất và ý thức.","Chẳng qua chỉ là môn khoa học về những quy luật phổ biến của sự vận động và sự phát triển của tự nhiên, của xã hội loài người và của tư duy.","Là môn khoa học nghiên cứu những quy luật đặc thù của từng lĩnh vực riêng biệt của hiện thực.","Là hệ thống các nguyên lý chung nhất của lôgic học hình thức."],1],["Quan điểm triết học nào xem vật chất, vận động, không gian, thời gian như những thực thể khác nhau, không có mối liên hệ nội tại với nhau?",["Chủ nghĩa duy tâm khách quan.","Chủ nghĩa duy tâm chủ quan.","Chủ nghĩa duy vật siêu hình thế kỷ XVII – XVIII.","Chủ nghĩa duy vật biện chứng."],2],["Phạm trù nào chỉ tổng thể các tiền đề của sự biến đổi, sự hình thành của hiện thực mới, là cái có thể có, nhưng ngay lúc này còn chưa có?",["Tất nhiên.","Nguyên nhân.","Khả năng.","Kết quả."],2],["Khái niệm nào dùng để chỉ biện chứng của bản thân thế giới tồn tại khách quan, độc lập với ý thức con người?",["Biện chứng chủ quan.","Phép biện chứng duy tâm.","Biện chứng khách quan.","Siêu hình học."],2],["Điểm tương đồng của các quan niệm duy vật về vật chất thời Cổ đại là:",["Đồng nhất vật chất với vận động cơ học.","Đồng nhất vật chất với cảm giác của con người.","Đồng nhất vật chất với năng lượng thuần túy.","Đồng nhất vật chất với vật thể."],3],["Để thực hiện thắng lợi mục tiêu độc lập dân tộc và chủ nghĩa xã hội, xây dựng một xã hội dân giàu, nước mạnh, dân chủ, công bằng, văn minh, cần thực hiện hai nhiệm vụ chiến lược nào?",["Công nghiệp hóa, hiện đại hóa và mở rộng dân chủ cơ sở.","Phát triển kinh tế thị trường và tăng cường hội nhập quốc tế.","Xây dựng thành công chủ nghĩa xã hội và bảo vệ vững chắc Tổ quốc xã hội chủ nghĩa.","Đổi mới hệ thống chính trị và mở rộng đối ngoại nhân dân."],2],["Nội dung chủ yếu của cuộc đấu tranh giai cấp ở Việt Nam hiện nay là gì?",["Đẩy mạnh cổ phần hóa doanh nghiệp nhà nước và thu hút vốn đầu tư nước ngoài.","Thực hiện thắng lợi sự nghiệp công nghiệp hóa, hiện đại hóa theo định hướng xã hội chủ nghĩa, khắc phục tình trạng nước kém phát triển; thực hiện công bằng xã hội, chống áp bức, bất công; đấu tranh ngăn chặn, khắc phục tư tưởng và hành động tiêu cực, sai trái; đấu tranh làm thất bại mọi âm mưu, hành động chống phá của các thế lực thù địch, bảo vệ độc lập dân tộc, xây dựng thành công chủ nghĩa xã hội.","Tập trung xóa đói giảm nghèo và mở rộng giao lưu văn hóa với quốc tế.","Tăng trưởng kinh tế nhanh, mở rộng thị trường và thu hẹp khu vực kinh tế nhà nước."],1],["Để thực hiện thắng lợi nội dung của cuộc đấu tranh giai cấp ở Việt Nam hiện nay đặt ra đòi hỏi khách quan là gì?",["Phải tăng trưởng kinh tế nhanh và mở rộng thị trường xuất khẩu.","Phải giải quyết tốt các phương hướng, nhiệm vụ cụ thể của sự nghiệp cách mạng hiện nay; nâng cao năng lực và sức chiến đấu của Đảng; đẩy mạnh toàn diện công cuộc đổi mới và sự nghiệp công nghiệp hóa, hiện đại hóa; phát triển văn hóa, thực hiện tiến bộ và công bằng xã hội; tăng cường quốc phòng, an ninh, mở rộng quan hệ đối ngoại; chủ động, tích cực hội nhập quốc tế, giữ vững ổn định chính trị – xã hội.","Chỉ cần mở rộng quan hệ đối ngoại và đẩy mạnh dân chủ cơ sở.","Chủ yếu là tăng cường quốc phòng, an ninh và thu hút đầu tư nước ngoài."],1],["Theo chủ nghĩa duy tâm, vai trò của vật chất đối với ý thức được hiểu như thế nào?",["Vật chất quyết định ý thức và ý thức chỉ là sự phản ánh thụ động.","Vật chất và ý thức tồn tại song song, không quy định lẫn nhau.","Nhấn mạnh một chiều vai trò của ý thức sinh ra vật chất, cho rằng thế giới vật chất chỉ là bản sao, là biểu hiện khác của tinh thần.","Ý thức và vật chất hoàn toàn tách rời, không có quan hệ nào."],2],["Theo triết học Mác – Lênin, phương thức tồn tại của vật chất là gì?",["Thời gian.","Không gian.","Vận động.","Sự đứng im tuyệt đối."],2],["Theo quan điểm triết học Mác – Lênin, nguồn gốc xã hội dẫn tới sự ra đời của triết học là gì?",["Sự phát triển của thương mại và trao đổi hàng hóa.","Sự xuất hiện của nhà nước và pháp luật.","Lao động trí óc đã tách khỏi lao động chân tay, xuất hiện tầng lớp lao động trí óc chuyên nghiệp.","Sự ra đời của tôn giáo và các hình thức tín ngưỡng sơ khai."],2],["Quan điểm triết học nào xem vật chất, vận động, không gian, thời gian như những thực thể khác nhau, không có mối liên hệ nội tại với nhau?",["Chủ nghĩa duy tâm chủ quan.","Chủ nghĩa duy vật biện chứng.","Chủ nghĩa duy vật siêu hình thế kỷ XVII – XVIII.","Thuyết nhị nguyên (nhị nguyên luận)."],2],["Theo phép biện chứng duy vật, phạm trù nào chỉ tổng thể tất cả những mặt, những yếu tố tạo nên sự vật, hiện tượng?",["Hình thức.","Bản chất.","Cấu trúc.","Nội dung."],3],["Theo chủ nghĩa Mác – Lênin, phạm trù “chất” được hiểu là gì?",["Tổng hợp tất cả các mối liên hệ bên ngoài của sự vật.","Đặc điểm chủ quan của sự vật do ý thức quy định.","Một phạm trù triết học dùng để chỉ tính quy định khách quan vốn có của sự vật, là sự thống nhất hữu cơ của những thuộc tính làm cho sự vật nó là nó chứ không phải là cái khác.","Lượng các thuộc tính có thể đo đếm được của sự vật."],2],["Hạn chế cơ bản của các quan niệm về phạm trù vật chất ở thời Cổ đại là gì?",["Chỉ chú ý tới vận động cơ học, bỏ qua vận động hóa học.","Nhấn mạnh tuyệt đối vai trò của ý thức trong nhận thức thế giới.","Đồng nhất vật chất với cảm giác chủ quan của con người.","Có tính trực quan, ngây thơ, chất phác, đồng nhất vật chất với một vài dạng vật thể cảm tính."],3],["Điền vào chỗ trống cho đúng: “Tiến hóa là một dạng của phát triển, … và thường là sự biến đổi hình thức tồn tại xã hội từ đơn giản đến phức tạp”.",["Diễn ra một cách đột biến, nhảy vọt.","Diễn ra không theo quy luật khách quan nào.","Diễn ra hoàn toàn ngẫu nhiên, không có xu hướng.","Diễn ra theo cách từ từ."],3],["Trường phái triết học nào thừa nhận sự tồn tại của các sự vật, hiện tượng của thế giới nhưng phủ nhận đặc trưng “tự thân tồn tại” của chúng?",["Chủ nghĩa duy vật biện chứng.","Chủ nghĩa duy tâm.","Thuyết bất khả tri.","Chủ nghĩa nhị nguyên."],1],["Khái niệm nào dùng để chỉ biện chứng của bản thân thế giới tồn tại khách quan, độc lập với ý thức con người?",["Biện chứng chủ quan.","Phép biện chứng duy tâm.","Siêu hình học.","Biện chứng khách quan."],3],["Cách mạng Tháng Tám năm 1945 ở Việt Nam mang tính chất là cuộc cách mạng dân chủ tư sản kiểu mới vì:",["Mục đích là giành độc lập dân tộc nhưng không gắn với giải phóng giai cấp, không do Đảng vô sản lãnh đạo.","Chỉ nhằm lật đổ chế độ phong kiến, chưa đụng tới chính quyền thực dân xâm lược.","Mục đích là đánh đổ sự thống trị của chính quyền thực dân, phong kiến để giải phóng dân tộc, đồng thời giải phóng giai cấp; do Đảng của giai cấp vô sản lãnh đạo và thiết lập được chính quyền kiểu mới – chính quyền chuyên chính vô sản.","Chỉ nhằm cải cách xã hội, mở rộng dân chủ tư sản, không thiết lập chính quyền kiểu mới."],2],["Lực lượng cách mạng trong Cách mạng Tháng Tám năm 1945 ở Việt Nam là:",["Chỉ có giai cấp công nhân và nông dân.","Giai cấp tư sản dân tộc và địa chủ vừa và nhỏ.","Giai cấp công nhân, nông dân, tầng lớp trí thức tiến bộ và đông đảo các tầng lớp nhân dân lao động khác.","Chủ yếu là tầng lớp trí thức và tiểu tư sản thành thị."],2],["Trong Cách mạng Tháng Tám năm 1945, đối tượng của cách mạng là:",["Giai cấp tư sản dân tộc và tiểu tư sản.","Chính quyền thực dân và phong kiến.","Chỉ có chính quyền thực dân xâm lược.","Chỉ có chế độ phong kiến lỗi thời."],1],["Hình thức tồn tại của vật chất, xét về mặt độ dài diễn biến và sự kế tiếp của các quá trình, được gọi là gì?",["Không gian.","Vận động.","Sự đứng im.","Thời gian."],3],["Ưu điểm của chủ nghĩa duy vật trước Mác về bản chất của thế giới là:",["Phủ nhận sự tồn tại khách quan của thế giới vật chất, tuyệt đối hóa vai trò của ý thức.","Đồng nhất thế giới vật chất với cảm giác chủ quan của con người.","Thừa nhận sự tồn tại khách quan của thế giới vật chất, lấy bản thân giới tự nhiên để giải thích về tự nhiên.","Cho rằng bản chất thế giới chỉ là “ý niệm tuyệt đối”."],2],["Phép biện chứng duy vật cho rằng xu hướng của sự phát triển được mô phỏng theo đồ thị nào?",["Đường thẳng đi lên đều đặn.","Đường gấp khúc lên rồi xuống một cách ngẫu nhiên.","Đường xoáy ốc.","Đường tròn khép kín lặp lại nguyên trạng."],2],["Trong triết học Mác – Lênin, cơ sở lý luận trực tiếp của nguyên tắc phát triển là:",["Nguyên lý về mối liên hệ phổ biến.","Nguyên lý về sự thống nhất và đấu tranh của các mặt đối lập.","Nguyên tắc lịch sử – cụ thể.","Nguyên lý về sự phát triển."],3],["Nhà triết học nào khẳng định thế giới “ý niệm” hay “ý niệm tuyệt đối” là bản thể, là cái sinh ra toàn bộ thế giới hiện thực?",["Platôn.","Đềcáctơ.","Hêghen.","Phoiơbắc."],2],["Nhà triết học nào quan niệm cơ sở đầu tiên của mọi vật trong vũ trụ là Apeiron – một dạng vật chất đơn nhất, vô định, vô hạn và tồn tại vĩnh viễn?",["Talét.","Hêraclit.","Anaximen.","Anaximander."],3],["Trong triết học Mác – Lênin, khái niệm nào dùng để chỉ sự quy định, sự tác động và chuyển hóa lẫn nhau giữa các sự vật, hiện tượng, hay giữa các mặt, các yếu tố của mỗi sự vật, hiện tượng trong thế giới?",["Quy luật.","Bản chất.","Hình thức.","Mối liên hệ."],3],["Theo chủ nghĩa duy vật biện chứng, vận động được hiểu là gì?",["Chỉ là sự thay đổi vị trí cơ học của vật thể trong không gian.","Chỉ bao gồm những biến đổi vật lý và hóa học trong tự nhiên.","Sự thay đổi về mặt xã hội, không liên quan đến tự nhiên và tư duy.","Vận động bao gồm mọi sự thay đổi và mọi quá trình diễn ra trong vũ trụ, từ sự thay đổi vị trí giản đơn đến tư duy."],3],["Kết cấu cơ bản của ý thức theo triết học Mác – Lênin gồm những yếu tố nào?",["Tri thức, bản năng, tình cảm, trí nhớ.","Tri thức, tình cảm, ý chí, niềm tin.","Tri thức, cảm giác, tri giác, tư duy.","Tri thức, tưởng tượng, xúc cảm, bản năng."],1],["Nhà triết học Anaximander quan niệm cơ sở đầu tiên của mọi vật trong vũ trụ là gì?",["Nước.","Lửa.","Không khí.","Một dạng vật chất đơn nhất, vô định, vô hạn và tồn tại vĩnh viễn – Apeiron."],3],["Cương lĩnh đề ra phương hướng “Xây dựng nền văn hóa tiên tiến, đậm đà bản sắc dân tộc” biểu hiện tính chất nào của phủ định biện chứng?",["Tính khách quan.","Tính phổ biến.","Tính đa dạng.","Tính kế thừa."],3],["Con đường đi lên chủ nghĩa xã hội ở Việt Nam là bỏ qua chế độ tư bản chủ nghĩa nhưng vẫn kế thừa những thành tựu về kinh tế, xã hội của chủ nghĩa tư bản. Điều đó thể hiện tính chất nào của phủ định biện chứng?",["Tính phủ định sạch trơn.","Tính ngẫu nhiên.","Tính đối kháng.","Tính kế thừa."],3],["Một trong những quan điểm của Đảng ta về Nhà nước được khẳng định tại Đại hội XIII là gì?",["Tập trung toàn bộ quyền lực vào cơ quan lập pháp trung ương.","Hoàn thiện mô hình tổ chức của Nhà nước; phân công, phối hợp giữa các quyền lập pháp, hành pháp, tư pháp, đồng thời coi trọng kiểm soát quyền lực nhà nước.","Thu gọn tối đa bộ máy nhà nước, giảm bớt vai trò của lập pháp và tư pháp.","Chỉ chú trọng tăng cường vai trò của cơ quan hành pháp trong toàn bộ bộ máy nhà nước."],1],["Nhà triết học Lơxíp và Đêmôcrít quan niệm cơ sở đầu tiên của mọi vật trong vũ trụ là gì?",["Nước.","Lửa.","Không khí.","Nguyên tử."],3],["Theo chủ nghĩa duy vật biện chứng, hình thức vận động cao nhất và phức tạp nhất là gì?",["Vận động cơ học.","Vận động vật lý.","Vận động sinh học.","Vận động xã hội."],3],["Phạm trù nào dùng để chỉ mối liên hệ thống nhất và quy định lẫn nhau giữa chất với lượng; là giới hạn tồn tại của sự vật, hiện tượng mà trong đó sự thay đổi về lượng chưa dẫn đến sự thay đổi về chất, sự vật vẫn là nó, chưa chuyển hóa thành sự vật khác?",["Điểm nút.","Bước nhảy.","Độ.","Lượng."],2],["Tác động của lao động và ngôn ngữ đối với sự hình thành và phát triển của ý thức con người là gì?",["Làm con người nhận thức rõ hơn về thế giới nhưng không làm thay đổi bộ óc.","Chỉ làm tăng khả năng ghi nhớ và bắt chước ở loài vượn người.","Chỉ tạo ra tập quán và thói quen trong hoạt động sinh hoạt hàng ngày.","Làm chuyển biến dần bộ óc của loài vượn người thành bộ óc con người và biến tâm lý động vật thành ý thức con người."],3],["Phương pháp tư duy nào chi phối chủ nghĩa duy vật thế kỷ XVII – XVIII?",["Phương pháp tư duy biện chứng.","Phương pháp tư duy siêu hình.","Phương pháp tư duy kinh nghiệm.","Phương pháp tư duy trực giác."],1],["Thuật ngữ “Philosophia” (yêu mến sự thông thái) xuất hiện đầu tiên ở quốc gia nào?",["Ấn Độ cổ đại.","Trung Hoa cổ đại.","Hy Lạp cổ đại.","Ai Cập cổ đại."],2],["Đêmôcrít quan niệm cơ sở đầu tiên của mọi vật trong vũ trụ là gì?",["Nước.","Không khí.","Lửa.","Nguyên tử."],3],["Định nghĩa hoàn chỉnh về giai cấp lần đầu tiên được Lênin nêu ra trong tác phẩm nào?",["Nhà nước và cách mạng.","Làm gì?","Bệnh ấu trĩ “tả khuynh” trong phong trào cộng sản.","Sáng kiến vĩ đại."],3],["Điểm tương đồng của các quan niệm duy vật về vật chất thời Cổ đại là gì?",["Đồng nhất vật chất với vận động cơ học.","Đồng nhất vật chất với cảm giác chủ quan.","Đồng nhất vật chất với năng lượng thuần túy.","Đồng nhất vật chất với vật thể."],3],["Biểu hiện của tính năng động, tích cực, sáng tạo của ý thức con người ở giai đoạn xử lý thông tin là gì?",["Ghi nhớ máy móc những gì giác quan thu nhận.","Lặp lại nguyên xi các thông tin đã tiếp nhận.","Mô hình hóa đối tượng và mã hóa thông tin để xử lý thông tin được tiếp nhận.","Chỉ lưu trữ thụ động các dữ liệu cảm tính."],2],["Một trong những quan điểm của Đảng ta về Nhà nước được khẳng định tại Đại hội XIII là gì?",["Thu hẹp vai trò của Nhà nước trong quản lý xã hội.","Chỉ tập trung vào cải cách hành chính, không đổi mới thể chế.","Đổi mới phương thức vận hành của Nhà nước theo hướng hoàn thiện thể chế, phát huy dân chủ, bảo đảm quyền làm chủ của nhân dân.","Tăng cường tập trung quyền lực vào cơ quan hành pháp trung ương."],2],["Một trong những quan điểm của Đảng ta về Nhà nước được khẳng định tại Đại hội XIII là gì?",["Nhà nước pháp quyền xã hội chủ nghĩa Việt Nam là Nhà nước của giai cấp cầm quyền, vì giai cấp cầm quyền.","Nhà nước pháp quyền xã hội chủ nghĩa Việt Nam là Nhà nước đứng trên các giai cấp.","Bản chất của Nhà nước pháp quyền xã hội chủ nghĩa Việt Nam là Nhà nước của nhân dân, do nhân dân và vì nhân dân.","Nhà nước pháp quyền xã hội chủ nghĩa Việt Nam là Nhà nước của các nhà doanh nghiệp."],2],["Cách mạng Tháng Tám năm 1945 ở Việt Nam mang tính chất gì?",["Cách mạng tư sản dân quyền kiểu cũ.","Cách mạng xã hội chủ nghĩa hoàn chỉnh.","Khởi nghĩa nông dân tự phát.","Cách mạng dân chủ tư sản kiểu mới."],3],["Trạng thái vận động nào chưa làm thay đổi cơ bản về chất của sự vật?",["Vận động trong đột biến.","Vận động nhảy vọt về chất.","Vận động trong thăng bằng.","Vận động phá vỡ mọi cấu trúc cũ."],2],["Giải quyết mặt thứ hai trong vấn đề cơ bản của triết học (khả năng nhận thức thế giới) đã xác lập nên những trường phái lớn nào?",["Duy vật luận và duy tâm luận.","Thuyết nhị nguyên và thuyết đa nguyên.","Khả tri luận và bất khả tri luận.","Thực chứng luận và hoài nghi luận."],2],["Quan điểm triết học nào xem vật chất, vận động, không gian, thời gian như những thực thể khác nhau, không có mối liên hệ nội tại với nhau?",["Chủ nghĩa duy tâm chủ quan.","Chủ nghĩa duy vật biện chứng.","Chủ nghĩa duy vật siêu hình thế kỷ XVII – XVIII.","Thuyết nhị nguyên (nhị nguyên luận)."],2],["Loại phản ánh nào có tính chủ động lựa chọn thông tin, xử lý thông tin để tạo ra thông tin mới, phát hiện ý nghĩa của thông tin?",["Phản xạ sinh lý.","Phản ánh cảm tính.","Phản ánh tâm lý động vật.","Ý thức."],3],["Theo triết học Mác – Lênin, phạm trù “ngẫu nhiên” được hiểu là gì?",["Cái nhất định phải xảy ra trong mọi điều kiện.","Cái không bao giờ xuất hiện trong hiện thực.","Cái có thể không xuất hiện; có thể xuất hiện thế này hoặc có thể xuất hiện thế khác.","Cái hoàn toàn không liên hệ gì với quy luật."],2],["Điền vào chỗ trống cho đúng: “Quy luật là những mối liên hệ khách quan, ……, tất nhiên, phổ biến và lặp lại giữa các mặt, các yếu tố, các thuộc tính bên trong mỗi một sự vật, hay giữa các sự vật, hiện tượng với nhau”.",["Ngẫu nhiên.","Tạm thời.","Bề ngoài.","Bản chất."],3],["Phương pháp tư duy nào chi phối chủ nghĩa duy vật thế kỷ XVII – XVIII?",["Phương pháp tư duy siêu hình.","Phương pháp tư duy biện chứng.","Phương pháp tư duy trực giác.","Phương pháp tư duy kinh nghiệm."],0],["Định nghĩa vật chất của V.I. Lênin được nêu trong tác phẩm nào?",["Chủ nghĩa xã hội và tôn giáo.","Làm gì?","Chủ nghĩa duy vật và chủ nghĩa kinh nghiệm phê phán.","Chủ nghĩa đế quốc – giai đoạn tột cùng của chủ nghĩa tư bản."],2],["Vai trò tích cực của chủ nghĩa duy vật siêu hình thế kỷ XVII – XVIII là gì?",["Bảo vệ thế giới quan duy tâm, tôn giáo.","Phủ nhận mọi thành tựu của khoa học tự nhiên.","Chống lại thế giới quan duy tâm, tôn giáo, góp phần khẳng định vai trò của thế giới vật chất khách quan.","Khẳng định ý thức là cái có trước vật chất."],2],["“Vật chất là một phạm trù triết học dùng để chỉ thực tại khách quan được đem lại cho con người trong ……, được …… của chúng ta chép lại, chụp lại, phản ánh và tồn tại không lệ thuộc vào ……”. Điền vào chỗ trống cho đúng.",["Trực giác, trực giác, trực giác.","Tri giác, tri giác, tri giác.","Nhận thức, nhận thức, ý thức.","Cảm giác, cảm giác, cảm giác."],3],["Sinh viên đi thi không đọc kỹ đề, đặt bút làm bài; cuối giờ mới phát hiện bị lạc đề, gạch bỏ làm lại nhưng không kịp. Sinh viên này thiếu nguyên tắc nào khi làm bài (xét theo quan điểm phương pháp luận triết học Mác – Lênin)?",["Nguyên tắc lịch sử – cụ thể.","Nguyên tắc phát triển.","Nguyên tắc mâu thuẫn.","Nguyên tắc toàn diện."],3],["Một trong những quan điểm của Đảng ta về Nhà nước được khẳng định tại Đại hội XIII là gì?",["Bản chất của Nhà nước pháp quyền xã hội chủ nghĩa Việt Nam là Nhà nước của giai cấp tư sản dân tộc.","Bản chất của Nhà nước pháp quyền xã hội chủ nghĩa Việt Nam là Nhà nước đứng trên nhân dân.","Bản chất của Nhà nước pháp quyền xã hội chủ nghĩa Việt Nam là Nhà nước của nhân dân, do nhân dân và vì nhân dân.","Bản chất của Nhà nước pháp quyền xã hội chủ nghĩa Việt Nam là Nhà nước của một đảng phái riêng lẻ."],2],["Điền vào chỗ trống cho đúng: “Nước Cộng hòa xã hội chủ nghĩa Việt Nam do … làm chủ; tất cả quyền lực nhà nước thuộc về …, mà nền tảng là liên minh giai cấp công nhân với giai cấp nông dân và đội ngũ trí thức”.",["Giai cấp công nhân.","Đảng Cộng sản Việt Nam.","Các cơ quan nhà nước.","Nhân dân."],3],["Theo chủ nghĩa duy vật biện chứng, bản chất của ý thức là gì?",["Sự ghi chép thụ động những gì giác quan mang lại.","Sự phản ánh thực tại chủ quan của từng cá nhân.","Sự phản ánh hiện thực khách quan vào bộ óc con người một cách tích cực, sáng tạo.","Sự phản ánh ngẫu nhiên của thế giới bên ngoài vào bộ óc."],2],["Theo phép biện chứng duy vật, “đấu tranh giữa các mặt đối lập” là gì?",["Sự chung sống hòa bình, không mâu thuẫn giữa các mặt đối lập.","Sự tác động qua lại theo hướng bài trừ, phủ định lẫn nhau giữa các mặt đối lập, đồng thời luôn gắn với sự khác nhau, thống nhất, đồng nhất giữa chúng trong một mâu thuẫn.","Sự tách rời tuyệt đối giữa các mặt đối lập, không liên hệ với nhau.","Sự thay thế ngẫu nhiên giữa các mặt đối lập, không theo quy luật nào."],1],["Nhà triết học nào thừa nhận vật chất và ý thức là hai bản nguyên song song cùng tồn tại, cùng quyết định nguồn gốc và sự vận động của thế giới?",["Hêghen.","Platôn.","Đềcáctơ.","Phoiơbắc."],2],["Theo triết học Mác – Lênin, phép biện chứng là gì?",["Học thuyết về các quy luật tâm lý chủ quan của con người.","Khoa học về những quy luật phổ biến của sự vận động và sự phát triển của tự nhiên, của xã hội loài người và của tư duy.","Hệ thống các quy tắc lôgic hình thức trong tư duy.","Học thuyết về mối quan hệ giữa con người với tôn giáo."],1],["Định nghĩa vật chất của V.I. Lênin đã khẳng định thuộc tính cơ bản nhất của mọi dạng vật chất là gì?",["Tính đo được.","Tính vận động.","Tính cảm nhận được bằng giác quan.","Tồn tại khách quan."],3],["Một trong những nội dung của định nghĩa vật chất theo V.I. Lênin là gì?",["Vật chất là cái chỉ tồn tại trong ý thức con người.","Vật chất là cái do ý thức con người sáng tạo ra.","Vật chất là thực tại khách quan – cái tồn tại bên ngoài ý thức và không lệ thuộc vào ý thức.","Vật chất là mọi thứ con người có thể tư duy được."],2],["Đặc trưng của quá trình phát triển biện chứng với tính kế thừa qua khâu trung gian, tính lặp lại và tính tiến lên được mô phỏng theo hình thức nào?",["Đường thẳng đi lên.","Đường gấp khúc lên xuống.","Đường tròn khép kín.","Đường xoáy ốc."],3],["Triết học ra đời từ những nguồn gốc chủ yếu nào?",["Nguồn gốc kinh tế và nguồn gốc tâm linh.","Nguồn gốc tôn giáo và nguồn gốc chính trị.","Nguồn gốc nhận thức và nguồn gốc xã hội.","Nguồn gốc tự nhiên và nguồn gốc sinh học."],2],["Trong các yếu tố hợp thành ý thức, yếu tố nào giữ vai trò quan trọng nhất?",["Tình cảm.","Trực giác.","Tri thức.","Niềm tin."],2],["Hình thức tồn tại của vật chất xét về mặt “quãng tính”, sự cùng tồn tại, trật tự, kết cấu và sự tác động lẫn nhau được gọi là gì?",["Thời gian.","Vận động.","Sự đứng im.","Không gian."],3],["Khi nghiên cứu nguyên lý về mối liên hệ phổ biến, cần quán triệt quan điểm (nguyên tắc) nào?",["Nguyên tắc lịch sử – cụ thể.","Nguyên tắc phát triển.","Nguyên tắc mâu thuẫn.","Nguyên tắc toàn diện."],3],["Theo triết học Mác – Lênin, tiền đề cho sự thống nhất của thế giới là gì?",["Sự thống nhất về mặt tôn giáo.","Sự thống nhất về mặt chính trị.","Sự tồn tại của thế giới","Sự thống nhất trong ý thức của con người."],2],["Nội dung định nghĩa vật chất của V.I. Lênin bao gồm:",["Vật chất chỉ là những gì nhìn thấy được và sờ thấy được.","Vật chất là cái do cảm giác sinh ra và phụ thuộc vào cảm giác.","Vật chất là thực tại khách quan, tồn tại ngoài ý thức và không lệ thuộc vào ý thức; là cái khi tác động vào giác quan con người thì đem lại cho con người cảm giác; và ý thức chẳng qua chỉ là sự phản ánh của vật chất.","Vật chất là mọi cái mà con người có thể tưởng tượng ra trong tư duy."],2],["Phát minh nào của khoa học tự nhiên cuối thế kỷ XIX – đầu thế kỷ XX đã bác bỏ quan niệm xem vật chất, vận động, không gian, thời gian như những thực thể khác nhau, không có mối liên hệ nội tại với nhau?",["Thuyết tiến hóa của Darwin.","Thuyết lượng tử của Planck.","Thuyết tương đối của Anhxtanh.","Học thuyết tế bào của Schleiden và Schwann."],2],["Theo triết học Mác – Lênin, sự phát triển có những tính chất cơ bản nào?",["Tính chủ quan; tính ngẫu nhiên; tính lặp lại; tính dừng lại.","Tính tất nhiên; tính đồng nhất; tính bất biến; tính siêu hình.","Tính khách quan; tính phổ biến; tính kế thừa; tính đa dạng, phong phú.","Tính chủ quan; tính bộ phận; tính thuần nhất; tính đơn tuyến."],2],["Theo chủ nghĩa duy vật biện chứng, vận động là gì?",["Sự thay đổi vị trí cơ học của vật thể trong không gian.","Sự thay đổi các trạng thái vật lý của vật chất.","Mọi sự thay đổi và mọi quá trình diễn ra trong vũ trụ, từ sự thay đổi vị trí giản đơn cho đến tư duy.","Chỉ những biến đổi trong đời sống xã hội loài người."],2],["Điền vào chỗ trống cho đúng: “Vật chất là một phạm trù triết học dùng để chỉ thực tại khách quan được đem lại cho con người trong …, được … của chúng ta chép lại, chụp lại, phản ánh và tồn tại không lệ thuộc vào …”.",["Trực giác, trực giác, trực giác.","Tri giác, tri giác, tri giác.","Nhận thức, nhận thức, ý thức.","Cảm giác, cảm giác, cảm giác."],3],["Một trường đại học qua nhiều lần đổi tên từ trường cao đẳng lên trường đại học. Quá trình biến đổi đó là vận động theo khuynh hướng nào?",["Khuynh hướng đi xuống.","Khuynh hướng thụt lùi.","Khuynh hướng quanh quẩn, lặp lại.","Khuynh hướng đi lên."],3],["Câu tục ngữ “Trông mặt mà bắt hình dong” thể hiện khuynh hướng nhận thức nào?",["Chủ nghĩa duy lý.","Chủ nghĩa duy cảm","Chủ nghĩa duy tâm khách quan.","Chủ nghĩa duy tâm chủ quan."],1],["Quan điểm cho rằng lý tính là nguồn gốc, là tiêu chuẩn của chân lý trong tri thức thuộc về trường phái nào?",["Chủ nghĩa duy cảm.","Thuyết thực chứng.","Chủ nghĩa duy lý.","Chủ nghĩa hoài nghi."],2],["Hoạt động trồng lúa nước của nông dân thuộc hình thức nào của thực tiễn?",["Hoạt động chính trị – xã hội.","Hoạt động thực nghiệm khoa học.","Hoạt động văn hóa – tinh thần.","Hoạt động sản xuất vật chất."],3],["Theo triết học Mác – Lênin, nguồn gốc xã hội cho sự ra đời của triết học là gì?",["Nền sản xuất xã hội có sự phân công lao động, hình thành lao động trí óc.","Lao động trí óc đã tách khỏi lao động chân tay, xuất hiện tầng lớp lao động trí óc.","Loài người xuất hiện giai cấp và nhà nước.","Cả 3 đáp án trên."],3],["Các lớp cấu trúc cơ bản của ý thức gồm những yếu tố nào?",["Tri thức, cảm giác, tri giác, ý chí.","Tri thức, tình cảm, niềm tin, ý chí.","Tri thức, bản năng, tình cảm, niềm tin.","Tri thức, trực giác, xúc cảm, ý chí."],1],["Theo V.I. Lênin, sự phát triển vượt bậc của khoa học tự nhiên cuối thế kỷ XIX – đầu thế kỷ XX có ý nghĩa gì?",["Bác bỏ hoàn toàn mọi quan điểm duy vật trước đó.","Khẳng định vật chất chỉ là một dạng năng lượng thuần túy.","Đã vượt qua và chỉ ra giới hạn của những hiểu biết trước đây của con người về thế giới vật chất.","Chứng minh thế giới chỉ tồn tại trong ý thức con người."],2],["Theo chủ nghĩa duy vật biện chứng, hình thức vận động nào là cao nhất và phức tạp nhất?",["Vận động cơ học.","Vận động vật lý.","Vận động sinh học.","Vận động xã hội."],3],["Theo triết học Mác - Lênin, tư liệu sản xuất bao gồm:",["Tư liệu lao động và đối tượng lao động","Sức lao động và tư liệu tiêu dùng","Tư liệu lao động và sản phẩm xã hội","Đối tượng lao động và tư liệu tiêu dùng"],0],["Phạm trù nào dùng để chỉ mối liên hệ thống nhất và quy định lẫn nhau giữa chất với lượng; là giới hạn tồn tại của sự vật, hiện tượng mà trong đó sự thay đổi về lượng chưa dẫn đến sự thay đổi về chất, sự vật vẫn là nó, chưa chuyển hoá thành sự vật khác?",["Bước nhảy","Chất","Độ","Lượng"],2],["Theo triết học Mác - Lênin, phương thức sản xuất dùng để chỉ:",["Trình độ phát triển của lực lượng sản xuất trong một giai đoạn lịch sử nhất định","Cách thức con người tiến hành quá trình sản xuất vật chất ở những giai đoạn lịch sử nhất định của xã hội loài người","Toàn bộ các hình thức phân phối của cải vật chất trong xã hội","Tổng số sản phẩm xã hội được tạo ra trong một thời kỳ nhất định"],1],["Cảm giác, tri giác và biểu tượng là các hình thức của giai đoạn nhận thức nào?",["Nhận thức kinh nghiệm","Nhận thức lý tính","Nhận thức khoa học","Nhận thức cảm tính"],3],["Theo triết học Mác - Lênin, kiến trúc thượng tầng là:",["Toàn bộ những quan điểm, tư tưởng xã hội với những thiết chế xã hội tương ứng cùng những quan hệ nội tại của thượng tầng hình thành trên một cơ sở hạ tầng nhất định","Tổng thể các quan hệ sản xuất hợp thành cơ cấu kinh tế của xã hội","Hệ thống các quan điểm đạo đức và phong tục tập quán truyền thống","Toàn bộ lực lượng sản xuất và trình độ công cụ lao động"],0],["Những tri thức mà chủ thể có từ trước, gần như đã thành bản năng, kỹ năng, nằm trong tầng sâu ý thức của chủ thể, là ý thức dưới dạng tiềm tàng được gọi là gì?",["Vô thức","Tự ý thức","Tiềm thức","Ý thức thông thường"],2],["Nghiên cứu nguyên lý về sự phát triển giúp chúng ta nhận thức được rằng, muốn nắm được bản chất, khuynh hướng phát triển của sự vật, hiện tượng thì phải tự giác tuân thủ nguyên tắc:",["Nguyên tắc toàn diện","Nguyên tắc lịch sử - cụ thể","Nguyên tắc khách quan","Nguyên tắc phát triển"],3],["Theo triết học Mác - Lênin, chân lý là:",["Tri thức do số đông thừa nhận là đúng","Tri thức phù hợp với hiện thực khách quan và được thực tiễn kiểm nghiệm","Tri thức mang tính tuyệt đối, không bao giờ thay đổi","Tri thức phản ánh cảm tính trực tiếp về sự vật, hiện tượng"],1],["Mối quan hệ biện chứng giữa cơ sở hạ tầng và kiến trúc thượng tầng là:",["Cơ sở hạ tầng quyết định kiến trúc thượng tầng; kiến trúc thượng tầng tác động trở lại cơ sở hạ tầng","Kiến trúc thượng tầng quyết định tuyệt đối cơ sở hạ tầng, cơ sở hạ tầng không có tính độc lập tương đối","Hai mặt tồn tại hoàn toàn tách rời, không tác động qua lại lẫn nhau","Cơ sở hạ tầng và kiến trúc thượng tầng chỉ thay đổi khi có cách mạng khoa học – kỹ thuật"],0],["Theo triết học Mác – Lênin, nhận thức lý tính có những hình thức nào?",["Cảm giác, tri giác, biểu tượng","Trực giác, niềm tin, lý tưởng","Khái niệm, phạm trù, quy luật","Khái niệm, phán đoán, suy lý"],3],["Phương pháp tư duy nào nhận thức đối tượng trong các mối liên hệ phổ biến vốn có của nó?",["Phương pháp tư duy siêu hình.","Phương pháp tư duy phân tích một chiều.","Phương pháp tư duy biện chứng.","Phương pháp tư duy trực giác cảm tính."],2],["Trường phái triết học nào thừa nhận sự tồn tại của các sự vật, hiện tượng của thế giới nhưng lại phủ nhận đặc trưng “tự thân tồn tại” của chúng?",["Chủ nghĩa duy vật biện chứng.","Thuyết bất khả tri.","Chủ nghĩa nhị nguyên.","Chủ nghĩa duy tâm."],3],["Một trong những nội dung định nghĩa vật chất của V.I. Lênin có ý nghĩa quan trọng giải phóng khoa học tự nhiên khỏi cuộc khủng hoảng thế giới quan là gì?",["Vật chất là cái do ý thức sáng tạo ra.","Vật chất chỉ là tổng hợp các cảm giác.","Vật chất là thực tại khách quan – cái tồn tại bên ngoài ý thức và không lệ thuộc vào ý thức.","Vật chất là cái không thể nhận thức được bằng giác quan."],2],["Từ mối quan hệ giữa vật chất và ý thức trong triết học Mác – Lênin, rút ra nguyên tắc phương pháp luận nào?",["Tuyệt đối hóa vai trò của ý thức, xem nhẹ điều kiện khách quan.","Tuyệt đối hóa điều kiện khách quan, phủ nhận tính năng động chủ quan.","Chỉ dựa vào kinh nghiệm cá nhân trong hoạt động thực tiễn.","Nguyên tắc tôn trọng tính khách quan kết hợp với phát huy tính năng động chủ quan."],3],["Theo chủ nghĩa duy vật biện chứng, đặc điểm của vận động là gì?",["Vận động do lực siêu nhiên bên ngoài quy định.","Vận động chỉ tồn tại trong ý thức con người.","Vận động là hiện tượng ngẫu nhiên, không phổ biến.","Vận động của vật chất là tự thân vận động và mang tính phổ biến."],3],["Phép biện chứng duy vật có những nguyên lý cơ bản nào?",["Nguyên lý về bản chất và hiện tượng.","Nguyên lý về nhân quả và mục đích.","Nguyên lý về mối liên hệ phổ biến và nguyên lý về sự phát triển.","Nguyên lý về hình thức và nội dung."],2],["Theo triết học Mác – Lênin, vật chất có những hình thức vận động cơ bản nào?",["Cơ học, hóa học, sinh học, kỹ thuật, nghệ thuật.","Cơ học, vật lý, tâm lý, sinh học, xã hội.","Cơ học, vật lý, hóa học, sinh học và xã hội.","Vật lý, hóa học, tâm linh, kinh tế, xã hội."],2],["Theo triết học Mác – Lênin, phủ định biện chứng là gì?",["Sự phủ định ngẫu nhiên, làm cho sự vật mất đi không để lại gì.","Sự phủ định từ bên ngoài áp đặt, không theo quy luật.","Sự phủ định làm tiền đề, tạo điều kiện cho sự phát triển của sự vật, hiện tượng.","Sự phủ định hoàn toàn mọi cái cũ, không kế thừa."],2],["Phạm trù nào dùng để chỉ giai đoạn chuyển hóa cơ bản về chất của sự vật, hiện tượng do những thay đổi về lượng trước đó gây ra, là bước ngoặt trong sự biến đổi về lượng?",["Độ.","Điểm nút.","Lượng.","Bước nhảy."],3],["Theo chủ nghĩa duy vật biện chứng, hình thức vận động thấp nhất và giản đơn nhất là gì?",["Vận động sinh học.","Vận động xã hội.","Vận động hóa học.","Vận động cơ học."],3],["Căn cứ nào để phân biệt mâu thuẫn chủ yếu và mâu thuẫn thứ yếu trong sự tồn tại và phát triển của sự vật, hiện tượng?",["Căn cứ vào quy mô không gian của sự vật, hiện tượng.","Căn cứ vào thời gian xuất hiện sớm hay muộn của mâu thuẫn.","Căn cứ vào vai trò của mâu thuẫn đối với sự tồn tại và phát triển của sự vật, hiện tượng trong mỗi giai đoạn nhất định.","Căn cứ vào số lượng các mặt đối lập nhiều hay ít."],2],["Theo chủ nghĩa duy vật biện chứng, hình thức vận động cao nhất và phức tạp nhất là gì?",["Vận động cơ học.","Vận động vật lý.","Vận động sinh học.","Vận động xã hội."],3],["Khi khẳng định tính thứ nhất của ý thức, chủ nghĩa duy tâm chủ quan coi “ý thức” là gì?",["Ý thức xã hội nói chung.","Ý thức tuyệt đối siêu nhiên.","Ý thức cá nhân, ý thức con người","Ý thức của giai cấp thống trị."],2],["Điểm tương đồng của các quan niệm duy vật về vật chất thời cổ đại là gì?",["Đồng nhất vật chất với cảm giác.","Đồng nhất vật chất với năng lượng.","Đồng nhất vật chất với vận động cơ học.","Đồng nhất vật chất với vật thể."],3],["Theo chủ nghĩa duy vật biện chứng, các dạng vật chất cụ thể biểu hiện sự tồn tại của mình ở đâu và thông qua yếu tố gì?",["Tồn tại ngoài không gian, thời gian và thông qua cảm giác để biểu hiện.","Tồn tại trong ý thức và biểu hiện qua tư duy.","Các dạng cụ thể của vật chất tồn tại trong không gian, thời gian và thông qua vận động mà biểu hiện sự tồn tại của mình.","Chỉ tồn tại trong không gian, không gắn với thời gian và vận động."],2],["Hình thức tồn tại của vật chất vận động xét về mặt độ dài diễn biến, sự kế tiếp của các quá trình được gọi là gì?",["Không gian.","Vận động.","Sự đứng im.","Thời gian."],3],["Tiêu chuẩn để kiểm tra đường lối đổi mới của Đảng Cộng sản Việt Nam là gì?",["Cương lĩnh, nghị quyết của Đảng.","Dư luận và ý kiến quốc tế.","Truyền thống lịch sử dân tộc.","Thực tiễn nước Việt Nam."],3],["Câu nói: “Muốn cứu nước, giải phóng dân tộc, không có con đường nào khác con đường cách mạng vô sản” là của ai?",["C. Mác.","V.I. Lênin.","Phan Bội Châu.","Hồ Chí Minh."],3],["Một trong những đặc trưng cơ bản của Nhà nước pháp quyền xã hội chủ nghĩa Việt Nam được Đảng ta nhấn mạnh trong văn kiện Đại hội XII là gì?",["Nhà nước pháp quyền xã hội chủ nghĩa thực hiện tam quyền phân lập triệt để.","Nhà nước pháp quyền xã hội chủ nghĩa đứng trên Đảng và nhân dân.","Nhà nước pháp quyền xã hội chủ nghĩa đặt dưới sự lãnh đạo của Đảng Cộng sản, tồn tại theo nguyên tắc: “Đảng lãnh đạo, Nhà nước quản lý, nhân dân làm chủ”.","Nhà nước pháp quyền xã hội chủ nghĩa do Quốc hội trực tiếp lãnh đạo toàn diện."],2],["Hồ Chí Minh cho rằng các nước thuộc địa và phụ thuộc, dân tộc chỉ có thể giải phóng triệt để khi nào?",["Khi dựa vào sự giúp đỡ của các nước đế quốc tiến bộ.","Khi liên minh với giai cấp tư sản dân tộc trong nước.","Khi dựa vào phong trào yêu nước của trí thức tiểu tư sản.","Khi đặt dưới sự lãnh đạo của giai cấp công nhân và thực hiện thắng lợi các mục tiêu của cách mạng xã hội chủ nghĩa."],3],["Những cố gắng, nỗ lực, khả năng huy động mọi tiềm năng trong mỗi con người vào hoạt động để vượt qua trở ngại, đạt mục đích đề ra được gọi là gì?",["Nhu cầu.","Tình cảm.","Ý chí.","Niềm tin."],2],["Điền vào chỗ trống cho đúng: “Tiến hóa là một dạng của phát triển, … và thường là sự biến đổi hình thức tồn tại xã hội từ đơn giản đến phức tạp”.",["Diễn ra một cách đột biến.","Diễn ra hoàn toàn ngẫu nhiên.","Diễn ra theo cách từ từ.","Diễn ra không theo bất kỳ quy luật nào."],2],["Câu “Chớp Đông nhay nháy, gà gáy thì mưa” là biểu hiện của :",["Ý thức tôn giáo.","Ý thức chính trị.","Ý thức khoa học.","Ý thức xã hội thông thường."],3],["Câu “Trâu đi tìm cọc, chứ cọc không đi tìm trâu” là biểu hiện của:",["Ý thức khoa học.","Tâm lý xã hội.","Ý thức pháp quyền.","Ý thức đạo đức lý luận."],1],["Ph. Ăngghen dựa trên cơ sở nào để sắp xếp 5 hình thức vận động theo trình độ từ thấp đến cao?",["Trình độ phát triển của xã hội loài người.","Trình độ nhận thức của con người.","Trình độ kết cấu của thế giới vật chất.","Mức độ phức tạp của các hiện tượng tâm lý."],2],["Theo chủ nghĩa duy vật biện chứng, đáp án nào sau đây là sai khi nói về “đứng im”?",["Đứng im chỉ là tương đối, còn vận động là tuyệt đối.","Đứng im là trạng thái cân bằng tạm thời trong một quá trình vận động.","Đứng im là điều kiện giúp nhận rõ hơn sự vận động của sự vật.","Đứng im là tuyệt đối"],3],["Ý nghĩa phương pháp luận rút ra từ việc tìm hiểu nguyên lý về sự phát triển của triết học Mác – Lênin là gì?",["Chỉ xem xét sự vật ở trạng thái tĩnh tại, không biến đổi.","Chỉ chú ý đến mặt lượng, bỏ qua mặt chất của sự vật.","Phải xem xét sự vật trong quá trình vận động và phát triển đi lên.","Chỉ quan tâm đến điểm khởi đầu, không chú ý kết quả cuối cùng."],2],["Theo chủ nghĩa duy vật biện chứng, phạm trù nào dùng để chỉ tính có thực của thế giới xung quanh con người?",["Bản chất.","Hiện tượng.","Tồn tại.","Hình thức."],2],["Phương pháp tư duy nào coi nguyên nhân của sự biến đổi nằm bên ngoài đối tượng?",["Phương pháp tư duy biện chứng.","Phương pháp tư duy lịch sử – cụ thể.","Phương pháp tư duy trực giác.","Phương pháp tư duy siêu hình."],3],["Nhà triết học nào khẳng định thế giới “ý niệm”, hay “ý niệm tuyệt đối” là bản thể, sinh ra toàn bộ thế giới hiện thực?",["Platôn.","Cantơ.","Hêghen.","Phoiơbắc."],2],["Trạng thái vận động nào chưa làm thay đổi cơ bản về chất của sự vật?",["Vận động nhảy vọt.","Vận động đột biến.","Vận động trong thăng bằng.","Vận động phá vỡ cấu trúc cũ."],2],["Nhà triết học duy danh nào cho rằng cái riêng tồn tại như đối tượng vật chất cảm tính?",["Tôma Aquinô.","Đềcáctơ.","Occam","Bêcơn."],2],["Một trong những cơ sở lý luận của tư tưởng Hồ Chí Minh về con người là gì?",["Triết lý nhân sinh của Nho giáo.","Học thuyết nhân quả của Phật giáo.","Đạo đức truyền thống dân tộc.","Lý luận về con người của chủ nghĩa Mác – Lênin."],3],["Theo Hồ Chí Minh, “chữ người” theo nghĩa rộng là chỉ những ai?",["Cán bộ, đảng viên trong cả nước.","Giai cấp công nhân và nông dân.","Đồng bào cả nước.","Nhân dân lao động các tỉnh miền núi."],2],["Hạt nhân lý luận của thế giới quan theo triết học Mác – Lênin là gì?",["Khoa học tự nhiên.","Khoa học xã hội.","Triết học.","Đạo đức học."],2],["Theo chủ nghĩa duy vật biện chứng, điều kiện cần và đủ cho sự ra đời của ý thức là gì?",["Chỉ cần bộ óc con người phát triển.","Chỉ cần có lao động sản xuất vật chất.","Chỉ cần có ngôn ngữ và giao tiếp xã hội.","Những tiền đề tự nhiên và những tiền đề xã hội"],3],["Lần đầu tiên trong lịch sử, C. Mác và Ph. Ăngghen đã công khai tính giai cấp của triết học, biến triết học thành vũ khí tinh thần cho giai cấp nào?",["Giai cấp nông dân.","Giai cấp tư sản.","Tầng lớp trí thức.","Giai cấp vô sản."],3],["Phạm trù nào dùng để chỉ hình thức tồn tại của vật chất?",["Vận động và đứng im.","Nguyên nhân và kết quả.","Không gian và thời gian.","Nội dung và hình thức."],2],["Theo quan điểm biện chứng duy vật, “phủ định biện chứng” là gì?",["Sự phủ định sạch trơn, xóa bỏ hoàn toàn cái cũ.","Sự phủ định ngẫu nhiên, không theo quy luật.","Sự phủ định làm tiền đề, tạo điều kiện cho sự phát triển","Sự phủ định từ bên ngoài áp đặt lên sự vật."],2],["Theo chủ nghĩa duy vật biện chứng, mối liên hệ phổ biến có những tính chất cơ bản nào?",["Tính chủ quan, tính tạm thời, tính bộ phận.","Tính ổn định tuyệt đối, tính đơn giản, tính biệt lập.","Tính khách quan, tính đa dạng phong phú, tính phổ biến.","Tính ngẫu nhiên, tính cục bộ, tính tuyệt đối."],2],["Hình thức tồn tại của vật chất xét về mặt “quãng tính”, sự cùng tồn tại, trật tự, kết cấu và sự tác động lẫn nhau được gọi là gì?",["Thời gian.","Vận động.","Sự đứng im.","Không gian."],3],["Phạm trù nào dùng để chỉ mối liên hệ thống nhất và quy định lẫn nhau giữa chất với lượng; là giới hạn tồn tại của sự vật, hiện tượng mà trong đó sự thay đổi về lượng chưa dẫn đến sự thay đổi về chất; sự vật vẫn là nó, chưa chuyển hóa thành sự vật khác?",["Lượng.","Chất.","Độ.","Điểm nút."],2],["V.I. Lênin sinh ngày, tháng, năm nào?",["20/04/1869.","22/04/1870.","21/01/1870.","30/03/1871."],1],["Khi xem xét theo chiều sâu thế giới nội tâm con người, các cấp độ của ý thức bao gồm:",["Cảm giác, tri giác, tư duy.","Ý chí, tình cảm, niềm tin.","Tự ý thức, tiềm thức, vô thức.","Ý thức, tiềm thức, trí nhớ."],2],["Ưu điểm của chủ nghĩa duy vật trước Mác về bản chất thế giới là gì?",["Phủ nhận sự tồn tại khách quan của thế giới vật chất.","Đồng nhất thế giới vật chất với cảm giác chủ quan.","Thừa nhận sự tồn tại khách quan của thế giới vật chất, lấy bản thân giới tự nhiên để giải thích về tự nhiên.","Cho rằng bản chất thế giới là “ý niệm tuyệt đối”."],2],["Ph. Ăngghen sinh ngày, tháng, năm nào?",["18/11/1820.","28/10/1820.","28/11/1820.","02/12/1820."],2],["Những nội dung cơ bản của tư tưởng Hồ Chí Minh về con người là gì?",["Giải phóng dân tộc, chú trọng kinh tế thị trường tự do.","Xem con người chủ yếu là công cụ sản xuất.","Giải phóng nhân dân lao động, giải phóng giai cấp, giải phóng dân tộc; coi con người vừa là mục tiêu, vừa là động lực của cách mạng; phát triển con người toàn diện.","Coi mục tiêu cao nhất chỉ là phát triển lực lượng sản xuất."],2],["Lý luận nào được xem là “kim chỉ nam”, là nền tảng lý luận cho việc hoạch định các chủ trương, chính sách về con người và phát triển con người ở Việt Nam hiện nay?",["Học thuyết Nho giáo về tu thân.","Lý luận đạo đức truyền thống dân tộc.","Chủ nghĩa tự do cá nhân hiện đại.","Tư tưởng Hồ Chí Minh về con người."],3],["Một trong những ý nghĩa phương pháp luận rút ra từ việc nghiên cứu cặp phạm trù “tất nhiên và ngẫu nhiên” là gì?",["Có thể bỏ qua ngẫu nhiên, chỉ cần nghiên cứu tất nhiên.","Chỉ cần xem xét những hiện tượng đơn lẻ là đã thấy tất nhiên.","Trong hoạt động nhận thức, chỉ có thể chỉ ra cái tất nhiên bằng cách nghiên cứu những ngẫu nhiên mà tất nhiên phải đi qua.","Tất nhiên và ngẫu nhiên hoàn toàn tách biệt, không liên hệ."],2],["Hình thức tồn tại của vật chất vận động xét về mặt độ dài diễn biến, sự kế tiếp của các quá trình được gọi là gì?",["Không gian.","Vận động.","Sự đứng im.","Thời gian."],3],["Triết học nào khẳng định thế giới vật chất tồn tại vĩnh viễn, vô tận, vô hạn, không được sinh ra và không mất đi?",["Chủ nghĩa duy tâm chủ quan.","Chủ nghĩa nhị nguyên.","Chủ nghĩa duy vật chất phác cổ đại.","Chủ nghĩa duy vật biện chứng."],3],["Khi nước chuyển từ trạng thái lỏng sang trạng thái khí tại nhiệt độ sôi (ở áp suất bình thường), hiện tượng đó được gọi là gì trong quy luật lượng – chất?",["Sự biến đổi về lượng thuần túy.","Sự thay đổi độ của sự vật.","Bước nhảy của sự vật.","Sự thay đổi ngẫu nhiên, không theo quy luật."],2],["Theo chủ nghĩa duy vật biện chứng, khẳng định nào sau đây là đúng?",["Không gian và thời gian tồn tại độc lập, tách rời vật chất.","Thời gian là có thật, còn không gian chỉ là sản phẩm của tư duy.","Vật chất có thể tồn tại ngoài không gian và thời gian.","Không gian và thời gian là hình thức tồn tại của vật chất, không tách rời vật chất."],3],["Ví dụ nào minh họa cho quy luật mâu thuẫn trong quá trình tiến hóa sinh giới?",["Quang hợp và hô hấp của cây xanh.","Sinh sản và tử vong của sinh vật.","Đồng hóa và dị hóa","Di truyền và biến dị của các loài."],2],["Theo triết học Mác – Lênin, phạm trù “nguyên nhân” là gì?",["Mọi sự kiện xảy ra trước một hiện tượng nào đó.","Sự tương tác lẫn nhau giữa các mặt trong một sự vật, hiện tượng hoặc giữa các sự vật, hiện tượng với nhau gây nên những biến đổi nhất định.","Những yếu tố ngẫu nhiên làm thay đổi sự vật.","Kết quả chủ quan do con người gán cho sự vật."],1],["Trong triết học Mác – Lênin, “điểm nút” được hiểu là gì?",["Điểm bắt đầu của quá trình phát triển.","Thời điểm mà lượng và chất hoàn toàn tách rời nhau.","Thời điểm mà tại đó sự thay đổi về lượng dẫn đến sự thay đổi về chất của sự vật, hiện tượng.","Thời điểm sự vật ngừng vận động, phát triển."],2],["Theo triết học Mác – Lênin, tiền đề cho sự thống nhất của thế giới là gì?",["Sự thống nhất của ý thức nhân loại.","Sự thống nhất về mặt tôn giáo và văn hóa.","Sự tồn tại của một thế giới vật chất thống nhất.","Sự thống nhất của các quốc gia, dân tộc."],2],["Theo triết học Mác – Lênin, phạm trù “ngẫu nhiên” được hiểu như thế nào?",["Là mối liên hệ bản chất, tất yếu bên trong sự vật.","Là phạm trù chỉ mối liên hệ không bản chất; do nguyên nhân, hoàn cảnh bên ngoài quy định; có thể xuất hiện, có thể không xuất hiện; có thể xuất hiện thế này hoặc xuất hiện thế khác.","Là cái hoàn toàn không có nguyên nhân nào.","Là mọi sự kiện xảy ra ngoài ý muốn con người."],1],["Năm 1941, Nguyễn Ái Quốc viết trong tập diễn ca lời khẳng định “Việt Nam độc lập năm 1945”; đến ngày 2/9/1945, Người đọc Tuyên ngôn độc lập khai sinh nước Việt Nam Dân chủ Cộng hòa. Hiện tượng này thể hiện điều gì?",["Ý thức xã hội luôn lạc hậu so với tồn tại xã hội.","Ý thức xã hội không có khả năng dự báo hiện thực.","Ý thức cá nhân tách rời hoàn toàn tồn tại xã hội.","Ý thức xã hội có thể vượt trước tồn tại xã hội."],3],["Đảng ta khẳng định: “Chủ nghĩa Mác – Lênin và tư tưởng Hồ Chí Minh là nền tảng tư tưởng, kim chỉ nam cho hành động của Đảng”. Điều đó thể hiện loại ý thức nào?",["Ý thức đạo đức.","Ý thức pháp quyền.","Ý thức chính trị.","Ý thức tôn giáo."],2],["Theo chủ nghĩa duy vật biện chứng, vai trò quyết định của vật chất đối với ý thức được hiểu là:",["Vật chất chỉ quyết định hình thức biểu hiện của ý thức.","Vật chất chỉ quyết định một phần nội dung của ý thức.","Ý thức quyết định nguồn gốc của vật chất.","Vật chất quyết định nguồn gốc, nội dung, bản chất, sự vận động và phát triển của ý thức."],3],["Phép biện chứng duy vật bao gồm những nguyên lý cơ bản nào?",["Nguyên lý nhân – quả và nguyên lý mục đích.","Nguyên lý bản chất – hiện tượng và nguyên lý khả năng – hiện thực.","Nguyên lý về mối liên hệ phổ biến và nguyên lý về sự phát triển.","Nguyên lý hình thức – nội dung và nguyên lý tất nhiên – ngẫu nhiên."],2],["Theo quan điểm triết học Mác – Lênin, phạm trù “cái chung” là gì?",["Phạm trù chỉ những gì chỉ có ở một sự vật, hiện tượng đơn lẻ.","Phạm trù chỉ những mặt, thuộc tính không chỉ có ở một sự vật, hiện tượng mà còn lặp lại ở nhiều sự vật, hiện tượng khác.","Phạm trù chỉ những yếu tố ngẫu nhiên trong sự vật.","Phạm trù chỉ cái cá biệt không lặp lại."],1],["Khẳng định nào sau đây là đúng về bản chất của ý thức?",["Ý thức là hình ảnh khách quan của thế giới khách quan.","Ý thức là thế giới vật chất thu nhỏ.","Ý thức là hình ảnh chủ quan của thế giới khách quan.","Ý thức là thế giới tinh thần tách rời hiện thực."],2],["Quan điểm triết học nào xem vật chất, vận động, không gian, thời gian như những thực thể khác nhau, không có mối liên hệ nội tại với nhau?",["Chủ nghĩa duy vật biện chứng.","Chủ nghĩa duy tâm chủ quan.","Thuyết nhị nguyên.","Chủ nghĩa duy vật siêu hình thế kỷ XVII – XVIII."],3],["Theo triết học Mác – Lênin, hình thức phản ánh cao nhất trong thế giới vật chất là gì?",["Phản xạ sinh lý.","Phản ánh cảm tính.","Phản ánh tâm lý động vật.","Phản ánh ý thức."],3],["Theo chủ nghĩa duy vật biện chứng, phạm trù nào dùng để chỉ tính có thực của thế giới xung quanh con người?",["Bản chất.","Hiện tượng.","Hình thức.","Tồn tại."],3],["Hình thức tồn tại của vật chất là gì?",["Vận động và đứng im.","Nguyên nhân và kết quả.","Nội dung và hình thức.","Không gian và thời gian."],3],["Nhà triết học duy danh nào coi cảm giác là hình thức tồn tại của cái riêng?",["Occam.","Hêghen.","Locke.","Berkeley."],3],["Câu ca dao “Ai ơi cứ ở cho lành, tu thân tích đức để dành về sau” là biểu hiện của:",["Ý thức chính trị.","Ý thức pháp quyền.","Ý thức đạo đức.","Ý thức tôn giáo."],2],["Ở nước ta hiện nay vẫn còn quan niệm “Nhất nam viết hữu, thập nữ viết vô”:",["Ý thức xã hội luôn đi trước tồn tại xã hội.","Ý thức xã hội hoàn toàn độc lập với tồn tại xã hội.","Ý thức xã hội thường lạc hậu hơn tồn tại xã hội.","Ý thức xã hội luôn phù hợp ngay với tồn tại xã hội."],2],["Đảng ta luôn xem con người vừa là mục tiêu, vừa là nguồn gốc, động lực của sự phát triển xã hội. Quan điểm này nhấn mạnh điều gì?",["Con người là sản phẩm thuần túy của hoàn cảnh.","Con người hoàn toàn bị quyết định bởi tự nhiên.","Con người là chủ thể tích cực, tự giác, sáng tạo của lịch sử.","Con người chỉ là đối tượng quản lý của Nhà nước."],2],["Theo triết học Mác – Lênin, sự phát triển có những tính chất cơ bản nào?",["Tính chủ quan, tính bộ phận, tính đơn tuyến, tính bất biến.","Tính khách quan, tính phổ biến, tính kế thừa, tính đa dạng phong phú.","Tính ngẫu nhiên, tính cục bộ, tính khép kín, tính dừng lại.","Tính tạm thời, tính cá biệt, tính biệt lập, tính siêu hình."],1],["Xét theo chiều sâu của thế giới nội tâm, kết cấu của ý thức gồm những yếu tố nào?",["Tri thức, tình cảm, ý chí, niềm tin.","Cảm giác, tri giác, tư duy.","Ý chí, xúc cảm, bản năng.","Tự ý thức, tiềm thức, vô thức."],3],["Đặc trưng của quá trình phát triển biện chứng với tính kế thừa, qua khâu trung gian, tính lặp lại và tính tiến lên được mô phỏng theo:",["Đường thẳng đi lên.","Đường tròn khép kín.","Đường gấp khúc lên xuống.","Đường xoáy ốc."],3],["Khẳng định nào sau đây là đúng theo quan điểm chủ nghĩa duy vật biện chứng về tính thống nhất vật chất của thế giới?",["Bản chất thế giới là ý thức, vật chất chỉ là hiện tượng.","Thế giới thống nhất ở tính tinh thần chung.","Thế giới thống nhất vì do Thượng đế sáng tạo.","Bản chất của thế giới là vật chất, thế giới thống nhất ở tính vật chất."],3],["Đêmôcrít quan niệm cơ sở đầu tiên của mọi vật trong vũ trụ là gì?",["Nước.","Không khí.","Lửa.","Nguyên tử."],3],["Đối với phạm trù “cái riêng, cái chung”, tại sao trong quá trình tồn tại, các nhóm sự vật lại dần dần hình thành những điểm chung?",["Do chúng được con người gán cho các đặc tính giống nhau.","Do ngẫu nhiên trùng hợp về hình thức bên ngoài.","Vì các sự vật, hiện tượng riêng lẻ có liên hệ, tương tác, chuyển hóa lẫn nhau nên hình thành những thuộc tính, tính chất chung.","Vì cái riêng luôn bị cái chung chi phối từ bên ngoài."],2],["Quan điểm triết học nào khẳng định thế giới vật chất không do ai sinh ra và cũng không tự mất đi, tồn tại vĩnh viễn, vô hạn và vô tận?",["Chủ nghĩa duy tâm khách quan.","Chủ nghĩa nhị nguyên.","Chủ nghĩa duy vật siêu hình.","Chủ nghĩa duy vật biện chứng."],3],["Nguyễn Ái Quốc đã chỉ rõ một chân lý:",["Từ cách mạng dân chủ tư sản.","Từ việc phát triển kinh tế thị trường.","ở các nước thuộc địa và phụ thuộc, muốn giải phóng giai cấp phải bắt đầu từ sự nghiệp giải phóng dân tộc.","Từ cải cách văn hóa – giáo dục."],2],["Phương hướng “Xây dựng nền văn hóa tiên tiến, đậm đà bản sắc dân tộc” thể hiện tính chất nào của phủ định biện chứng?",["Tính khách quan.","Tính phổ biến.","Tính kế thừa.","Tính phủ định sạch trơn."],2],["Việt Nam tiến lên chủ nghĩa xã hội, bỏ qua chủ nghĩa tư bản nhưng vẫn kế thừa các thành tựu kinh tế – xã hội mà nhân loại đã đạt được dưới chủ nghĩa tư bản. Điều này thể hiện tính chất nào của phủ định biện chứng?",["Tính ngẫu nhiên.","Tính đối kháng.","Tính tuyệt đối.","Tính kế thừa."],3],["Để thực hiện thắng lợi nội dung của cuộc đấu tranh giai cấp ở Việt Nam, cần phải:",["Chỉ tập trung phát triển kinh tế thị trường, bỏ qua vấn đề xã hội.","Nâng cao năng lực và sức chiến đấu của Đảng; đẩy mạnh toàn diện công cuộc đổi mới và sự nghiệp công nghiệp hóa, hiện đại hóa; phát triển văn hóa, thực hiện tiến bộ và công bằng xã hội.","Giảm bớt vai trò lãnh đạo của Đảng, tăng vai trò thị trường tự do.","Chủ yếu chú ý đến cải cách hành chính, không cần quan tâm đến văn hóa – xã hội."],1],["Để thực hiện thắng lợi nội dung của cuộc đấu tranh giai cấp ở Việt Nam, cần phải làm gì?",["Chỉ chú trọng hội nhập kinh tế, bỏ qua vấn đề an ninh.","Thu hẹp quan hệ đối ngoại, hạn chế giao lưu quốc tế.","Giữ vững ổn định chính trị – xã hội; chủ động, tích cực hội nhập quốc tế; tăng cường quốc phòng và an ninh, mở rộng quan hệ đối ngoại.","Chỉ tập trung vào phát triển kinh tế trong nước, không cần hội nhập."],2],["Để thực hiện mục tiêu “độc lập dân tộc gắn liền với chủ nghĩa xã hội”, cách mạng Việt Nam cần phải:",["Chỉ dựa vào viện trợ quốc tế.","Chỉ dựa vào sức mạnh nội lực dân tộc.","Phát huy sức mạnh đại đoàn kết dân tộc kết hợp với sức mạnh của thời đại.","Dựa chủ yếu vào các lực lượng bên ngoài."],2],["Theo chủ nghĩa duy vật biện chứng, cấp độ cao nhất của cấu trúc vật chất là gì?",["Hệ mặt trời.","Thế giới sinh vật.","Tế bào sống.","Xã hội loài người."],3],["Quan điểm nào giải thích đúng thuật ngữ “phát triển bền vững” trong kinh tế học hiện đại?",["Chỉ cần tăng trưởng nhanh trong hiện tại, không cần quan tâm tới tương lai.","Giữ nguyên trạng, không thay đổi để tránh rủi ro.","Sự phát triển về mọi mặt trong hiện tại nhưng vẫn bảo đảm khả năng tiếp tục phát triển trong tương lai.","Phát triển kinh tế bằng mọi giá, kể cả hy sinh môi trường."],2],["Trường phái triết học nào quan niệm ý thức là nguyên thể đầu tiên, tồn tại vĩnh viễn, là nguyên nhân sinh thành và chi phối sự biến đổi của toàn bộ thế giới vật chất?",["Chủ nghĩa duy vật biện chứng.","Chủ nghĩa duy vật siêu hình.","Thuyết nhị nguyên.","Chủ nghĩa duy tâm."],3],["Trong tác phẩm Chống Đuyrinh, khi bàn về các quy luật, Ph. Ăngghen định nghĩa phép biện chứng là gì?",["Học thuyết về các quy tắc tư duy đúng đắn.","“Chẳng qua chỉ là môn khoa học về những quy luật phổ biến của sự vận động và sự phát triển của tự nhiên, của xã hội loài người và của tư duy”.","Học thuyết về mối quan hệ giữa con người và tôn giáo.","Hệ thống quan điểm về đạo đức cách mạng."],1],["Phạm trù nào là cơ sở phương pháp luận để nắm bắt các hình thức tồn tại của sự vật, phản ánh tính đa dạng của phương pháp nhận thức và hoạt động thực tiễn?",["Nội dung và hình thức.","Nguyên nhân và kết quả.","Tất nhiên và ngẫu nhiên.","Cái riêng và cái chung."],0],["Phương pháp tư duy nào coi nguyên nhân của sự biến đổi nằm bên ngoài đối tượng?",["Phương pháp tư duy biện chứng.","Phương pháp lịch sử – cụ thể.","Phương pháp tư duy siêu hình.","Phương pháp trực giác."],2],["Một trong những nguồn gốc xã hội cho sự ra đời của triết học là:",["Sự phát triển của tôn giáo và thần thoại.","Hình thành nhà nước chiếm hữu nô lệ.","Lao động trí óc đã tách khỏi lao động chân tay.","Sự phát triển của thương nghiệp và tiền tệ."],2],["Theo chủ nghĩa duy vật biện chứng, hình thức vận động thấp nhất và giản đơn nhất là:",["Vận động sinh học.","Vận động hóa học.","Vận động vật lý.","Vận động cơ học."],3],["Nhà triết học nào quan niệm nguồn gốc của ý thức là “ý niệm”, hay “ý niệm tuyệt đối” – bản thể sinh ra toàn bộ thế giới hiện thực?",["Platôn.","Cantơ.","Phoiơbắc.","Hêghen."],3],["Phạm trù nào chỉ tổng thể các mối liên hệ khách quan, tất nhiên, tương đối ổn định bên trong, quy định sự vận động, phát triển của đối tượng và thể hiện mình qua các hiện tượng tương ứng?",["Hiện tượng.","Hình thức.","Bản chất.","Kết cấu."],2],["Theo chủ nghĩa duy vật biện chứng, bản chất của ý thức là:",["Sự phản ánh thụ động, máy móc thế giới bên ngoài.","Sự phản ánh thuần túy chủ quan, tách rời hiện thực.","Sự phản ánh hiện thực khách quan vào bộ óc con người một cách tích cực, sáng tạo.","Sự sáng tạo thuần túy của tinh thần, không phụ thuộc hiện thực."],2],["Trường phái triết học nào quan niệm nguồn gốc của ý thức là “óc tiết ra ý thức như gan tiết ra mật”?",["Chủ nghĩa duy vật biện chứng.","Chủ nghĩa duy vật tầm thường thế kỷ XVIII.","Chủ nghĩa duy tâm khách quan.","Chủ nghĩa duy tâm chủ quan."],1],["Theo triết học Mác – Lênin, cơ sở hạ tầng là:",["Toàn bộ lực lượng sản xuất của một xã hội","Toàn bộ những quan hệ sản xuất của một xã hội hợp thành cơ cấu kinh tế của xã hội","Toàn bộ những quan hệ chính trị trong xã hội","Toàn bộ những quan điểm, tư tưởng xã hội và các thiết chế tương ứng"],1],["Theo quan điểm của triết học Mác – Lênin, mối liên hệ nhân quả bao gồm những tính chất nào?",["Tính chủ quan, tính ngẫu nhiên và tính tất yếu","Tính khách quan, tính bộ phận và tính ngẫu nhiên","Tính khách quan, tính phổ biến và tính tất yếu","Tính tương đối, tính chủ quan và tính phổ biến"],2],["Định nghĩa vật chất của V.I. Lênin đã khẳng định thuộc tính cơ bản nhất của mọi dạng vật chất là gì?",["Tồn tại khách quan","Có khối lượng và trọng lượng","Vĩnh viễn không biến đổi","Chỉ tồn tại trong ý thức con người"],0],["Theo triết học Mác – Lênin, sự phát triển bao gồm những tính chất nào?",["Tính chủ quan; tính ngẫu nhiên; tính đơn tuyến","Tính khách quan; tính kế thừa; tính đa dạng, phong phú","Tính tuần hoàn; tính bất biến; tính khép kín","Tính phủ định sạch trơn; tính tuyệt đối; tính đồng nhất"],1],["Theo triết học Mác – Lênin, tiêu chuẩn khách quan duy nhất để kiểm tra chân lý là:",["Lý luận logic","Trải nghiệm chủ quan của cá nhân","Sự thừa nhận của số đông","Thực tiễn"],3],["Theo triết học Mác – Lênin, suy lý là hình thức của giai đoạn nhận thức nào?",["Nhận thức cảm tính","Nhận thức lý tính","Nhận thức trực quan sinh động","Nhận thức kinh nghiệm đời thường"],1],["Theo triết học Mác – Lênin, quan hệ sản xuất là:",["Tổng hợp các quan hệ kinh tế – vật chất giữa người với người trong quá trình sản xuất vật chất","Tổng hợp các quan hệ giữa con người với tự nhiên","Tổng hợp các quan hệ chính trị giữa giai cấp thống trị và giai cấp bị trị","Tổng hợp các quan hệ phân phối, trao đổi và tiêu dùng ngoài quá trình sản xuất"],0],["Cấu trúc của lực lượng sản xuất được xem xét trên những mặt nào?",["Chỉ trên mặt kinh tế – kỹ thuật","Chỉ trên mặt kinh tế – xã hội","Trên cả mặt kinh tế – kỹ thuật và kinh tế – xã hội","Trên mặt chính trị – xã hội và pháp lý"],2],["Cấu trúc của cơ sở hạ tầng bao gồm:",["Quan hệ sản xuất mầm mống","Quan hệ sản xuất tàn dư","Quan hệ sản xuất thống trị","Bao gồm tất cả các đáp án trên"],3],["Theo chủ nghĩa duy vật biện chứng, hình thức vận động cao nhất và phức tạp nhất là:",["Vận động cơ học","Vận động vật lý","Vận động sinh học","Vận động xã hội"],3],["Trong triết học Mác – Lênin, khái niệm nào dùng để chỉ sự quy định, sự tác động và chuyển hóa lẫn nhau giữa các sự vật, hiện tượng, hay giữa các mặt, các yếu tố của mỗi sự vật, hiện tượng trong thế giới?",["Quy luật","Bản chất","Hình thức","Mối liên hệ"],3],["Theo chủ nghĩa duy vật biện chứng, điều kiện cần và đủ cho sự ra đời của ý thức là gì?",["Chỉ cần bộ óc người phát triển đến một trình độ nhất định","Chỉ cần có lao động sản xuất vật chất","Sự tồn tại của những tiền đề tự nhiên và những tiền đề xã hội","Chỉ cần có ngôn ngữ và giao tiếp"],2],["Thành ngữ “Góp gió thành bão” thể hiện quan niệm triết học nào?",["Mâu thuẫn là nguồn gốc vận động","Phủ định cái cũ để xuất hiện cái mới","Tích lũy về lượng đến một giới hạn sẽ dẫn tới sự thay đổi về chất","Cái ngẫu nhiên sinh ra cái tất nhiên"],2],["Theo triết học Mác – Lênin, phạm trù nào thể hiện quan hệ giữa hai đối tượng khi sự thay đổi của một trong chúng tất yếu làm đối tượng kia thay đổi theo?",["Nguyên nhân","Kết quả","Liên hệ (mối liên hệ)","Tất nhiên"],2],["Những cặp phạm trù nào là cơ sở phương pháp luận giúp chỉ ra các mối liên hệ và sự phát triển của sự vật, hiện tượng như những quá trình tự nhiên?",["Bản chất – hiện tượng; nội dung – hình thức","Nguyên nhân – kết quả; tất nhiên – ngẫu nhiên","Toàn thể – bộ phận; khả năng – hiện thực","Cái riêng – cái chung; tất nhiên – ngẫu nhiên"],1],["Trường phái triết học nào thừa nhận sự tồn tại của các sự vật, hiện tượng của thế giới nhưng phủ nhận đặc trưng “tự thân tồn tại” của chúng?",["Chủ nghĩa duy vật biện chứng","Thuyết nhị nguyên","Thuyết bất khả tri","Chủ nghĩa duy tâm"],3],["Phương châm “Dân biết, dân bàn, dân làm, dân kiểm tra, dân giám sát, dân thụ hưởng” thể hiện điều gì?",["Vai trò lãnh đạo tuyệt đối của Nhà nước","Vai trò quyết định của thị trường","Vai trò chủ thể, vai trò quyết định của quần chúng nhân dân","Vai trò của đội ngũ trí thức là chủ yếu"],2],["Câu “Hiền dữ đâu phải là tính sẵn, phần nhiều do giáo dục mà nên” biểu hiện phương diện nào của con người?",["Phương diện sinh học","Phương diện bẩm sinh, di truyền","Phương diện xã hội (con người là sản phẩm của các quan hệ xã hội, giáo dục)","Phương diện bản năng tự nhiên"],2],["Đối tượng nghiên cứu của triết học Mác – Lênin là gì?",["Chỉ nghiên cứu tự nhiên và xã hội, không nghiên cứu tư duy","Chỉ nghiên cứu ý thức con người","Giải quyết mối quan hệ giữa vật chất và ý thức trên lập trường duy vật biện chứng, đồng thời nghiên cứu những quy luật vận động và phát triển chung nhất của tự nhiên, xã hội và tư duy","Nghiên cứu các khoa học cụ thể và kỹ thuật"],2],["Theo chủ nghĩa duy vật biện chứng, nguồn gốc xã hội của ý thức là gì?",["Tôn giáo và tín ngưỡng","Truyền thống và phong tục tập quán","Lao động và ngôn ngữ","Bản năng sinh tồn của con người"],2],["Trong triết học Mác – Lênin, phạm trù nào dùng để chỉ giai đoạn chuyển hóa cơ bản về chất của sự vật, hiện tượng do những thay đổi về lượng trước đó gây ra, là bước ngoặt trong sự biến đổi về lượng?",["Độ.","Điểm nút.","Lượng.","Bước nhảy."],3],["Một trong những ý nghĩa phương pháp luận rút ra từ việc nghiên cứu cặp phạm trù “nội dung và hình thức” là gì?",["Hình thức luôn quan trọng hơn nội dung.","Có thể tách rời nội dung khỏi hình thức.","Hình thức chỉ thúc đẩy nội dung phát triển khi nó phù hợp với nội dung.","Nội dung phải hoàn toàn lệ thuộc vào hình thức."],2],["Triết học nào xem thế giới như một cỗ máy cơ giới khổng lồ, trong đó mỗi bộ phận luôn ở trạng thái biệt lập, tĩnh tại?",["Chủ nghĩa duy tâm khách quan.","Chủ nghĩa duy vật biện chứng.","Thuyết nhị nguyên.","Chủ nghĩa duy vật siêu hình."],3],["Sự dịch chuyển vị trí của các vật thể trong không gian là đặc trưng cho hình thức vận động nào?",["Vận động sinh học.","Vận động hóa học.","Vận động vật lý.","Vận động cơ học."],3],["Điền vào chỗ trống: “Trước hết là …; sau lao động và đồng thời với lao động là …; đó là hai sức kích thích chủ yếu đã ảnh hưởng đến bộ óc của con vượn, làm cho bộ óc đó dần chuyển thành bộ óc con người”.",["Tự nhiên, xã hội.","Bản năng, kinh nghiệm.","Lao động, ngôn ngữ.","Cảm giác, tri giác."],2],["Yếu tố nào là sự thống nhất hữu cơ giữa tri thức và tình cảm, có vai trò điều khiển, thúc đẩy con người vượt qua khó khăn, hướng tới hoạt động có hiệu quả?",["Niềm tin.","Động cơ.","Ý chí.","Trực giác."],2],["Phương pháp tư duy nào nhận thức đối tượng trong trạng thái cô lập, tách rời đối tượng ra khỏi các quan hệ, không xem xét trong mối liên hệ phổ biến?",["Phương pháp tư duy biện chứng.","Phương pháp lịch sử – cụ thể.","Phương pháp tư duy siêu hình.","Phương pháp quy nạp – diễn dịch."],2],["Vai trò của lao động và ngôn ngữ đối với sự hình thành và phát triển của ý thức là gì?",["Chỉ giúp con người thích nghi tốt hơn với môi trường tự nhiên.","Chỉ làm tăng trí nhớ và khả năng bắt chước.","Làm chuyển biến dần bộ óc của loài vượn người thành bộ óc con người và biến tâm lý động vật thành ý thức con người.","Chỉ tạo ra các thói quen trong sinh hoạt cộng đồng."],2],["Phát minh nổi bật nào của khoa học tự nhiên cuối thế kỷ XIX – đầu thế kỷ XX đã đặt cơ sở đầu tiên bác bỏ quan niệm vật chất đồng nhất với nguyên tử rắn, bất biến?",["Phát minh ra điện tử của Tômxơn.","Phát minh ra tia X của Rơnghen.","Phát hiện hiện tượng phóng xạ của Becơren.","Phát minh ra định luật vạn vật hấp dẫn."],1],["Việc Ph. Ăngghen phân loại các hình thức vận động của vật chất đã đặt cơ sở gì cho khoa học?",["Cơ sở để phủ nhận các khoa học chuyên ngành.","Cơ sở để tách rời giữa khoa học tự nhiên và khoa học xã hội.","Cơ sở cho việc phân loại, phân ngành và hợp loại, hợp ngành các khoa học.","Cơ sở để khẳng định chỉ có một ngành khoa học duy nhất."],2],["Nhà triết học duy tâm Berkeley quan niệm nền tảng của mối liên hệ giữa các đối tượng là gì?",["Lý tính thuần túy.","Ý niệm tuyệt đối.","Thượng đế.","Cảm giác."],3],["Theo triết học Mác – Lênin, hình thức phản ánh cao nhất trong thế giới vật chất là:",["Phản xạ sinh lý.","Phản ánh cảm tính.","Phản ánh tâm lý động vật.","Phản ánh ý thức."],3],["Theo quan điểm triết học Mác – Lênin, phát triển là gì?",["Sự lặp lại tuần hoàn của các trạng thái cũ.","Mọi sự thay đổi bất kỳ trong hiện thực.","Quá trình vận động từ thấp đến cao, từ kém hoàn thiện đến hoàn thiện hơn, từ chất cũ đến chất mới ở trình độ cao hơn.","Sự tăng thêm đơn thuần về số lượng của sự vật."],2],["Quan niệm về vật chất của chủ nghĩa duy vật siêu hình thế kỷ XVII–XVIII là:",["Đồng nhất vật chất với năng lượng.","Đồng nhất vật chất với cảm giác.","Đồng nhất vật chất với khối lượng.","Đồng nhất vật chất với ý niệm."],2],["Điền vào chỗ trống: “Vật chất là một phạm trù triết học dùng để chỉ thực tại khách quan được đem lại cho con người trong …, được … của chúng ta chép lại, chụp lại, phản ánh và tồn tại không lệ thuộc vào …”.",["Tri giác, tri giác, tri giác.","Nhận thức, nhận thức, ý thức.","Trực giác, trực giác, trực giác.","Cảm giác, cảm giác, cảm giác."],3],["Trong phép biện chứng duy vật, phạm trù nào dùng để chỉ những mặt, những đặc điểm chỉ vốn có ở một sự vật, hiện tượng nào đó mà không lặp lại ở sự vật, hiện tượng khác?",["Cái chung.","Cái đơn giản.","Cái phổ biến.","Cái đơn nhất."],3],["Nghiên cứu nguyên lý về sự phát triển giúp chúng ta nhận thức rằng, muốn nắm được bản chất, khuynh hướng phát triển của sự vật, hiện tượng thì phải tự giác tuân thủ nguyên tắc nào?",["Nguyên tắc toàn diện.","Nguyên tắc lịch sử – cụ thể.","Nguyên tắc phát triển.","Nguyên tắc mâu thuẫn."],2],["Loại phản ánh nào có tính chủ động lựa chọn thông tin, xử lý thông tin để tạo ra thông tin mới, phát hiện ý nghĩa của thông tin?",["Phản ánh sinh lý.","Phản ánh cảm tính.","Phản ánh tâm lý động vật.","Ý thức."],3],["Trong lịch sử triết học, ai là người đầu tiên xác lập đối tượng của triết học một cách hợp lý nhất trên lập trường duy vật biện chứng?",["Hêghen.","Phoiơbắc.","C. Mác.","Cantơ."],2],["Theo chủ nghĩa duy vật biện chứng, bản chất của ý thức là:",["Hình ảnh khách quan của thế giới khách quan.","Hình ảnh chủ quan của thế giới khách quan, là quá trình phản ánh tích cực, sáng tạo hiện thực khách quan của óc người.","Sự phản ánh thụ động, máy móc của thế giới bên ngoài.","Sự sáng tạo thuần túy tách rời hiện thực."],1],["Trong triết học Mác – Lênin, khái niệm nào dùng để chỉ toàn bộ những quan điểm về thế giới và về vị trí của con người trong thế giới đó?",["Nhân sinh quan.","Phương pháp luận.","Lý luận nhận thức.","Thế giới quan."],3],["Mâu thuẫn giữa giai cấp công nhân với giai cấp nông dân trong xã hội xã hội chủ nghĩa thuộc loại mâu thuẫn nào?",["Mâu thuẫn đối kháng.","Mâu thuẫn bên ngoài.","Mâu thuẫn cơ giới.","Mâu thuẫn không đối kháng."],3],["Tiến trình từ xã hội Cộng sản nguyên thủy → Chiếm hữu nô lệ → Phong kiến → Tư bản → Xã hội chủ nghĩa là ví dụ về hình thức phủ định nào?",["Phủ định siêu hình.","Phủ định chủ quan.","Phủ định sạch trơn.","Phủ định biện chứng."],3],["Câu “Năng mưa thì giếng năng đầy; Anh năng đi lại mẹ thầy năng thương” biểu hiện quy luật nào?",["Quy luật mâu thuẫn.","Quy luật phủ định của phủ định.","Quy luật chuyển hóa từ những thay đổi về lượng dẫn đến những thay đổi về chất và ngược lại.","Quy luật thống nhất và đấu tranh giữa các mặt đối lập."],2],["Thành ngữ “Góp gió thành bão” biểu hiện quy luật nào của phép biện chứng duy vật?",["Quy luật phủ định của phủ định.","Quy luật mâu thuẫn.","Quy luật chuyển hóa từ những thay đổi về lượng dẫn đến những thay đổi về chất và ngược lại.","Quy luật nhân quả."],2],["Mâu thuẫn giữa giai cấp tư sản với giai cấp vô sản trong xã hội tư bản chủ nghĩa thuộc loại mâu thuẫn nào?",["Mâu thuẫn không cơ bản.","Mâu thuẫn không đối kháng.","Mâu thuẫn thứ yếu.","Mâu thuẫn đối kháng."],3],["Hình thức nào được xem là đỉnh cao của sự phát triển phép biện chứng trong lịch sử triết học?",["Phép biện chứng chất phác cổ đại.","Phép biện chứng duy tâm của Hêghen.","Phép biện chứng siêu hình.","Phép biện chứng duy vật."],3],["Khẳng định nào sau đây là đúng theo quan điểm chủ nghĩa duy vật biện chứng về tính thống nhất vật chất của thế giới?",["Bản chất của thế giới là ý thức, thế giới thống nhất ở tính tinh thần.","Thế giới thống nhất vì do Thượng đế sáng tạo.","Bản chất của thế giới là vật chất, thế giới thống nhất ở tính vật chất.","Thế giới thống nhất ở các chuẩn mực đạo đức chung."],2],["Điểm khác biệt cơ bản giữa hình thức phản ánh ý thức và các hình thức phản ánh khác của thế giới vật chất là gì?",["Chỉ xảy ra trong tự nhiên vô cơ.","Không cần đến bộ óc con người.","Hoàn toàn thụ động, máy móc.","Có tính tích cực, tự giác và sáng tạo cao."],3],["Vai trò của lao động và ngôn ngữ đối với sự hình thành và phát triển của ý thức là:",["Chỉ làm tăng khả năng thích nghi sinh học.","Làm chuyển biến dần bộ óc của loài vượn thành bộ óc con người và biến tâm lý động vật thành ý thức con người.","Chỉ tạo ra các phản xạ có điều kiện.","Chỉ làm tăng khả năng ghi nhớ của con người."],1],["Một trong những đặc trưng bản chất của ý thức là gì?",["Ý thức mang tính bẩm sinh, bất biến.","Ý thức tách rời hoàn toàn hoạt động thực tiễn.","Ý thức chỉ là phản ánh thụ động hiện thực.","Ý thức có tính tích cực, sáng tạo và gắn bó chặt chẽ với thực tiễn xã hội."],3],["Theo chủ nghĩa duy vật biện chứng, ý thức tác động như thế nào đối với vật chất?",["Ý thức hoàn toàn không thể tác động đến vật chất.","Ý thức trực tiếp biến đổi vật chất không cần qua hoạt động của con người.","Ý thức chỉ tồn tại, không có vai trò gì trong thực tiễn.","Ý thức có thể tác động trở lại vật chất thông qua hoạt động thực tiễn của con người."],3],["Những cố gắng, nỗ lực, khả năng huy động mọi tiềm năng trong mỗi con người vào hoạt động để vượt qua trở ngại, đạt mục đích đề ra được gọi là gì?",["Nhu cầu.","Động cơ.","Ý chí.","Tình cảm."],2],["Tác phẩm nào của V.I. Lênin đã đưa ra định nghĩa kinh điển về vật chất, giải quyết triệt để vấn đề cơ bản của triết học?",["Làm gì?","Nhà nước và cách mạng.","Chủ nghĩa đế quốc – giai đoạn tột cùng của chủ nghĩa tư bản.","Chủ nghĩa duy vật và chủ nghĩa kinh nghiệm phê phán."],3],["Khẳng định nào sau đây là đúng về bản chất của ý thức?",["Ý thức là hình ảnh khách quan của thế giới khách quan.","Ý thức là hình ảnh chủ quan, không liên hệ gì với thế giới khách quan.","Ý thức là thế giới vật chất thu nhỏ.","Ý thức là hình ảnh chủ quan của thế giới khách quan."],3],["Theo triết học Mác – Lênin, phạm trù “nguyên nhân” được hiểu là:",["Bất kỳ sự kiện nào xảy ra trước một hiện tượng.","Sự trùng hợp ngẫu nhiên giữa các hiện tượng.","Sự tương tác lẫn nhau giữa các mặt trong một sự vật, hiện tượng hoặc giữa các sự vật, hiện tượng với nhau gây nên những biến đổi nhất định.","Kết quả chủ quan do con người gán cho sự vật."],2],["Anaximander quan niệm cơ sở đầu tiên của mọi vật trong vũ trụ là gì?",["Nước.","Không khí.","Lửa.","Một dạng vật chất đơn nhất, vô định, vô hạn và tồn tại vĩnh viễn – Apeirôn."],3],["Thành tựu khoa học nào đã khắc phục những hạn chế duy tâm trong quan niệm về xã hội?",["Thuyết tiến hóa của Darwin.","Học thuyết giá trị thặng dư của C. Mác.","Tuyên ngôn của Đảng Cộng sản.","Định nghĩa về giai cấp của V.I. Lênin."],3],["Các lớp cấu trúc cơ bản của ý thức gồm:",["Cảm giác, tri giác, tư duy, tưởng tượng.","Tri thức, bản năng, xúc cảm, trí nhớ.","Tri thức, tình cảm, ý chí, niềm tin.","Tri thức, trực giác, bản năng, niềm tin."],2],["Nhiều gia đình vẫn muốn có con trai để “nối dõi tông đường”, kế thừa tài sản. Hiện tượng này biểu hiện điều gì trong đời sống ý thức xã hội?",["Ý thức xã hội luôn đi trước tồn tại xã hội.","Ý thức xã hội hoàn toàn tách rời tồn tại xã hội.","Ý thức xã hội luôn phù hợp ngay với tồn tại xã hội.","Ý thức xã hội thường lạc hậu hơn tồn tại xã hội."],3],["Truyền thống yêu nước, đoàn kết, nhân nghĩa, cần cù lao động, hiếu học được truyền từ đời này sang đời khác là biểu hiện đặc trưng nào của ý thức xã hội?",["Tính giai cấp.","Tính độc lập tương đối.","Tính kế thừa.","Tính phong phú, đa dạng."],2],["Nội dung cơ bản và phương thức tồn tại chủ yếu của ý thức là gì?",["Tình cảm.","Niềm tin.","Ý chí.","Tri thức."],3],["Trong thời đại đế quốc chủ nghĩa, giai cấp tư sản muốn thay thế chủ nghĩa duy vật biện chứng và chủ nghĩa duy vật lịch sử của C. Mác bằng lý luận nào?",["Chủ nghĩa duy vật siêu hình.","Chủ nghĩa thực chứng.","Những lý luận chiết trung, pha trộn của thế giới quan duy tâm và tôn giáo.","Học thuyết tiến hóa sinh học."],2],["Trong phép biện chứng duy vật, phạm trù nào dùng để chỉ những biến đổi xuất hiện do sự tương tác giữa các yếu tố mang tính nguyên nhân gây nên?",["Ngẫu nhiên.","Điều kiện.","Kết quả.","Mục đích."],2],["Căn cứ vào quan hệ giữa các mặt đối lập với sự vật, hiện tượng, có thể phân chia mâu thuẫn thành những loại nào?",["Mâu thuẫn chủ yếu và mâu thuẫn thứ yếu.","Mâu thuẫn đối kháng và mâu thuẫn không đối kháng.","Mâu thuẫn cơ bản và mâu thuẫn không cơ bản.","Mâu thuẫn bên trong và mâu thuẫn bên ngoài."],3],["Theo chủ nghĩa duy vật biện chứng, vận động là gì?",["Sự thay đổi vị trí cơ học của vật trong không gian.","Chỉ là sự thay đổi về mặt sinh học của cơ thể sống.","Những biến đổi tinh thần thuần túy trong ý thức.","Mọi sự thay đổi và mọi quá trình diễn ra trong vũ trụ, từ sự thay đổi vị trí giản đơn cho đến tư duy."],3],["Trong phép biện chứng duy vật, quy luật nào vạch ra cách thức chung nhất của sự vận động, phát triển của thế giới hiện thực khách quan?",["Quy luật thống nhất và đấu tranh giữa các mặt đối lập.","Quy luật phủ định của phủ định.","Quy luật nhân quả.","Quy luật chuyển hóa từ những thay đổi về lượng dẫn đến những thay đổi về chất và ngược lại."],3],["Khi xem xét ý thức theo chiều sâu thế giới nội tâm, yếu tố nào giúp con người thực hiện hành vi đạo đức một cách tự giác?",["Tiềm thức.","Vô thức.","Bản năng.","Tự ý thức."],3],["Chọn quan điểm đúng theo triết học Mác – Lênin về tình cảm:",["Tình cảm chỉ phản ánh các kích thích sinh lý tự nhiên.","Tình cảm là cái bẩm sinh, không thay đổi.","Tình cảm chỉ phản ánh mối quan hệ giữa con người với bản thân mình.","Tình cảm phản ánh quan hệ giữa người với người và quan hệ giữa người với thế giới khách quan."],3],["Theo chủ nghĩa duy vật biện chứng, điều kiện cần và đủ cho sự ra đời của ý thức là gì?",["Chỉ cần có bộ óc con người.","Chỉ cần có điều kiện xã hội.","Sự kết hợp của những điều kiện tự nhiên và những điều kiện xã hội.","Chỉ cần có hoạt động ngôn ngữ."],2],["Theo quan niệm của triết học Mác – Lênin, đấu tranh giữa các mặt đối lập là gì?",["Sự dung hòa, thỏa hiệp giữa các mặt đối lập.","Sự tác động theo xu hướng bài trừ và phủ định lẫn nhau giữa các mặt của sự vật, hiện tượng.","Sự tách rời tuyệt đối giữa các mặt đối lập.","Sự thay thế ngẫu nhiên giữa các mặt đối lập."],1],["Những nội dung nào sau đây thuộc định nghĩa vật chất của V.I. Lênin?",["Vật chất là thực tại khách quan, tồn tại bên ngoài ý thức và không lệ thuộc vào ý thức.","Vật chất là cái khi tác động vào giác quan con người thì đem lại cho con người cảm giác.","Vật chất là cái mà ý thức chẳng qua chỉ là sự phản ánh của nó.","Cả A, B và C đều đúng."],3],["Theo triết học Mác – Lênin, nguồn gốc của sự vận động, phát triển của các sự vật, hiện tượng trong thế giới là do đâu?",["Sự tác động ngẫu nhiên của các lực bên ngoài.","Sự điều khiển của lực lượng siêu nhiên.","Sự thích nghi thụ động với môi trường.","Sự đấu tranh giữa các mặt đối lập bên trong bản thân sự vật, hiện tượng."],3],["Những cố gắng, nỗ lực, khả năng huy động mọi tiềm năng trong mỗi con người vào hoạt động để vượt qua trở ngại, đạt mục đích đề ra được gọi là gì?",["Nhu cầu.","Ý chí.","Động cơ.","Thói quen."],1],["Căn cứ để phân biệt mâu thuẫn đối kháng và mâu thuẫn không đối kháng trong sự tồn tại và phát triển của sự vật, hiện tượng là gì?",["Căn cứ vào số lượng các mặt đối lập.","Căn cứ vào hình thức biểu hiện bên ngoài của mâu thuẫn.","Căn cứ vào mức độ đối lập về lợi ích cơ bản giữa các giai cấp trong một giai đoạn lịch sử nhất định.","Căn cứ vào quy mô không gian của mâu thuẫn."],2],["Theo triết học Mác – Lênin, phạm trù “hình thức” là gì?",["Toàn bộ các thuộc tính bên ngoài của sự vật.","Cái vỏ bề ngoài không liên quan nội dung.","Phương thức tồn tại và phát triển của sự vật, hiện tượng, là hệ thống các mối liên hệ tương đối bền vững giữa các yếu tố cấu thành nó.","Chỉ là hình dạng cảm tính của sự vật."],2],["Khi xem xét ý thức theo chiều sâu của thế giới nội tâm con người, các cấp độ của ý thức gồm những y
