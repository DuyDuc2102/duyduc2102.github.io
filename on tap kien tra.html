ếu tố nào?",["Cảm giác, tri giác, tư duy.","Tri thức, tình cảm, ý chí.","Tự ý thức, tiềm thức, vô thức.","Ý chí, niềm tin, trực giác."],2],["Trong phép biện chứng duy vật, phạm trù nào dùng để chỉ tổng thể tất cả những mặt, những yếu tố tạo nên sự vật, hiện tượng?",["Hình thức.","Kết cấu.","Bản chất.","Nội dung."],3],["Phương pháp tư duy nào chi phối chủ nghĩa duy vật thế kỷ XVII – XVIII?",["Phương pháp tư duy biện chứng.","Phương pháp tư duy trực giác.","Phương pháp tư duy siêu hình.","Phương pháp tư duy thực chứng."],2],["Khi xem xét ý thức theo chiều sâu của thế giới nội tâm con người, kết cấu của ý thức gồm những yếu tố nào?",["Tri thức, tình cảm, ý chí, niềm tin.","Cảm giác, tri giác, tư duy, tưởng tượng.","Ý chí, xúc cảm, bản năng, trực giác.","Tự ý thức, tiềm thức, vô thức."],3],["Hình thức đầu tiên của chủ nghĩa duy vật trong lịch sử triết học là gì?",["Chủ nghĩa duy vật siêu hình.","Chủ nghĩa duy vật biện chứng.","Chủ nghĩa duy vật lịch sử.","Chủ nghĩa duy vật chất phác."],3],["Chủ nghĩa duy tâm có những hình thức cơ bản nào?",["Chủ nghĩa duy tâm cổ điển và duy tâm hiện đại.","Chủ nghĩa duy tâm tôn giáo và duy tâm thế tục.","Chủ nghĩa duy tâm khách quan và chủ nghĩa duy tâm chủ quan.","Chủ nghĩa duy tâm thuần túy và duy tâm pha tạp."],2],["Những tri thức mà chủ thể có từ trước, đã gần như trở thành bản năng, kỹ năng, nằm ở tầng sâu ý thức dưới dạng tiềm tàng được gọi là gì?",["Vô thức.","Trí nhớ.","Tiềm thức.","Bản năng."],2],["Phép biện chứng duy vật có những nguyên lý cơ bản nào?",["Nguyên lý nhân quả và nguyên lý mục đích.","Nguyên lý bản chất – hiện tượng và nguyên lý khả năng – hiện thực.","Nguyên lý về mối liên hệ phổ biến và nguyên lý về sự phát triển.","Nguyên lý nội dung – hình thức và nguyên lý toàn thể – bộ phận."],2],["Trên cơ sở phạm trù cái riêng – cái chung, vì sao trong quá trình tồn tại, các nhóm sự vật lại dần dần hình thành những điểm chung?",["Vì chúng được con người quy ước cho giống nhau.","Vì ngẫu nhiên trùng hợp về hình thức bên ngoài.","Vì các sự vật, hiện tượng riêng lẻ có liên hệ, tương tác, chuyển hóa lẫn nhau nên hình thành những thuộc tính, tính chất chung.","Vì cái chung áp đặt từ bên ngoài lên cái riêng."],2],["Nhà triết học Đêmôcrít quan niệm cơ sở đầu tiên của mọi vật trong vũ trụ là gì?",["Nước.","Không khí.","Lửa.","Nguyên tử."],3],["Những hiện tượng tâm lý không do lý trí điều khiển, nằm ngoài phạm vi lý trí và trong một thời điểm nào đó ý thức không kiểm soát được được gọi là gì?",["Tiềm thức.","Bản năng.","Trực giác.","Vô thức."],3],["Yếu tố nào là sự thống nhất hữu cơ giữa tri thức và tình cảm, có vai trò điều khiển, thúc đẩy con người vượt qua khó khăn, hướng tới hoạt động có hiệu quả?",["Niềm tin.","Động cơ.","Ý chí.","Hứng thú."],2],["Theo chủ nghĩa duy vật biện chứng, mối quan hệ giữa vận động và đứng im được hiểu như thế nào?",["Vận động và đứng im hoàn toàn tách rời nhau.","Chỉ có vận động, không hề có đứng im.","Chỉ có đứng im, vận động là ảo giác.","Vận động và đứng im không tách rời nhau; đứng im chỉ là một trạng thái đặc biệt của vận động; vận động là tuyệt đối, còn đứng im là tương đối."],3],["Khi khẳng định tính thứ nhất của ý thức, chủ nghĩa duy tâm chủ quan coi “ý thức” là gì?",["Ý thức xã hội nói chung.","Ý thức tuyệt đối, siêu nhiên.","Ý thức của giai cấp thống trị.","Ý thức cá nhân, ý thức con người"],3],["Quy luật nào vạch ra nguyên nhân, động lực của sự vận động và phát triển của sự vật, hiện tượng?",["Quy luật lượng – chất.","Quy luật phủ định của phủ định.","Quy luật nguyên nhân – kết quả.","Quy luật thống nhất và đấu tranh của các mặt đối lập."],3],["Theo triết học Mác – Lênin, cơ sở lý luận của quan điểm lịch sử – cụ thể là gì?",["Nguyên lý về sự phát triển.","Nguyên tắc toàn diện.","Thế giới quan duy tâm biện chứng.","Nguyên lý về mối liên hệ phổ biến."],3],["Những cặp phạm trù nào là cơ sở phương pháp luận của các phương pháp phân tích – tổng hợp, diễn dịch – quy nạp, khái quát hóa – trừu tượng hóa để nhận thức được toàn bộ các mối liên hệ theo hệ thống?",["Nguyên nhân – kết quả; nội dung – hình thức.","Khả năng – hiện thực; tất nhiên – ngẫu nhiên.","Toàn thể – bộ phận; bản chất – hiện tượng.","Cái riêng – cái chung; tất nhiên – ngẫu nhiên; bản chất – hiện tượng."],3],["Theo chủ nghĩa duy vật biện chứng, đặc điểm về nguồn gốc của vận động là gì?",["Vận động do ý thức con người tạo ra.","Vận động do lực lượng siêu nhiên tác động.","Vận động là trạng thái bất thường của vật chất.","Vận động là sự tự thân vận động của vật chất."],3],["Ý nghĩa phương pháp luận rút ra từ việc nghiên cứu nguyên lý về sự phát triển theo triết học Mác – Lênin là gì?",["Chỉ xem xét sự vật ở trạng thái tĩnh, không vận động.","Chỉ quan tâm khởi điểm, không cần kết quả cuối cùng.","Phải xem xét sự vật trong quá trình vận động và phát triển đi lên.","Chỉ chú ý tới những biến đổi về lượng của sự vật."],2],["Câu “Đời cha ăn mặn, đời con khát nước” biểu hiện phạm trù triết học nào?",["Bản chất và hiện tượng.","Tất nhiên và ngẫu nhiên.","Nguyên nhân và kết quả.","Cái riêng và cái chung."],2],["Câu “Ở hiền gặp lành” biểu hiện phạm trù nào?",["Nội dung và hình thức.","Cơ sở hạ tầng và kiến trúc thượng tầng.","Nguyên nhân và kết quả.","Khả năng và hiện thực."],2],["Câu “Đừng thấy đỏ tưởng chín”, “Xanh vỏ đỏ lòng” biểu hiện cặp phạm trù nào?",["Tất nhiên và ngẫu nhiên.","Cái riêng và cái chung.","Bản chất và hiện tượng.","Nội dung và hình thức."],2],["Đường lối đổi mới của Đảng Cộng sản Việt Nam là ví dụ về:",["Chân lý tuyệt đối.","Ý thức xã hội lạc hậu.","Chân lý tương đối.","Quan điểm chủ quan."],2],["Quan điểm thực tiễn trong triết học Mác – Lênin yêu cầu sinh viên phải:",["Chỉ học lý thuyết, không cần thực hành.","Chỉ làm thực tế, không cần học lý thuyết.","Học để thi, không cần vận dụng.","Học đi đôi với hành, lý luận gắn với thực tiễn."],3],["Câu “Cây xanh thì lá cũng xanh, cha mẹ hiền lành để đức cho con” biểu hiện hình thái ý thức nào?",["Ý thức chính trị.","Ý thức đạo đức.","Ý thức pháp quyền.","Ý thức tôn giáo."],1],["Luận điểm của C. Mác: “Không thể nhận định về một thời đại đảo lộn chỉ căn cứ vào ý thức của thời đại ấy. Trái lại, phải giải thích ý thức ấy bằng những mâu thuẫn của đời sống vật chất…” thể hiện quan điểm nào?",["Ý thức xã hội quyết định tồn tại xã hội.","Ý thức cá nhân quyết định lịch sử.","Tồn tại xã hội quyết định ý thức xã hội.","Ý thức xã hội hoàn toàn độc lập với tồn tại xã hội."],2],["Theo chủ nghĩa duy vật biện chứng, sự tác động của ý thức đối với vật chất phải thông qua hoạt động nào của con người?",["Hoạt động nhận thức thuần túy.","Hoạt động tưởng tượng và mơ ước.","Hoạt động giao tiếp ngôn ngữ.","Hoạt động thực tiễn của con người."],3],["Nhà triết học nào thừa nhận vật chất và ý thức là hai bản nguyên song song cùng tồn tại, cùng quyết định nguồn gốc và sự vận động của thế giới?",["Hêghen.","Đêcáctơ (Descartes).","Phoiơbắc.","Berkeley."],1],["Một trong những nguồn gốc xã hội cho sự ra đời của triết học là gì?",["Sự phát triển của tôn giáo thần thoại.","Sự xuất hiện của tiền tệ và thương nghiệp.","Lao động trí óc đã tách khỏi lao động chân tay, hình thành tầng lớp lao động trí óc.","Sự phát triển của nghệ thuật."],2],["Giải quyết mặt thứ nhất trong vấn đề cơ bản của triết học (quan hệ giữa tư duy và tồn tại) đã xác lập nên những trường phái lớn nào?",["Thuyết nhị nguyên và thuyết đa nguyên.","Thuyết khả tri và bất khả tri.","Chủ nghĩa duy vật và chủ nghĩa duy tâm.","Thực chứng luận và hoài nghi luận."],2],["Ý nghĩa phương pháp luận của việc nghiên cứu quy luật thống nhất và đấu tranh của các mặt đối lập là gì?",["Phủ nhận tính khách quan của mâu thuẫn.","Điều hòa mọi mâu thuẫn, tránh đấu tranh.","Chỉ cần dựa vào ý muốn chủ quan để giải quyết mâu thuẫn.","Phải thừa nhận tính khách quan của mâu thuẫn; phân tích quá trình phát sinh, phát triển, vai trò, vị trí và quan hệ giữa các mâu thuẫn; giải quyết mâu thuẫn bằng đấu tranh giữa các mặt đối lập một cách đúng quy luật, không điều hòa, không nóng vội hay bảo thủ; tùy thuộc điều kiện chín muồi."],3],["Theo triết học Mác – Lênin, phương thức tồn tại của vật chất là gì?",["Không gian.","Thời gian.","Vận động.","Sự đứng im tuyệt đối."],2],["Từ mối quan hệ giữa vật chất và ý thức trong triết học Mác – Lênin, rút ra nguyên tắc phương pháp luận nào?",["Tuyệt đối hóa vai trò ý thức, xem nhẹ điều kiện khách quan.","Tuyệt đối hóa điều kiện khách quan, phủ nhận vai trò chủ quan.","Chỉ dựa vào kinh nghiệm cá nhân trong hoạt động.","Nguyên tắc tôn trọng tính khách quan kết hợp với phát huy tính năng động chủ quan."],3],["Theo chủ nghĩa duy vật biện chứng, hình thức vận động thấp nhất và giản đơn nhất là gì?",["Vận động sinh học.","Vận động hóa học.","Vận động vật lý.","Vận động cơ học."],3],["Những phương tiện vật chất mà con người trực tiếp sử dụng để tác động vào đối tượng lao động nhằm biến đổi chúng, tạo ra của cải vật chất phục vụ nhu cầu của con người và xã hội được gọi là:",["Công cụ lao động","Đối tượng lao động","Tư liệu tiêu dùng","Sức lao động"],0],["Những cố gắng, nỗ lực, khả năng huy động mọi tiềm năng trong mỗi con người vào hoạt động để có thể vượt qua mọi trở ngại, đạt mục đích đề ra được gọi là gì?",["Nhu cầu","Tình cảm","Ý chí","Tri thức"],2],["Theo triết học Mác - Lênin, yếu tố động nhất, cách mạng nhất trong lực lượng sản xuất là:",["Người lao động","Đối tượng lao động","Công cụ lao động","Điều kiện tự nhiên"],2],["Cấu trúc của hình thái kinh tế - xã hội bao gồm những yếu tố cơ bản nào?",["Lực lượng sản xuất và kiến trúc thượng tầng","Quan hệ sản xuất và kiến trúc thượng tầng","Lực lượng sản xuất, quan hệ sản xuất, kiến trúc thượng tầng","Lực lượng sản xuất, quan hệ giai cấp, ý thức xã hội"],2],["Hình thức nhận thức nào cần có sự tác động trực tiếp của khách thể lên các giác quan của con người?",["Cảm giác","Biểu tượng","Tư duy trừu tượng","Suy lý"],0],["Theo phép biện chứng duy vật, “Chất” của sự vật được tổng hợp tạo thành từ:",["Các thuộc tính ngẫu nhiên của sự vật","Các thuộc tính cơ bản của sự vật","Số lượng các thuộc tính của sự vật","Các thuộc tính thứ yếu và tạm thời"],1],["Trong phép biện chứng duy vật, phạm trù nào dùng để chỉ các mặt, các đặc điểm chỉ vốn có ở một sự vật, hiện tượng nào đó mà không lặp lại ở sự vật, hiện tượng nào khác?",["Cái đơn nhất","Cái phổ biến","Cái tất nhiên","Cái ngẫu nhiên"],0],["Phương pháp tư duy nào chi phối chủ nghĩa duy vật thế kỷ XVII - XVIII?",["Phương pháp tư duy biện chứng","Phương pháp tư duy siêu hình","Phương pháp tư duy trực quan","Phương pháp tư duy thực chứng hiện đại"],1],["Từ mối quan hệ giữa vật chất và ý thức trong triết học Mác - Lênin, rút ra nguyên tắc phương pháp luận gì?",["Nguyên tắc đề cao tuyệt đối vai trò ý thức","Nguyên tắc coi thường tính khách quan của hiện thực","Nguyên tắc tôn trọng tính khách quan kết hợp với phát huy tính năng động chủ quan","Nguyên tắc xuất phát từ ý thức để quyết định vật chất"],2],["Cơ sở khách quan quy định sự vận động, phát triển không ngừng của lực lượng sản xuất là:",["Do vai trò của người lao động là chủ thể sáng tạo, là lực lượng sản xuất hàng đầu, do tính kế thừa khách quan của sự phát triển lực lượng sản xuất trong tiến trình lịch sử","Do biện chứng giữa sản xuất và nhu cầu con người","Do tính năng động và cách mạng của sự phát triển công cụ lao động","Bao gồm tất cả các phương án trên"],3],["Trong phép biện chứng duy vật, phạm trù nào dùng để chỉ các mặt, các đặc điểm chỉ vốn có ở một sự vật, hiện tượng nào đó mà không lặp lại ở sự vật, hiện tượng khác?",["Cái chung.","Cái phổ biến.","Cái cá biệt.","Cái đơn nhất."],3],["Tính khoa học và cách mạng rõ nét nhất của phép biện chứng duy vật Mác – Lênin thể hiện như thế nào?",["Chỉ dùng để giải thích thế giới trên bình diện lý luận.","Chỉ tổng kết các tri thức khoa học riêng lẻ.","Không dừng lại ở sự giải thích thế giới mà còn là công cụ để nhận thức và cải tạo thế giới.","Chỉ phê phán các quan điểm triết học khác."],2],["Trạng thái vận động nào chưa làm thay đổi cơ bản về vị trí, hình dáng, kết cấu của sự vật?",["Vận động cơ học.","Vận động hóa học.","Vận động nhảy vọt.","Vận động trong thế cân bằng."],3],["Khái niệm nào dùng để chỉ biện chứng của bản thân thế giới tồn tại khách quan, độc lập với ý thức con người?",["Biện chứng chủ quan.","Phép biện chứng duy tâm.","Siêu hình học.","Biện chứng khách quan."],3],["Theo triết học Mác – Lênin, cơ sở của sự tồn tại đa dạng các mối liên hệ giữa các sự vật, hiện tượng là gì?",["Sự đa dạng của ý thức xã hội.","Sự phong phú của kinh nghiệm cá nhân.","Tính thống nhất vật chất của thế giới.","Sự khác biệt về không gian và thời gian."],2],["Theo chủ nghĩa duy vật biện chứng, hình thức vận động cao nhất và phức tạp nhất là:",["Vận động cơ học.","Vận động vật lý.","Vận động sinh học.","Vận động xã hội."],3],["Theo triết học Mác – Lênin, nguồn gốc của sự vận động, phát triển của các sự vật, hiện tượng trong thế giới là do đâu?",["Ảnh hưởng ngẫu nhiên của môi trường bên ngoài.","Sự điều khiển của lực lượng siêu nhiên.","Sự thích nghi thụ động với hoàn cảnh.","Sự đấu tranh giữa các mặt đối lập bên trong bản thân sự vật, hiện tượng."],3],["Theo chủ nghĩa duy vật biện chứng, vai trò của tất nhiên và ngẫu nhiên trong quá trình phát triển của sự vật, hiện tượng là gì?",["Ngẫu nhiên giữ vai trò quyết định, tất nhiên chỉ bổ sung.","Tất nhiên và ngẫu nhiên hoàn toàn tách rời nhau.","Tất nhiên giữ vai trò chi phối sự phát triển, còn ngẫu nhiên có thể làm cho sự phát triển ấy diễn ra nhanh hoặc chậm.","Chỉ có tất nhiên, không tồn tại ngẫu nhiên."],2],["Theo phép biện chứng duy vật, “quy luật” được hiểu là gì?",["Mối liên hệ chủ quan do con người đặt ra.","Mối liên hệ ngẫu nhiên, tạm thời giữa các sự vật.","Mối liên hệ khách quan, bản chất, bền vững, tất yếu, phổ biến và lặp lại giữa các mặt, các yếu tố, các thuộc tính bên trong một sự vật hoặc giữa các sự vật, hiện tượng với nhau khi có điều kiện phù hợp.","Mối liên hệ chỉ tồn tại trong ý thức con người."],2],["Ph. Ăngghen dựa trên cơ sở nào để sắp xếp 5 hình thức vận động theo trình độ từ thấp đến cao?",["Trình độ nhận thức của con người.","Trình độ phát triển của xã hội.","Trình độ kết cấu của thế giới vật chất.","Mức độ phức tạp của cảm giác con người."],2],["Theo triết học Mác – Lênin, cơ sở lý luận của quan điểm toàn diện là gì?",["Nguyên lý về sự phát triển.","Nguyên tắc lịch sử – cụ thể.","Nguyên tắc mâu thuẫn.","Nguyên lý về mối liên hệ phổ biến."],3],["Điền vào chỗ trống: “Trước hết là …; sau lao động và đồng thời với lao động là …; đó là hai sức kích thích chủ yếu đã ảnh hưởng đến bộ óc của con vượn, làm cho bộ óc đó dần chuyển thành bộ óc con người”.",["Tự nhiên, xã hội.","Bản năng, kinh nghiệm.","Lao động, ngôn ngữ.","Cảm giác, tri giác."],2],["Theo V.I. Lênin, ông kịch liệt phê phán phái Makhơ vì đã đồng nhất điều gì?",["Quy luật vật lý với quy luật tâm lý.","Cảm giác với vật chất.","Quy luật sinh học với quy luật lịch sử.","Khoa học tự nhiên với khoa học xã hội."],2],["Điền vào chỗ trống: “Mối liên hệ là khái niệm dùng để chỉ sự … lẫn nhau giữa các sự vật, hiện tượng, hay giữa các mặt, các yếu tố của mỗi sự vật, hiện tượng trong thế giới”.",["Phụ thuộc đơn phương.","Giống nhau bề ngoài.","Quy định, tác động và chuyển hóa.","Tách rời và đối lập."],2],["Điền vào chỗ trống: “Vật chất là một phạm trù triết học dùng để chỉ thực tại khách quan được đem lại cho con người trong …, được … của chúng ta chép lại, chụp lại, phản ánh và tồn tại không lệ thuộc vào …”.",["Tri giác, tri giác, tri giác.","Nhận thức, nhận thức, ý thức.","Trực giác, trực giác, trực giác.","Cảm giác, cảm giác, cảm giác."],3],["Câu “Chuồn chuồn bay thấp thì mưa, bay cao thì nắng, bay vừa thì râm” là biểu hiện của loại ý thức nào?",["Ý thức khoa học.","Ý thức chính trị.","Ý thức tôn giáo.","Ý thức xã hội thông thường."],3],["Câu “Ta về ta tắm ao ta, dù trong, dù đục, ao nhà vẫn hơn” là biểu hiện của:",["Ý thức chính trị.","Tâm lý xã hội.","Ý thức pháp quyền.","Ý thức khoa học."],1],["Câu “Sống và làm việc theo hiến pháp và pháp luật” là biểu hiện của:",["Ý thức đạo đức.","Ý thức chính trị.","Ý thức pháp quyền.","Ý thức tôn giáo."],2],["Điền vào chỗ trống: “Trước Cách mạng Tháng Tám 1945, nếu không có sự lãnh đạo của … thì không thể xây dựng Đội Việt Nam Tuyên truyền Giải phóng quân …”.",["Việt Nam Quốc dân Đảng.","Đảng Cộng sản Việt Nam.","Đảng Cộng sản Đông Dương.","Đông Dương Cộng sản Đảng."],3],["Điền vào chỗ trống: “Ngày 9/3/1945, khi Nhật đảo chính Pháp ở Đông Dương, Đảng Cộng sản Đông Dương xác định … giành chính quyền đã đến”.",["Thời điểm.","Thắng lợi.","Thời cơ.","Điều kiện."],2],["Vai trò của triết học Mác – Lênin trong sự nghiệp đổi mới toàn diện ở Việt Nam theo định hướng xã hội chủ nghĩa là gì?",["Chỉ là một môn học lý thuyết bắt buộc.","Hệ thống giáo điều không còn phù hợp.","Bộ quy tắc đạo đức cho cán bộ, đảng viên.","Cơ sở lý luận khoa học cho đường lối đổi mới, trong đó hạt nhân là phép biện chứng duy vật."],3],["Theo triết học Mác – Lênin, phạm trù nào dùng để chỉ giai đoạn chuyển hóa cơ bản về chất của sự vật, hiện tượng do những thay đổi về lượng trước đó gây ra, là bước ngoặt trong sự biến đổi về lượng?",["Độ.","Điểm nút.","Lượng.","Bước nhảy."],3],["Điền vào chỗ trống: “Quy luật là những mối liên hệ khách quan, …, tất nhiên, phổ biến và lặp lại giữa các mặt, các yếu tố, các thuộc tính bên trong mỗi một sự vật, hay giữa các sự vật, hiện tượng với nhau”.",["Ngẫu nhiên.","Tạm thời.","Bề ngoài.","Bản chất."],3],["Theo triết học Mác – Lênin, khẳng định nào sau đây là đúng?",["Định nghĩa vật chất của Lênin phủ nhận vai trò của cảm giác.","Định nghĩa vật chất của Lênin đồng nhất vật chất với khối lượng.","Định nghĩa vật chất của V.I. Lênin đã giải quyết đúng đắn vấn đề cơ bản của triết học trên lập trường duy vật.","Định nghĩa vật chất của Lênin cho rằng vật chất là sản phẩm của ý thức."],2],["Trong các yếu tố tạo thành ý thức, yếu tố tình cảm giữ vai trò gì?",["Chỉ tạo ra phản ứng sinh lý nhất thời.","Không có vai trò quan trọng trong ý thức.","Quyết định toàn bộ nội dung tri thức của con người.","Tạo nên sự gắn bó giữa con người với thế giới hiện thực và với người khác."],3],["Sự phản ánh có tính chủ động lựa chọn thông tin, xử lý thông tin để tạo ra những thông tin mới, phát hiện ý nghĩa của thông tin là gì?",["Phản xạ sinh lý.","Phản ánh cảm tính.","Phản ánh tâm lý động vật.","Ý thức."],3],["Ưu điểm cơ bản của các nhà triết học duy vật trước C. Mác là gì?",["Phủ nhận sự tồn tại khách quan của thế giới vật chất.","Xem thế giới vật chất chỉ là sản phẩm của cảm giác.","Thừa nhận sự tồn tại khách quan của thế giới vật chất, lấy bản thân giới tự nhiên để giải thích tự nhiên.","Đồng nhất vật chất với ý thức."],2],["Các lớp cấu trúc cơ bản của ý thức bao gồm:",["Cảm giác, tri giác, tư duy, tưởng tượng.","Tri thức, bản năng, xúc cảm, trí nhớ.","Tri thức, tình cảm, niềm tin, ý chí.","Tri thức, trực giác, bản năng, niềm tin."],2],["Theo triết học Mác – Lênin, khái niệm nào dùng để chỉ sự quy định, sự tác động và chuyển hóa lẫn nhau giữa các sự vật, hiện tượng, hay giữa các mặt, các yếu tố của mỗi sự vật, hiện tượng trong thế giới?",["Bản chất.","Quy luật.","Hình thức.","Mối liên hệ."],3],["Theo triết học Mác – Lênin, cơ sở của mối liên hệ giữa các sự vật, hiện tượng trong thế giới là gì?",["Tính đa dạng của ý thức xã hội.","Sự phong phú của kinh nghiệm cá nhân.","Tính thống nhất vật chất của thế giới.","Sự khác biệt về phong tục, tập quán."],2],["Theo triết học Mác – Lênin, cơ sở lý luận của nguyên tắc toàn diện là:",["Nguyên lý về sự phát triển.","Nguyên tắc lịch sử – cụ thể.","Nguyên tắc mâu thuẫn.","Nguyên lý về mối liên hệ phổ biến."],3],["Quan điểm nào được Đảng ta vận dụng khi xác định: “Để thực hiện mục tiêu dân giàu, nước mạnh, dân chủ, công bằng, văn minh, một mặt phải phát huy nội lực, mặt khác phải tranh thủ thời cơ, vượt qua thử thách do quá trình quốc tế hóa và toàn cầu hóa đưa lại”?",["Quan điểm đấu tranh giai cấp.","Quan điểm nhân văn.","Quan điểm toàn diện và lịch sử – cụ thể.","Quan điểm tuyệt đối hóa yếu tố kinh tế."],2],["Lênin đã chỉ ra thực chất của cuộc khủng hoảng trong vật lý học cuối thế kỷ XIX, đầu thế kỷ XX là gì?",["Khủng hoảng về đội ngũ các nhà khoa học.","Khủng hoảng về phương pháp thực nghiệm.","Khủng hoảng về kỹ thuật đo lường.","Khủng hoảng về thế giới quan và phương pháp luận."],3],["Theo triết học Mác – Lênin, phạm trù “ngẫu nhiên” được hiểu là:",["Mối liên hệ bản chất, tất yếu của sự vật.","Cái hoàn toàn không có nguyên nhân.","Chỉ là sản phẩm của tư duy chủ quan.","Là mối liên hệ không bản chất, do nguyên nhân và hoàn cảnh bên ngoài quy định; có thể xuất hiện hoặc không xuất hiện, có thể xuất hiện thế này hoặc thế khác."],3],["Phát minh nổi bật nào của khoa học tự nhiên cuối thế kỷ XIX – đầu thế kỷ XX đặt cơ sở đầu tiên bác bỏ quan niệm vật chất chỉ là nguyên tử rắn, bất biến?",["Phát hiện hiện tượng phóng xạ của Becơren.","Phát minh ra điện tử của Tômxơn.","Phát minh ra tia X của Rơnghen.","Thuyết tương đối của Anhxtanh."],2],["Kết quả phản ánh của ý thức phụ thuộc vào những yếu tố nào?",["Phẩm chất, năng lực, kinh nghiệm sống của chủ thể.","Đặc điểm, tính chất của đối tượng phản ánh.","Điều kiện lịch sử – xã hội cụ thể.","Tất cả các ý trên."],3],["Những cố gắng, nỗ lực, khả năng huy động mọi tiềm năng trong mỗi con người vào hoạt động để vượt qua mọi trở ngại, đạt mục đích đề ra được gọi là gì?",["Nhu cầu.","Động cơ.","Ý chí.","Hứng thú."],2],["Theo chủ nghĩa duy vật biện chứng, sự hình thành và phát triển của ý thức là kết quả của quá trình nào?",["Hoạt động suy nghĩ thuần túy trong đầu óc con người.","Sự truyền bá tri thức từ thế hệ trước.","Tác động của tôn giáo và tín ngưỡng.","Hoạt động thực tiễn của con người nhằm cải tạo thế giới khách quan."],3],["Theo triết học Mác – Lênin, phạm trù “nội dung” được hiểu là:",["Tổng hợp những thuộc tính bên ngoài của sự vật.","Những yếu tố ngẫu nhiên của sự vật.","Tổng hợp tất cả những mặt, những mối liên hệ tất nhiên, tương đối ổn định bên trong sự vật, quy định sự vận động và phát triển của sự vật.","Toàn bộ những gì con người suy nghĩ về sự vật."],2],["Theo triết học Mác – Lênin, tiền đề cho sự thống nhất của thế giới là gì?",["Sự thống nhất trong ý thức của loài người.","Sự thống nhất về hệ giá trị tinh thần.","Sự tồn tại của một thế giới vật chất thống nhất.","Sự thống nhất về chế độ chính trị – xã hội."],2],["Cách mạng Tháng Tám năm 1945 ở Việt Nam được coi là cuộc cách mạng dân chủ tư sản kiểu mới vì:",["Chỉ nhằm lật đổ chính quyền phong kiến.","Chỉ nhằm cải cách kinh tế.","Do Đảng của giai cấp vô sản lãnh đạo; mục đích là đánh đổ sự thống trị của chính quyền thực dân, phong kiến, giải phóng dân tộc đồng thời giải phóng giai cấp; thiết lập nền chuyên chính vô sản.","Do giai cấp tư sản dân tộc lãnh đạo, thiết lập nền dân chủ tư sản."],2],["Lực lượng cách mạng Tháng Tám năm 1945 ở Việt Nam là:",["Riêng giai cấp công nhân.","Riêng giai cấp nông dân.","Giai cấp công nhân, giai cấp nông dân, tầng lớp trí thức và đông đảo các tầng lớp nhân dân lao động khác.","Chủ yếu là tầng lớp tư sản dân tộc và địa chủ."],2],["Quan điểm coi sự vật chỉ là kết quả của sự phức hợp các cảm giác là của ai?",["Hêghen.","Platôn.","E. Makhơ (chủ nghĩa duy tâm chủ quan).","Cantơ."],2],["Nhà triết học nào không phủ nhận khả năng nhận thức của con người, nhưng giải thích một cách duy tâm, thần bí, cho rằng đó là khả năng của “linh hồn vũ trụ”?",["Arixtốt.","Platôn.","Đêcáctơ.","Phoiơbắc."],1],["Nhà triết học nào cho rằng nhận thức chính là quá trình tự ý thức (tự nhận thức) của “Tinh thần tuyệt đối”, của “tinh thần thế giới”?",["Cantơ.","Berkely.","Hêghen.","Spinoza."],2],["Theo V.I. Lênin, ông kịch liệt phê phán phái Makhơ vì đã đồng nhất điều gì?",["Quy luật vật lý với quy luật tâm lý.","Cảm giác với vật chất.","Quy luật sinh học với quy luật lịch sử.","Khoa học tự nhiên với khoa học xã hội."],2],["Điền vào chỗ trống: “Mối liên hệ là khái niệm dùng để chỉ sự … lẫn nhau giữa các sự vật, hiện tượng, hay giữa các mặt, các yếu tố của mỗi sự vật, hiện tượng trong thế giới”.",["Phụ thuộc đơn phương.","Giống nhau bề ngoài.","Quy định, tác động và chuyển hóa.","Tách rời và đối lập."],2],["Điền vào chỗ trống: “Vật chất là một phạm trù triết học dùng để chỉ thực tại khách quan được đem lại cho con người trong …, được … của chúng ta chép lại, chụp lại, phản ánh và tồn tại không lệ thuộc vào …”.",["Tri giác, tri giác, tri giác.","Nhận thức, nhận thức, ý thức.","Trực giác, trực giác, trực giác.","Cảm giác, cảm giác, cảm giác."],3],["Câu “Chuồn chuồn bay thấp thì mưa, bay cao thì nắng, bay vừa thì râm” là biểu hiện của loại ý thức nào?",["Ý thức khoa học.","Ý thức chính trị.","Ý thức tôn giáo.","Ý thức xã hội thông thường."],3],["Câu “Ta về ta tắm ao ta, dù trong, dù đục, ao nhà vẫn hơn” là biểu hiện của:",["Ý thức chính trị.","Tâm lý xã hội.","Ý thức pháp quyền.","Ý thức khoa học."],1],["Câu “Sống và làm việc theo hiến pháp và pháp luật” là biểu hiện của:",["Ý thức đạo đức.","Ý thức chính trị.","Ý thức pháp quyền.","Ý thức tôn giáo."],2],["Điền vào chỗ trống: “Trước Cách mạng Tháng Tám 1945, nếu không có sự lãnh đạo của … thì không thể xây dựng Đội Việt Nam Tuyên truyền Giải phóng quân …”.",["Việt Nam Quốc dân Đảng.","Đảng Cộng sản Việt Nam.","Đảng Cộng sản Đông Dương.","Đông Dương Cộng sản Đảng."],3],["Điền vào chỗ trống: “Ngày 9/3/1945, khi Nhật đảo chính Pháp ở Đông Dương, Đảng Cộng sản Đông Dương xác định … giành chính quyền đã đến”.",["Thời điểm.","Thắng lợi.","Thời cơ.","Điều kiện."],2],["Vai trò của triết học Mác – Lênin trong sự nghiệp đổi mới toàn diện ở Việt Nam theo định hướng xã hội chủ nghĩa là gì?",["Chỉ là một môn học lý thuyết bắt buộc.","Hệ thống giáo điều không còn phù hợp.","Bộ quy tắc đạo đức cho cán bộ, đảng viên.","Cơ sở lý luận khoa học cho đường lối đổi mới, trong đó hạt nhân là phép biện chứng duy vật."],3],["Theo triết học Mác – Lênin, phạm trù nào dùng để chỉ giai đoạn chuyển hóa cơ bản về chất của sự vật, hiện tượng do những thay đổi về lượng trước đó gây ra, là bước ngoặt trong sự biến đổi về lượng?",["Độ.","Điểm nút.","Lượng.","Bước nhảy."],3],["Điền vào chỗ trống: “Quy luật là những mối liên hệ khách quan, …, tất nhiên, phổ biến và lặp lại giữa các mặt, các yếu tố, các thuộc tính bên trong mỗi một sự vật, hay giữa các sự vật, hiện tượng với nhau”.",["Ngẫu nhiên.","Tạm thời.","Bề ngoài.","Bản chất."],3],["Theo triết học Mác – Lênin, khẳng định nào sau đây là đúng?",["Định nghĩa vật chất của Lênin phủ nhận vai trò của cảm giác.","Định nghĩa vật chất của Lênin đồng nhất vật chất với khối lượng.","Định nghĩa vật chất của V.I. Lênin đã giải quyết đúng đắn vấn đề cơ bản của triết học trên lập trường duy vật.","Định nghĩa vật chất của Lênin cho rằng vật chất là sản phẩm của ý thức."],2],["Trong các yếu tố tạo thành ý thức, yếu tố tình cảm giữ vai trò gì?",["Chỉ tạo ra phản ứng sinh lý nhất thời.","Không có vai trò quan trọng trong ý thức.","Quyết định toàn bộ nội dung tri thức của con người.","Tạo nên sự gắn bó giữa con người với thế giới hiện thực và với người khác."],3],["Sự phản ánh có tính chủ động lựa chọn thông tin, xử lý thông tin để tạo ra những thông tin mới, phát hiện ý nghĩa của thông tin là gì?",["Phản xạ sinh lý.","Phản ánh cảm tính.","Phản ánh tâm lý động vật.","Ý thức."],3],["Ưu điểm cơ bản của các nhà triết học duy vật trước C. Mác là gì?",["Phủ nhận sự tồn tại khách quan của thế giới vật chất.","Xem thế giới vật chất chỉ là sản phẩm của cảm giác.","Thừa nhận sự tồn tại khách quan của thế giới vật chất, lấy bản thân giới tự nhiên để giải thích tự nhiên.","Đồng nhất vật chất với ý thức."],2],["Các lớp cấu trúc cơ bản của ý thức bao gồm:",["Cảm giác, tri giác, tư duy, tưởng tượng.","Tri thức, bản năng, xúc cảm, trí nhớ.","Tri thức, tình cảm, niềm tin, ý chí.","Tri thức, trực giác, bản năng, niềm tin."],2],["Theo triết học Mác – Lênin, khái niệm nào dùng để chỉ sự quy định, sự tác động và chuyển hóa lẫn nhau giữa các sự vật, hiện tượng, hay giữa các mặt, các yếu tố của mỗi sự vật, hiện tượng trong thế giới?",["Bản chất.","Quy luật.","Hình thức.","Mối liên hệ."],3],["Theo triết học Mác – Lênin, cơ sở của mối liên hệ giữa các sự vật, hiện tượng trong thế giới là gì?",["Tính đa dạng của ý thức xã hội.","Sự phong phú của kinh nghiệm cá nhân.","Tính thống nhất vật chất của thế giới.","Sự khác biệt về phong tục, tập quán."],2],["Theo triết học Mác – Lênin, cơ sở lý luận của nguyên tắc toàn diện là:",["Nguyên lý về sự phát triển.","Nguyên tắc lịch sử – cụ thể.","Nguyên tắc mâu thuẫn.","Nguyên lý về mối liên hệ phổ biến."],3],["Quan điểm nào được Đảng ta vận dụng khi xác định: “Để thực hiện mục tiêu dân giàu, nước mạnh, dân chủ, công bằng, văn minh, một mặt phải phát huy nội lực, mặt khác phải tranh thủ thời cơ, vượt qua thử thách do quá trình quốc tế hóa và toàn cầu hóa đưa lại”?",["Quan điểm đấu tranh giai cấp.","Quan điểm nhân văn.","Quan điểm toàn diện và lịch sử – cụ thể.","Quan điểm tuyệt đối hóa yếu tố kinh tế."],2],["Lênin đã chỉ ra thực chất của cuộc khủng hoảng trong vật lý học cuối thế kỷ XIX, đầu thế kỷ XX là gì?",["Khủng hoảng về đội ngũ các nhà khoa học.","Khủng hoảng về phương pháp thực nghiệm.","Khủng hoảng về kỹ thuật đo lường.","Khủng hoảng về thế giới quan và phương pháp luận."],3],["Theo triết học Mác – Lênin, phạm trù “ngẫu nhiên” được hiểu là:",["Mối liên hệ bản chất, tất yếu của sự vật.","Cái hoàn toàn không có nguyên nhân.","Chỉ là sản phẩm của tư duy chủ quan.","Là mối liên hệ không bản chất, do nguyên nhân và hoàn cảnh bên ngoài quy định; có thể xuất hiện hoặc không xuất hiện, có thể xuất hiện thế này hoặc thế khác."],3],["Phát minh nổi bật nào của khoa học tự nhiên cuối thế kỷ XIX – đầu thế kỷ XX đặt cơ sở đầu tiên bác bỏ quan niệm vật chất chỉ là nguyên tử rắn, bất biến?",["Phát hiện hiện tượng phóng xạ của Becơren.","Phát minh ra điện tử của Tômxơn.","Phát minh ra tia X của Rơnghen.","Thuyết tương đối của Anhxtanh."],2],["Kết quả phản ánh của ý thức phụ thuộc vào những yếu tố nào?",["Phẩm chất, năng lực, kinh nghiệm sống của chủ thể.","Đặc điểm, tính chất của đối tượng phản ánh.","Điều kiện lịch sử – xã hội cụ thể.","Tất cả các ý trên."],3],["Những cố gắng, nỗ lực, khả năng huy động mọi tiềm năng trong mỗi con người vào hoạt động để vượt qua mọi trở ngại, đạt mục đích đề ra được gọi là gì?",["Nhu cầu.","Động cơ.","Ý chí.","Hứng thú."],2],["Theo chủ nghĩa duy vật biện chứng, sự hình thành và phát triển của ý thức là kết quả của quá trình nào?",["Hoạt động suy nghĩ thuần túy trong đầu óc con người.","Sự truyền bá tri thức từ thế hệ trước.","Tác động của tôn giáo và tín ngưỡng.","Hoạt động thực tiễn của con người nhằm cải tạo thế giới khách quan."],3],["Theo triết học Mác – Lênin, phạm trù “nội dung” được hiểu là:",["Tổng hợp những thuộc tính bên ngoài của sự vật.","Những yếu tố ngẫu nhiên của sự vật.","Tổng hợp tất cả những mặt, những mối liên hệ tất nhiên, tương đối ổn định bên trong sự vật, quy định sự vận động và phát triển của sự vật.","Toàn bộ những gì con người suy nghĩ về sự vật."],2],["Theo triết học Mác – Lênin, tiền đề cho sự thống nhất của thế giới là gì?",["Sự thống nhất trong ý thức của loài người.","Sự thống nhất về hệ giá trị tinh thần.","Sự tồn tại của một thế giới vật chất thống nhất.","Sự thống nhất về chế độ chính trị – xã hội."],2],["Cách mạng Tháng Tám năm 1945 ở Việt Nam được coi là cuộc cách mạng dân chủ tư sản kiểu mới vì:",["Chỉ nhằm lật đổ chính quyền phong kiến.","Chỉ nhằm cải cách kinh tế.","Do Đảng của giai cấp vô sản lãnh đạo; mục đích là đánh đổ sự thống trị của chính quyền thực dân, phong kiến, giải phóng dân tộc đồng thời giải phóng giai cấp; thiết lập nền chuyên chính vô sản.","Do giai cấp tư sản dân tộc lãnh đạo, thiết lập nền dân chủ tư sản."],2],["Lực lượng cách mạng Tháng Tám năm 1945 ở Việt Nam là:",["Riêng giai cấp công nhân.","Riêng giai cấp nông dân.","Giai cấp công nhân, giai cấp nông dân, tầng lớp trí thức và đông đảo các tầng lớp nhân dân lao động khác.","Chủ yếu là tầng lớp tư sản dân tộc và địa chủ."],2],["Quan điểm coi sự vật chỉ là kết quả của sự phức hợp các cảm giác là của ai?",["Hêghen.","Platôn.","E. Makhơ (chủ nghĩa duy tâm chủ quan).","Cantơ."],2],["Nhà triết học nào không phủ nhận khả năng nhận thức của con người, nhưng giải thích một cách duy tâm, thần bí, cho rằng đó là khả năng của “linh hồn vũ trụ”?",["Arixtốt.","Platôn.","Đêcáctơ.","Phoiơbắc."],1],["Nhà triết học nào cho rằng nhận thức chính là quá trình tự ý thức (tự nhận thức) của “Tinh thần tuyệt đối”, của “tinh thần thế giới”?",["Cantơ.","Berkely.","Hêghen.","Spinoza."],2],["Quan điểm của chủ nghĩa hoài nghi về nhận thức là gì?",["Khẳng định tuyệt đối khả năng nhận thức thế giới.","Phủ nhận hoàn toàn mọi tri thức khoa học.","Thừa nhận con người chỉ nhận thức được hiện tượng, không nhận thức được bản chất.","Nghi ngờ khả năng nhận thức của con người; thậm chí có người (như Hium) còn nghi ngờ cả sự tồn tại khách quan của các sự vật, hiện tượng."],3],["Quan điểm cho rằng, về nguyên tắc con người không thể nhận thức được bản chất thế giới là quan điểm của trường phái nào?",["Quan điểm của chủ nghĩa duy vật biện chứng.","Quan điểm của chủ nghĩa duy tâm khách quan.","Quan điểm của thuyết không thể biết.","Quan điểm của chủ nghĩa hoài nghi."],2],["Quan điểm cho rằng con người không thể nhận thức được “vật tự nó” (Ding an sich), mà chỉ có thể nhận thức được các hiện tượng bên ngoài của sự vật, thuộc về:",["Chủ nghĩa duy vật biện chứng.","Chủ nghĩa duy tâm chủ quan.","Quan điểm của thuyết không thể biết.","Chủ nghĩa kinh nghiệm."],2],["Quan điểm cho rằng phản ánh chỉ là sự sao chép giản đơn, do đó lý luận nhận thức của chủ nghĩa duy vật trước C. Mác mang tính siêu hình, máy móc, là quan điểm của:",["Chủ nghĩa duy tâm chủ quan.","Chủ nghĩa duy tâm khách quan.","Chủ nghĩa duy vật trước C. Mác.","Chủ nghĩa thực chứng."],2],["Do tính chất siêu hình, chủ nghĩa duy vật trước C. Mác hiểu phản ánh chỉ là:",["Sự sáng tạo thuần túy của ý thức.","Sự phản ánh tích cực, sáng tạo.","Sự sao chép giản đơn hiện thực khách quan.","Sự “tự ý thức” của tinh thần tuyệt đối."],2],["Do tính chất trực quan, chủ nghĩa duy vật trước C. Mác hiểu sự phản ánh là:",["Sự phản ánh tích cực, chủ động, sáng tạo.","Sự khái quát bản chất, quy luật của hiện thực.","Sự tiếp nhận thụ động, một chiều những tác động trực tiếp của sự vật lên giác quan con người.","Sự tái tạo lại hiện thực thông qua thực tiễn."],2],["Các nguyên tắc xây dựng lý luận nhận thức của chủ nghĩa duy vật biện chứng là:",["Thừa nhận sự vật khách quan tồn tại bên ngoài và độc lập với ý thức con người.","Cảm giác, tri giác, ý thức nói chung là hình ảnh của thế giới khách quan.","Thực tiễn là tiêu chuẩn để kiểm tra hình ảnh đúng – sai của cảm giác, ý thức nói chung.","Bao gồm đầy đủ cả A, B và C."],3],["Triết học Mác – Lênin quan niệm thế nào về nguồn gốc của nhận thức?",["Nhận thức bắt nguồn từ ý niệm bẩm sinh.","Nhận thức bắt nguồn từ “tinh thần thế giới”.","Thế giới vật chất tồn tại khách quan, độc lập với con người, là nguồn gốc duy nhất và cuối cùng của nhận thức.","Nhận thức bắt nguồn từ kinh nghiệm chủ quan thuần túy."],2],["Triết học Mác – Lênin cho rằng nhận thức là gì?",["Sự sáng tạo thuần túy của tinh thần, không phụ thuộc hiện thực.","Sự ghi chép cơ học các tác động cảm giác.","Sự phản ánh hiện thực khách quan vào bộ óc người, “tri giác và biểu tượng của chúng ta là hình ảnh của các vật đó”.","Sự suy luận thuần túy của lý tính tách rời kinh nghiệm."],2],["Quan điểm “Nhận thức là sự tiến gần mãi mãi và vô tận của tư duy đến khách thể” thuộc về:",["Chủ nghĩa duy tâm chủ quan.","Thuyết không thể biết.","Triết học Mác – Lênin.","Chủ nghĩa hoài nghi."],2],["Đối tượng của Cách mạng Tháng Tám năm 1945 ở Việt Nam là:",["Giai cấp địa chủ phong kiến và tư sản dân tộc.","Đế quốc Mỹ xâm lược.","Chính quyền thực dân và phong kiến.","Chế độ quân chủ chuyên chế thời Nguyễn."],2],["Lệnh Tổng khởi nghĩa Tháng Tám 1945 được đưa ra trong tình thế nào?",["Chỉ do phát xít Nhật đầu hàng Đồng minh.","Chỉ do nạn đói hoành hành.","Chỉ do Nhật đảo chính Pháp.","Nạn đói giết chết hàng triệu người, cuộc đảo chính của Nhật đối với Pháp và việc quân đội Nhật đầu hàng Đồng minh ở Đông Dương."],3],["Triết học Mác – Lênin cho rằng nhận thức có đặc trưng gì?",["Quá trình đứng im, bất biến của tư duy.","Quá trình khép kín, không thay đổi nội dung.","Một quá trình biện chứng, luôn vận động và phát triển.","Một hành vi đơn lẻ, tức thời của ý thức."],2],["Triết học Mác – Lênin cho rằng nhận thức là:",["Quá trình thu thập thông tin cảm tính thụ động.","Quá trình suy luận thuần túy trong “đầu óc” tách khỏi thế giới.","Quá trình tác động biện chứng giữa chủ thể và khách thể thông qua hoạt động thực tiễn của con người.","Quá trình hồi tưởng lại các “ý niệm tiên thiên”."],2],["Theo tiếng Hy Lạp cổ, “thực tiễn” (practica) có nghĩa đen là:",["Hoạt động chiêm nghiệm.","Hoạt động suy tư lý luận.","Hoạt động tích cực.","Hoạt động nghi lễ tôn giáo."],2],["Các nhà triết học tôn giáo quan niệm thực tiễn là:",["Hoạt động sản xuất vật chất của con người.","Hoạt động chính trị – xã hội của quần chúng.","Hoạt động khoa học – kỹ thuật.","Hoạt động sáng tạo ra vũ trụ của Thượng đế."],3],["Các nhà triết học duy vật trước chủ nghĩa duy vật biện chứng có quan điểm như thế nào về thực tiễn?",["Đã hiểu đúng bản chất và vai trò quyết định của thực tiễn.","Coi thực tiễn là thứ yếu, phụ thuộc hoàn toàn vào lý luận.","Chưa một đại biểu nào hiểu đúng bản chất của thực tiễn cũng như vai trò của thực tiễn đối với nhận thức.","Coi thực tiễn chỉ là hoạt động lao động chân tay thuần túy."],2],["Theo quan điểm của triết học Mác – Lênin, thực tiễn là gì?",["Hoạt động tinh thần thuần túy của con người.","Hoạt động lễ nghi, tôn giáo của cộng đồng.","Hoạt động nhận thức lý luận trừu tượng.","Toàn bộ những hoạt động vật chất – cảm tính, có tính lịch sử – xã hội của con người nhằm cải tạo tự nhiên và xã hội, phục vụ sự tiến bộ của nhân loại."],3],["Theo chủ nghĩa duy vật biện chứng, thực tiễn có những đặc trưng nào?",["Là hoạt động vật chất – cảm tính của con người.","Là hoạt động mang tính lịch sử – xã hội của con người.","Là hoạt động có mục đích nhằm cải tạo tự nhiên và xã hội phục vụ con người.","Bao gồm đầy đủ cả A, B và C."],3],["Xét theo “chiều dọc”, thực tiễn bao gồm những yếu tố nào?",["Thực tiễn cá nhân, thực tiễn cộng đồng, thực tiễn nhân loại.","Thực tiễn kinh tế, thực tiễn chính trị, thực tiễn văn hóa.","Thực tiễn sản xuất, thực tiễn chiến đấu, thực tiễn học tập.","Thực tiễn mục đích, thực tiễn phương tiện và thực tiễn kết quả."],3],["Thực tiễn bao gồm những hình thức cơ bản nào?",["Hoạt động sản xuất vật chất; hoạt động văn hóa – nghệ thuật; hoạt động tôn giáo.","Hoạt động chính trị; hoạt động đạo đức; hoạt động khoa học.","Hoạt động quân sự; hoạt động giáo dục; hoạt động quản lý.","Hoạt động sản xuất vật chất; hoạt động chính trị – xã hội; hoạt động thực nghiệm khoa học."],3],["Hình thức hoạt động thực tiễn nào xuất hiện sớm nhất, là cơ bản nhất và quan trọng nhất?",["Hoạt động thực nghiệm khoa học.","Hoạt động chính trị – xã hội.","Hoạt động văn hóa – tinh thần.","Hoạt động sản xuất vật chất."],3],["Hoạt động chính trị – xã hội là gì?",["Hoạt động nghiên cứu lý luận thuần túy trong phòng thí nghiệm.","Hoạt động lao động sản xuất vật chất trực tiếp.","Hoạt động giao tiếp hằng ngày giữa các cá nhân.","Hoạt động thực tiễn thể hiện tính tự giác cao của con người nhằm biến đổi, cải tạo xã hội, phát triển các thiết chế xã hội, các quan hệ xã hội…"],3],["Trước Cách mạng Tháng Tám 1945, nếu không có sự lãnh đạo của … thì không xây dựng được Đội Việt Nam Tuyên truyền Giải phóng quân.",["Việt Nam Quốc dân Đảng.","Đông Dương Cộng sản Đảng.","Đảng Cộng sản Đông Dương.","Chính phủ Lâm thời Việt Nam Dân chủ Cộng hòa."],2],["Câu “Sống chết có số, phú quý do trời” thể hiện quan điểm của trường phái triết học nào?",["Chủ nghĩa duy tâm chủ quan.","Chủ nghĩa duy vật biện chứng.","Thuyết hoài nghi.","Chủ nghĩa duy tâm khách quan."],3],["Hoạt động thực nghiệm khoa học là gì?",["Hoạt động chiêm nghiệm thuần túy về thế giới.","Hoạt động sản xuất vật chất quy mô lớn.","Hình thức đặc biệt của hoạt động thực tiễn, trong đó con người chủ động tạo ra những điều kiện không có sẵn trong tự nhiên để tiến hành thực nghiệm khoa học theo mục đích đã đề ra.","Hoạt động chính trị – xã hội của quần chúng."],2],["Vai trò của thực tiễn đối với nhận thức là gì?",["Thực tiễn là cơ sở, động lực của nhận thức.","Thực tiễn là mục đích của nhận thức.","Thực tiễn là tiêu chuẩn kiểm tra chân lý.","Bao gồm tất cả các ý trên."],3],["Chọn đáp án đúng về thực tiễn với tư cách là tiêu chuẩn chân lý:",["Thực tiễn chỉ là tiêu chuẩn tuyệt đối của chân lý.","Thực tiễn chỉ có ý nghĩa tương đối, không kiểm tra được chân lý.","Thực tiễn là tiêu chuẩn của chân lý vừa có tính tuyệt đối, vừa có tính tương đối.","Thực tiễn không phải là tiêu chuẩn của chân lý."],2],["Tính tuyệt đối của thực tiễn với tư cách là tiêu chuẩn chân lý thể hiện ở chỗ:",["Thực tiễn luôn đúng trong mọi thời đại.","Thực tiễn là tiêu chuẩn khách quan duy nhất để kiểm tra chân lý.","Thực tiễn luôn phù hợp với mọi lý thuyết.","Thực tiễn chỉ là một trong nhiều tiêu chuẩn chủ quan."],1],["Tính tương đối của thực tiễn với tư cách là tiêu chuẩn chân lý thể hiện ở chỗ:",["Thực tiễn luôn bất biến, không thay đổi.","Thực tiễn luôn vận động, biến đổi, phát triển; do đó không thể hoàn toàn khẳng định hoặc bác bỏ dứt khoát mọi biểu tượng của con người trong mọi điều kiện.","Thực tiễn không kiểm tra được chân lý.","Thực tiễn chỉ có giá trị trong phạm vi cá nhân."],1],["Ý nghĩa phương pháp luận rút ra từ vai trò của thực tiễn đối với nhận thức là gì?",["Phải quán triệt quan điểm thực tiễn trong nhận thức và hoạt động.","Nhận thức sự vật phải gắn với nhu cầu của thực tiễn.","Lấy thực tiễn làm tiêu chuẩn kiểm tra đúng – sai của kết quả nhận thức, thường xuyên tổng kết thực tiễn để bổ sung, hoàn thiện lý luận.","Bao gồm tất cả các ý trên."],3],["Lênin đã khái quát con đường biện chứng của quá trình nhận thức như thế nào?",["Từ tư duy trừu tượng đến trực quan sinh động rồi kết thúc.","Từ thực tiễn đến lý luận rồi dừng lại ở lý luận.","“Từ trực quan sinh động đến tư duy trừu tượng, và từ tư duy trừu tượng đến thực tiễn – đó là con đường biện chứng của sự nhận thức chân lý, của sự nhận thức thực tại khách quan”.","Từ kinh nghiệm cá nhân đến chân lý tuyệt đối, không cần thực tiễn."],2],["Nhận thức cảm tính là gì?",["Quá trình suy luận lôgic trừu tượng.","Giai đoạn đầu tiên của quá trình nhận thức, gắn với thực tiễn, phản ánh trực tiếp khách thể qua giác quan, biểu hiện dưới ba hình thức: cảm giác, tri giác, biểu tượng.","Nhận thức bằng linh cảm, trực giác thần bí.","Nhận thức dựa trên phán đoán và suy lý."],1],["Cảm giác là gì?",["Hình thức cao nhất của nhận thức lý tính.","Hình thức đầu tiên, giản đơn nhất của quá trình nhận thức, nảy sinh do sự tác động trực tiếp của khách thể lên giác quan, cung cấp thông tin đơn giản về một thuộc tính riêng lẻ của sự vật.","Hình thức nhận thức phản ánh toàn bộ sự vật.","Quá trình tư duy trừu tượng."],1],["Tri giác là gì?",["Chỉ là một cảm giác riêng lẻ.","Kết quả tác động trực tiếp của sự vật lên nhiều giác quan; là tổng hợp của nhiều cảm giác, cho ta hình ảnh tương đối trọn vẹn hơn về sự vật.","Hình thức nhận thức lý tính cơ bản.","Hình ảnh sự vật khi không còn tác động vào giác quan."],1],["Biểu tượng là gì?",["Hình ảnh tức thời của sự vật khi đang tác động vào giác quan.","Kết quả trực tiếp của một giác quan đơn lẻ.","Hình thức cao nhất, phức tạp nhất của nhận thức cảm tính; là hình ảnh sự vật được tái hiện trong óc khi sự vật không còn tác động trực tiếp vào giác quan.","Hình thức cơ bản của tư duy trừu tượng."],2],["Câu “Cha mẹ sinh con, trời sinh tính” thể hiện quan điểm của trường phái nào?",["Chủ nghĩa duy vật biện chứng.","Chủ nghĩa duy tâm chủ quan.","Chủ nghĩa duy tâm khách quan.","Chủ nghĩa kinh nghiệm."],2],["Câu “Sông có khúc, người có lúc” thể hiện quan niệm gì?",["Sự đứng im, bất biến của cuộc đời.","Mọi sự vật, đời người luôn biến đổi, thể hiện trạng thái vận động và thay đổi của sự vật, hiện tượng.","Mâu thuẫn là bất biến, không giải quyết được.","Con người không thể tác động vào hiện thực."],1],["Đặc điểm của nhận thức cảm tính là gì?",["Đã phản ánh sâu sắc bản chất và quy luật của sự vật.","Chưa đem lại hiểu biết sâu sắc, khái quát về sự vật; chưa phân biệt được rõ cái riêng – cái chung, bản chất – hiện tượng, nguyên nhân – kết quả…","Không có vai trò gì đối với nhận thức.","Không liên quan đến hoạt động thực tiễn."],1],["Nhận thức lý tính là gì?",["Hình thức nhận thức chỉ dựa vào cảm giác trực tiếp.","Giai đoạn nhận thức bắt nguồn từ trực quan sinh động, thông qua tư duy trừu tượng, con người phản ánh sự vật một cách gián tiếp, khái quát, đầy đủ hơn dưới các hình thức: khái niệm, phán đoán, suy lý.","Nhận thức dựa trên linh cảm và niềm tin.","Quá trình ghi nhớ máy móc các dữ kiện cảm tính."],1],["Nhận thức lý tính bao gồm các hình thức cơ bản nào?",["Cảm giác, tri giác, biểu tượng.","Khái niệm, phán đoán, suy lý.","Trực giác, linh cảm, niềm tin.","Kinh nghiệm, thói quen, truyền thống."],1],["Khái niệm là gì?",["Hình ảnh trực tiếp của sự vật do giác quan đem lại.","Hình thức cơ bản của tư duy trừu tượng, phản ánh khái quát, gián tiếp một hoặc một số thuộc tính chung, có tính bản chất của một nhóm sự vật, hiện tượng, thường được biểu thị bằng một từ hoặc cụm từ.","Một câu nói bất kỳ về sự vật.","Hình thức cao nhất của nhận thức cảm tính."],1],["Phán đoán là gì?",["Hình ảnh trực tiếp, cảm tính về sự vật.","Ý kiến chủ quan không dựa trên khái niệm.","Hình thức tư duy trừu tượng liên hệ các khái niệm, phản ánh mối liên hệ giữa các sự vật, hiện tượng bằng cách khẳng định hoặc phủ định một thuộc tính nào đó của sự vật, được biểu hiện dưới dạng mệnh đề gồm chủ từ, vị từ và hệ từ.","Hình thức tái hiện lại hình ảnh sự vật trong trí nhớ."],2],["Suy lý (suy luận) là gì?",["Quá trình tái hiện lại hình ảnh sự vật trong trí nhớ.","Hình thức phản ánh trực tiếp sự vật qua giác quan.","Hình thức tư duy trừu tượng, trong đó các phán đoán liên kết với nhau theo quy tắc để phán đoán cuối (kết luận) được suy ra từ những phán đoán đã biết làm tiền đề.","Hình thức biểu đạt cảm xúc chủ quan về sự vật."],2],["Nhận thức lý tính khác nhận thức cảm tính ở điểm cơ bản nào?",["Phản ánh trực tiếp, cụ thể sự vật qua giác quan.","Chỉ phản ánh từng thuộc tính riêng lẻ, rời rạc của sự vật.","Phản ánh sự vật, hiện tượng một cách khái quát, trừu tượng, gián tiếp trong tính tất yếu và tính chỉnh thể toàn diện.","Không có liên hệ gì với nhận thức cảm tính và thực tiễn."],2],["Theo triết học Mác – Lênin, chân lý là gì?",["Tri thức phù hợp với mong muốn chủ quan của con người.","Tri thức được nhiều người tin là đúng.","Tri thức tồn tại lâu đời trong lịch sử.","Tri thức phù hợp với hiện thực khách quan và được thực tiễn kiểm nghiệm."],3],["Câu “Tự lực cánh sinh” đồng nghĩa với quan điểm triết học nào dưới đây?",["Vận động của vật chất do lực lượng siêu nhiên quyết định.","Vận động của vật chất do ý thức con người sinh ra.","Vận động của vật chất là tự thân vận động.","Vận động của vật chất chỉ là ảo giác của cảm giác."],2],["“Trái đất quay xung quanh Mặt Trời” thuộc hình thức vận động nào?",["Vận động sinh học.","Vận động xã hội.","Vận động hóa học.","Vận động cơ học."],3],["Các tính chất cơ bản của chân lý bao gồm:",["Tính chủ quan; tính phổ biến; tính bất biến.","Tính tuyệt đối; tính ngẫu nhiên; tính trừu tượng.","Tính khách quan; tính tương đối và tính tuyệt đối; tính cụ thể.","Tính cảm tính; tính bẩm sinh; tính siêu hình."],2],["Tính khách quan của chân lý được hiểu là:",["Chân lý phụ thuộc hoàn toàn vào ý kiến đa số.","Chân lý do cảm giác chủ quan quyết định.","Nội dung chân lý phản ánh hiện thực khách quan, phù hợp với khách thể của nhận thức, không phụ thuộc ý muốn chủ quan.","Chân lý chỉ tồn tại trong ý thức con người."],2],["Tính tương đối của chân lý thể hiện ở chỗ nào?",["Chân lý luôn tuyệt đối đầy đủ trong mọi thời đại.","Chân lý chỉ đúng với một cá nhân nhất định.","Tri thức đúng nhưng chưa đầy đủ, mới phản ánh đúng một mặt, một bộ phận của hiện thực trong những điều kiện lịch sử – cụ thể, giới hạn nhất định.","Chân lý có thể hoàn toàn tùy tiện thay đổi theo ý muốn."],2],["Tính tuyệt đối của chân lý thể hiện ở chỗ nào?",["Chân lý không bao giờ thay đổi, bất chấp lịch sử.","Chân lý chỉ là niềm tin chủ quan tuyệt đối.","Tri thức phản ánh đầy đủ, toàn diện hiện thực khách quan trong một giai đoạn lịch sử cụ thể xác định.","Chân lý chỉ đúng trong suy nghĩ của một số cá nhân."],2],["Tính cụ thể của chân lý là gì?",["Chân lý luôn trừu tượng, tách khỏi hoàn cảnh.","Chân lý luôn phản ánh sự vật, hiện tượng trong những điều kiện, hoàn cảnh lịch sử – cụ thể nhất định về không gian và thời gian.","Chân lý đúng mọi lúc, mọi nơi, không phụ thuộc điều kiện.","Chân lý chỉ gắn với những trường hợp cá biệt, ngẫu nhiên."],1],["Sản xuất là gì?",["Là hoạt động nghỉ ngơi, tái tạo sức lao động của con người.","Là hoạt động trao đổi hàng hóa trên thị trường.","Là hoạt động tinh thần thuần túy của con người.","Là hoạt động không ngừng sáng tạo ra các giá trị vật chất và tinh thần nhằm thỏa mãn nhu cầu tồn tại và phát triển của con người."],3],["Sản xuất xã hội bao gồm những loại hình sản xuất nào?",["Sản xuất vật chất và sản xuất hàng hóa.","Sản xuất tinh thần và sản xuất dịch vụ.","Sản xuất vật chất, sản xuất tinh thần và sản xuất ra bản thân con người.","Sản xuất công nghiệp, nông nghiệp và dịch vụ."],2],["Theo triết học Mác - Lênin, sự sản xuất xã hội bao gồm những phương diện nào?",["Chỉ sản xuất vật chất.","Sản xuất tinh thần và sản xuất dịch vụ.","Sản xuất ra bản thân con người và sản xuất dịch vụ.","Sản xuất vật chất, sản xuất tinh thần và sản xuất ra bản thân con người."],3],["Một trong những ý nghĩa phương pháp luận được rút ra từ việc nghiên cứu cặp phạm trù bản chất và hiện tượng là gì?",["Chỉ cần nắm bắt hiện tượng là đủ, không cần quan tâm bản chất.","Chỉ cần nghiên cứu bản chất, không cần chú ý đến hiện tượng.","Trong mọi hoạt động không chỉ nhận biết cái bề ngoài (hiện tượng), mà cần đi sâu vào bên trong để tìm hiểu và làm sáng tỏ bản chất thường ẩn giấu mình sau hiện tượng.","Chỉ cần dựa vào cảm tính chủ quan để nhận thức sự vật, hiện tượng."],2],["Điền vào chỗ trống để hoàn thiện nhận định sau của Ph. Ăngghen: “Sự phát triển của chính trị, pháp luật, triết học, tôn giáo, văn học, nghệ thuật, v.v.. đều dựa trên cơ sở sự phát triển kinh tế. Nhưng tất cả chúng cũng có ảnh hưởng lẫn nhau và ảnh hưởng đến ……”",["Lực lượng sản xuất.","Quan hệ sản xuất.","Cơ sở kinh tế.","Kiến trúc thượng tầng."],2],["Theo V.I. Lênin, con đường biện chứng của quá trình nhận thức chân lý là:",["Từ tư duy trừu tượng đến trực quan sinh động rồi dừng lại.","Từ thực tiễn đến cảm giác và dừng ở cảm giác.","Từ tư duy trừu tượng đến thực tiễn, không cần trực quan sinh động.","Từ trực quan sinh động đến tư duy trừu tượng, và từ tư duy trừu tượng đến thực tiễn."],3],["Điền vào chỗ trống: “…… là quá trình mà trong đó con người sử dụng công cụ lao động tác động trực tiếp hoặc gián tiếp vào tự nhiên, cải biến các dạng vật chất của giới tự nhiên để tạo ra của cải xã hội nhằm thỏa mãn nhu cầu tồn tại và phát triển của con người”.",["Sản xuất tinh thần.","Trao đổi hàng hóa.","Phân phối của cải.","Sản xuất vật chất."],3],["Phê phán quan niệm sai lầm của triết học duy tâm về tính chất của mối liên hệ nhân quả, Ph. Ăngghen nhấn mạnh: “hoạt động của con người là hòn đá thử vàng của …”.",["Chân lý.","Khả năng.","Tính nhân quả.","Hiện thực khách quan."],2],["Chọn đáp án đúng theo nguyên lý về sự phát triển của triết học Mác - Lênin:",["Phát triển chỉ là sự lặp lại đơn thuần của trạng thái cũ.","Phát triển là quá trình tăng lên về lượng, không làm thay đổi về chất.","Phát triển chỉ là một trường hợp đặc biệt của vận động, chỉ khái quát xu hướng chung của vận động là vận động đi lên của sự vật, hiện tượng mới trong quá trình thay thế sự vật, hiện tượng cũ.","Phát triển là sự biến mất hoàn toàn cái cũ, không có sự kế thừa."],2],["Một trong những nguyên tắc xây dựng lý luận nhận thức của chủ nghĩa duy vật biện chứng là:",["Cảm giác là tiêu chuẩn duy nhất để kiểm nghiệm tri thức.","Lý luận thuần túy là tiêu chuẩn quyết định tính đúng sai của tri thức.","Thực tiễn là tiêu chuẩn để kiểm tra hình ảnh đúng, hình ảnh sai của cảm giác, ý thức nói chung.","Kinh nghiệm cá nhân là tiêu chuẩn duy nhất của chân lý."],2],["Theo triết học Mác - Lênin, muốn nhận thức và cải tạo xã hội cũ, xây dựng xã hội mới phải nhận thức và tác động vào ba yếu tố cơ bản nào?",["Lực lượng sản xuất, quan hệ giai cấp và ý thức xã hội.","Lực lượng sản xuất, quan hệ giai cấp và nhà nước.","Lực lượng sản xuất, quan hệ sản xuất và kiến trúc thượng tầng.","Quan hệ sản xuất, giai cấp cầm quyền và tôn giáo."],2],["Căn cứ để chỉ ra mâu thuẫn chủ yếu và mâu thuẫn thứ yếu trong sự tồn tại và phát triển của sự vật, hiện tượng là:",["Căn cứ vào mức độ gay gắt về mặt cảm tính của mâu thuẫn.","Căn cứ vào số lượng mâu thuẫn xuất hiện trong sự vật, hiện tượng.","Căn cứ vào hình thức biểu hiện bên ngoài của mâu thuẫn.","Căn cứ vào vai trò của mâu thuẫn đối với sự tồn tại và phát triển của sự vật, hiện tượng trong mỗi giai đoạn nhất định."],3],["Sản xuất vật chất là gì?",["Hoạt động trao đổi hàng hóa trên thị trường thế giới.","Hoạt động tinh thần nhằm sáng tạo ra các giá trị văn hóa.","Quá trình con người dùng công cụ lao động tác động trực tiếp hoặc gián tiếp vào tự nhiên, cải biến các dạng vật chất của tự nhiên để tạo ra của cải xã hội đáp ứng nhu cầu tồn tại và phát triển.","Hoạt động phân phối của cải trong xã hội."],2],["Vai trò cơ bản của sản xuất vật chất đối với xã hội loài người là gì?",["Chỉ tạo ra của cải dư thừa để trao đổi.","Chỉ tạo ra điều kiện phát triển tinh thần.","Là cơ sở của sự tồn tại và phát triển của xã hội loài người.","Chỉ có ý nghĩa trong các xã hội tiền tư bản."],2],["Vai trò của sản xuất vật chất được thể hiện như thế nào?",["Chỉ là tiền đề để phát triển khoa học – kỹ thuật.","Chỉ là điều kiện để phát triển giáo dục – đào tạo.","Chỉ là hoạt động tiêu dùng của cải vật chất.","Là tiền đề trực tiếp tạo ra tư liệu sinh hoạt; là tiền đề của mọi hoạt động lịch sử; là điều kiện chủ yếu sáng tạo ra bản thân con người."],3],["Điền vào chỗ trống: Ph. Ăngghen khẳng định, trên một ý nghĩa cao nhất, “lao động đã sáng tạo ra …”",["“của cải vật chất cho xã hội”.","“những giá trị tinh thần cao quý”.","“bản thân con người”.","“những điều kiện tự nhiên mới”."],2],["Phương thức sản xuất là gì?",["Cách thức con người tiêu dùng sản phẩm trong xã hội.","Cách thức tổ chức bộ máy nhà nước.","Cách thức con người tiến hành quá trình sản xuất vật chất trong những giai đoạn lịch sử nhất định của xã hội loài người.","Cách thức phân phối sản phẩm trong xã hội."],2],["Phương thức sản xuất là sự thống nhất giữa những yếu tố nào?",["Lực lượng sản xuất với kiến trúc thượng tầng.","Quan hệ sản xuất với hình thái ý thức xã hội.","Lực lượng sản xuất ở một trình độ nhất định với quan hệ sản xuất tương ứng.","Cơ sở hạ tầng với kiến trúc thượng tầng."],2],["Lực lượng sản xuất là gì?",["Chỉ là hệ thống máy móc, công nghệ của xã hội.","Chỉ là người lao động với kỹ năng, trình độ nhất định.","Toàn bộ các quan hệ sở hữu về tư liệu sản xuất.","Sự kết hợp giữa người lao động với tư liệu sản xuất, tạo ra sức sản xuất và năng lực thực tiễn làm biến đổi các đối tượng vật chất của tự nhiên theo nhu cầu của con người và xã hội."],3],["Về cấu trúc, lực lượng sản xuất được xem xét trên những mặt nào?",["Mặt chính trị – xã hội và mặt pháp lý – xã hội.","Mặt kinh tế – chính trị và mặt văn hóa – xã hội.","Mặt kinh tế – kỹ thuật (tư liệu sản xuất) và mặt kinh tế – xã hội (người lao động).","Mặt tự nhiên – kỹ thuật và mặt tinh thần – văn hóa."],2],["Người lao động trong lực lượng sản xuất được hiểu là:",["Bất kỳ ai tham gia vào quá trình sản xuất.","Người sở hữu tư liệu sản xuất trong xã hội.","Con người có tri thức, kinh nghiệm, kỹ năng lao động và năng lực sáng tạo nhất định trong quá trình sản xuất xã hội.","Chỉ những người lao động chân tay trong sản xuất."],2],["Sự biến đổi của các hình thái kinh tế – xã hội: Cộng sản nguyên thủy → Chiếm hữu nô lệ → Phong kiến → Tư bản chủ nghĩa → Xã hội chủ nghĩa thể hiện hình thức vận động nào?",["Vận động cơ học.","Vận động sinh học.","Vận động tư duy.","Vận động xã hội."],3],["Thành tựu Cách mạng Tháng Tám 1945, lập nên nước Việt Nam Dân chủ Cộng hòa, là kết quả của đường lối đúng đắn của Đảng. Điều này thể hiện phương diện nào trong mối quan hệ giữa vật chất và ý thức theo chủ nghĩa duy vật biện chứng?",["Vật chất hoàn toàn phụ thuộc vào ý thức.","Ý thức quyết định tuyệt đối vật chất.","Ý thức chỉ là sự phản ánh thụ động của vật chất.","Ý thức có tính độc lập tương đối và có thể tác động trở lại vật chất thông qua hoạt động thực tiễn."],3],["Tư liệu sản xuất là gì?",["Chỉ là đối tượng lao động trong sản xuất.","Chỉ là công cụ lao động trong sản xuất.","Chỉ là máy móc và nhà xưởng trong sản xuất.","Những điều kiện vật chất cần thiết để tiến hành sản xuất, bao gồm tư liệu lao động và đối tượng lao động."],3],["Đối tượng lao động là gì?",["Người lao động trực tiếp trong quá trình sản xuất.","Công cụ lao động mà con người sử dụng.","Những yếu tố vật chất mà con người dùng tư liệu lao động tác động lên, nhằm biến đổi chúng cho phù hợp với mục đích sử dụng.","Hình thức phân phối sản phẩm sau sản xuất."],2],["Tư liệu lao động là gì?",["Những sản phẩm đã hoàn thành của quá trình sản xuất.","Những nhu cầu vật chất của người lao động.","Những yếu tố vật chất mà con người dựa vào đó để tác động lên đối tượng lao động, biến đối tượng lao động thành sản phẩm đáp ứng yêu cầu sản xuất.","Những yếu tố tinh thần định hướng quá trình sản xuất."],2],["Phương tiện lao động là gì?",["Chỉ bao gồm sức lao động của con người.","Những yếu tố vật chất của sản xuất, cùng với công cụ lao động, được con người sử dụng để tác động lên đối tượng lao động trong quá trình sản xuất vật chất.","Chỉ là hệ thống nhà xưởng, kho tàng, bến bãi.","Chỉ là các phương tiện vận tải dùng để lưu thông hàng hóa."],1],["Công cụ lao động là gì?",["Những phương tiện dùng để vận chuyển sản phẩm sau sản xuất.","Những phương tiện dùng để phân phối sản phẩm trong xã hội.","Những điều kiện tự nhiên tác động vào con người.","Những phương tiện vật chất mà con người trực tiếp sử dụng để tác động vào đối tượng lao động, biến đổi chúng, tạo ra của cải vật chất."],3],["Yếu tố động nhất, cách mạng nhất trong lực lượng sản xuất, là nguyên nhân sâu xa của mọi biến đổi kinh tế – xã hội trong lịch sử là:",["Người lao động.","Tư liệu sản xuất.","Đối tượng lao động.","Công cụ lao động."],3],["Tính chất của lực lượng sản xuất nói lên điều gì?",["Trình độ học vấn của người lao động.","Hình thức sở hữu về tư liệu sản xuất.","Trình độ cơ giới hóa, tự động hóa.","Tính chất cá nhân hay tính chất xã hội hóa trong việc sử dụng tư liệu sản xuất."],3],["Quan hệ sản xuất là gì?",["Tổng hợp các quan hệ chính trị trong xã hội.","Tổng hợp các quan hệ kinh tế – vật chất giữa người với người trong quá trình sản xuất vật chất.","Tổng hợp các quan hệ pháp luật giữa người với người.","Tổng hợp các quan hệ đạo đức giữa người với người."],1],["Quan hệ sản xuất bao gồm những quan hệ cơ bản nào?",["Quan hệ chính trị, quan hệ pháp luật, quan hệ đạo đức.","Quan hệ dân tộc, quan hệ giai cấp, quan hệ tôn giáo.","Quan hệ sở hữu về tư liệu sản xuất; quan hệ trong tổ chức, quản lý sản xuất; quan hệ phân phối sản phẩm lao động.","Quan hệ thị trường, quan hệ cạnh tranh, quan hệ tiêu dùng."],2],["Trong các yếu tố của quan hệ sản xuất, yếu tố nào giữ vai trò quyết định đối với các quan hệ còn lại?",["Quan hệ phân phối sản phẩm lao động.","Quan hệ trong tổ chức, quản lý sản xuất.","Quan hệ trao đổi hàng hóa – tiền tệ.","Quan hệ sở hữu về tư liệu sản xuất."],3],["Quy luật cơ bản nhất chi phối sự vận động và phát triển của xã hội là:",["Quy luật phủ định của phủ định.","Quy luật cạnh tranh tự do.","Quy luật mâu thuẫn giai cấp.","Quy luật quan hệ sản xuất phải phù hợp với trình độ phát triển của lực lượng sản xuất."],3],["Trong phương thức sản xuất, mối quan hệ biện chứng giữa lực lượng sản xuất và quan hệ sản xuất được hiểu như thế nào?",["Quan hệ sản xuất quyết định tuyệt đối lực lượng sản xuất.","Hai mặt hoàn toàn độc lập, không tác động lẫn nhau.","Lực lượng sản xuất chỉ phụ thuộc ý chí giai cấp cầm quyền.","Lực lượng sản xuất quyết định quan hệ sản xuất, còn quan hệ sản xuất tác động trở lại lực lượng sản xuất."],3],["Cơ sở khách quan quy định sự vận động, phát triển không ngừng của lực lượng sản xuất là:",["Do vai trò của thị trường và cạnh tranh.","Do tác động thuần túy của tự nhiên.","Do sự phát triển của kiến trúc thượng tầng.","Do biện chứng giữa sản xuất và nhu cầu; do tính cách mạng của công cụ lao động; do vai trò sáng tạo của người lao động và tính kế thừa khách quan trong phát triển lực lượng sản xuất."],3],["Sự phù hợp của quan hệ sản xuất với trình độ phát triển của lực lượng sản xuất là:",["Đòi hỏi chủ quan của giai cấp thống trị.","Ngẫu nhiên lịch sử, có cũng được, không có cũng được.","Kết quả của may mắn trong quản lý kinh tế.","Đòi hỏi khách quan của nền sản xuất xã hội."],3],["Sự tác động của quan hệ sản xuất đối với lực lượng sản xuất diễn ra theo mấy chiều hướng?",["Chỉ theo một chiều hướng kìm hãm phát triển.","Chỉ theo một chiều hướng thúc đẩy phát triển.","Không có tác động đáng kể nào.","Theo hai chiều hướng: khi phù hợp thì thúc đẩy, khi không phù hợp thì kìm hãm, thậm chí phá hoại lực lượng sản xuất."],3],["Quy luật quan hệ sản xuất phù hợp với trình độ phát triển của lực lượng sản xuất là:",["Quy luật riêng của xã hội tư bản chủ nghĩa.","Quy luật riêng của xã hội xã hội chủ nghĩa.","Quy luật chỉ tác động trong thời kỳ quá độ.","Quy luật phổ biến tác động trong toàn bộ tiến trình lịch sử nhân loại."],3],["Sự tác động biện chứng giữa lực lượng sản xuất và quan hệ sản xuất làm cho lịch sử xã hội loài người trở thành:",["Lịch sử tuần hoàn không thay đổi.","Lịch sử do ý thức cá nhân chi phối.","Lịch sử kế tiếp nhau của các phương thức sản xuất khác nhau.","Lịch sử thay đổi hoàn toàn ngẫu nhiên."],2],["Hùng sống cùng bạn phòng là con nhà khá giả nhưng vẫn chi tiêu tiết kiệm, phù hợp hoàn cảnh gia đình mình. Về phương pháp luận, Hùng đã vận dụng:",["Nguyên tắc phát triển.","Nguyên tắc toàn diện.","Nguyên tắc lịch sử – cụ thể.","Nguyên tắc tôn trọng tính khách quan (xuất phát từ điều kiện khách quan của bản thân)."],3],["Đại hội XII nêu: “Nâng cao năng lực hoạch định đường lối, chính sách phù hợp với quy luật khách quan và đặc điểm của Việt Nam…”. Quan điểm này thể hiện sự vận dụng nguyên tắc nào?",["Chỉ dựa vào ý chí chủ quan.","Tuyệt đối hóa kinh nghiệm nước ngoài.","Nguyên tắc tôn trọng tính khách quan, gắn với điều kiện lịch sử – cụ thể của Việt Nam.","Nguyên tắc phủ định sạch trơn quá khứ."],2],["Sự phù hợp giữa quan hệ sản xuất với trình độ phát triển của lực lượng sản xuất trong thời kỳ quá độ lên CNXH ở Việt Nam đòi hỏi:",["Duy trì lâu dài chế độ tư hữu tư bản chủ nghĩa.","Xóa bỏ mọi hình thức sở hữu khác ngoài tư hữu.","Chỉ thừa nhận sở hữu tập thể nhỏ lẻ.","Tất yếu phải thiết lập và củng cố chế độ công hữu về những tư liệu sản xuất chủ yếu."],3],["Theo triết học Mác – Lênin, trong thực tiễn muốn phát triển kinh tế phải bắt đầu từ đâu?",["Từ mở rộng thị trường tiêu dùng.","Từ tăng cường tuyên truyền, giáo dục.","Từ đổi mới toàn bộ kiến trúc thượng tầng.","Từ phát triển lực lượng sản xuất, trước hết là lực lượng lao động và công cụ lao động."],3],["Nền kinh tế thị trường định hướng xã hội chủ nghĩa ở Việt Nam là mô hình vận dụng quy luật nào?",["Quy luật cung – cầu thuần túy của thị trường tự do.","Quy luật cạnh tranh tư bản chủ nghĩa.","Quy luật giá trị trong kinh tế tư bản.","Quy luật quan hệ sản xuất phải phù hợp với trình độ phát triển của lực lượng sản xuất trong điều kiện Việt Nam hiện nay."],3],["Theo triết học Mác – Lênin, “cơ sở hạ tầng” là gì?",["Toàn bộ hệ thống chính trị của xã hội.","Toàn bộ các quan điểm tư tưởng của xã hội.","Toàn bộ những quan hệ sản xuất của một xã hội trong sự vận động hiện thực của chúng, hợp thành cơ cấu kinh tế của xã hội đó.","Toàn bộ di sản văn hóa vật chất của xã hội."],2],["Cấu trúc của cơ sở hạ tầng trong một xã hội bao gồm:",["Cơ sở hạ tầng cũ và cơ sở hạ tầng mới.","Cơ sở hạ tầng kinh tế và cơ sở hạ tầng chính trị.","Quan hệ sản xuất thống trị, quan hệ sản xuất tàn dư và quan hệ sản xuất mầm mống.","Cơ sở hạ tầng nông thôn và cơ sở hạ tầng đô thị."],2],["Kiến trúc thượng tầng là gì?",["Chỉ là bộ máy nhà nước và pháp luật.","Chỉ là hệ thống các công trình xây dựng vật chất.","Toàn bộ những quan điểm, tư tưởng xã hội và các thiết chế xã hội tương ứng, cùng các quan hệ nội tại của chúng được hình thành trên một cơ sở hạ tầng nhất định.","Hệ thống các quan hệ sản xuất trong xã hội."],2],["Cấu trúc của kiến trúc thượng tầng bao gồm những gì?",["Chỉ có nhà nước và pháp luật.","Chỉ có tôn giáo, đạo đức và nghệ thuật.","Chỉ có triết học và khoa học.","Toàn bộ những quan điểm tư tưởng (chính trị, pháp quyền, đạo đức, tôn giáo, nghệ thuật, triết học…) và các thiết chế tương ứng như nhà nước, đảng phái, giáo hội, đoàn thể…"],3],["Bộ phận có quyền lực mạnh nhất trong kiến trúc thượng tầng của xã hội có đối kháng giai cấp là:",["Gia đình.","Trường học.","Tôn giáo.","Nhà nước – công cụ quyền lực chính trị đặc biệt của giai cấp thống trị."],3],["Theo triết học Mác – Lênin, trong mối quan hệ giữa cơ sở hạ tầng và kiến trúc thượng tầng, cái nào giữ vai trò quyết định?",["Kiến trúc thượng tầng quyết định cơ sở hạ tầng.","Nhà nước quyết định toàn bộ cơ sở hạ tầng.","Ý thức xã hội quyết định quan hệ sản xuất.","Cơ sở hạ tầng (quan hệ sản xuất) quyết định kiến trúc thượng tầng."],3],["Vai trò quyết định của cơ sở hạ tầng đối với kiến trúc thượng tầng thể hiện trước hết ở chỗ:",["Chỉ quy định hình thức nhà nước.","Chỉ quy định một phần đời sống tinh thần.","Quyết định nguồn gốc, cơ cấu, tính chất và sự vận động, phát triển của kiến trúc thượng tầng; những biến đổi căn bản của cơ sở hạ tầng sớm hay muộn cũng dẫn đến những biến đổi căn bản trong kiến trúc thượng tầng.","Không liên quan đến sự biến đổi của kiến trúc thượng tầng."],2],["Sau giờ học trên lớp, Nga chủ động tự nghiên cứu, mở rộng kiến thức qua tài liệu. Về phương pháp luận, Nga đã vận dụng:",["Nguyên tắc toàn diện.","Nguyên tắc lịch sử – cụ thể.","Nguyên tắc khách quan.","Nguyên tắc phát huy tính năng động chủ quan."],3],["Thành ngữ “Rút dây động rừng” thể hiện điều gì về sự tồn tại của sự vật, hiện tượng?",["Sự vật tồn tại biệt lập, tách rời.","Sự vật tồn tại bất biến, cô lập.","Sự vật chỉ phụ thuộc ý thức con người.","Sự vật, hiện tượng tồn tại trong mối liên hệ, tác động qua lại lẫn nhau."],3],["Theo triết học Mác – Lênin, vai trò của kiến trúc thượng tầng phản ánh:",["Vai trò thụ động, phụ thuộc hoàn toàn cơ sở hạ tầng.","Vai trò phủ định sạch trơn cơ sở hạ tầng.","Vai trò trung tính, không ảnh hưởng kinh tế.","Vai trò tích cực, tự giác của ý thức, tư tưởng trong việc tác động trở lại cơ sở hạ tầng."],3],["Điền vào chỗ trống: Ph. Ăngghen khẳng định: “………………, đến lượt mình, nó tác động trở lại đến cơ sở hạ tầng kinh tế và có thể biến đổi cơ sở hạ tầng ấy trong những giới hạn nhất định.”",["Cơ sở vật chất","Quan hệ sản xuất","Nhà nước","Quan điểm tư tưởng"],2],["Thực chất vai trò của kiến trúc thượng tầng trong xã hội có giai cấp là:",["Chỉ phản ánh trung tính lợi ích mọi giai cấp.","Đảm bảo quyền lợi cho mọi tầng lớp như nhau.","Bảo vệ lợi ích của giai cấp bị trị.","Bảo vệ, duy trì, củng cố lợi ích kinh tế của giai cấp thống trị."],3],["Trong các xã hội có giai cấp, kiến trúc thượng tầng còn đảm bảo sự thống trị về:",["Văn hóa và nghệ thuật của mọi giai cấp.","Đạo đức và tôn giáo của giai cấp bị trị.","Khoa học và kỹ thuật của từng cá nhân.","Chính trị và tư tưởng của giai cấp giữ địa vị thống trị về kinh tế."],3],["Tác động của kiến trúc thượng tầng đối với cơ sở hạ tầng diễn ra theo mấy chiều hướng cơ bản?",["Chỉ thúc đẩy sự phát triển cơ sở hạ tầng.","Chỉ kìm hãm sự phát triển cơ sở hạ tầng.","Không có tác động đáng kể.","Hai chiều hướng: nếu phù hợp với xu thế phát triển của cơ sở hạ tầng thì thúc đẩy, nếu ngược lại thì kìm hãm, thậm chí cản trở sự phát triển kinh tế."],3],["Trong các bộ phận của kiến trúc thượng tầng, bộ phận nào có vai trò quan trọng nhất?",["Tôn giáo.","Đạo đức.","Nghệ thuật.","Kiến trúc thượng tầng chính trị, trong đó nhà nước có vai trò tác động to lớn đối với cơ sở hạ tầng."],3],["Sự vận động của quy luật giữa cơ sở hạ tầng và kiến trúc thượng tầng dưới chủ nghĩa xã hội có đặc điểm gì?",["Hoàn toàn giống như trong các xã hội cũ.","Hoàn toàn tự phát, không cần định hướng.","Không còn quan hệ giữa cơ sở hạ tầng và kiến trúc thượng tầng.","Có những đặc điểm riêng: cơ sở hạ tầng và kiến trúc thượng tầng xã hội chủ nghĩa không hình thành tự phát trong lòng xã hội cũ, mà do đấu tranh cách mạng và xây dựng có ý thức."],3],["Đặc trưng cơ bản của kiến trúc thượng tầng xã hội chủ nghĩa là:",["Sự đối kháng gay gắt về chính trị và tư tưởng.","Sự đa nguyên chính trị đối lập nhau về mục tiêu.","Sự thống trị tuyệt đối của một nhóm tài phiệt.","Sự nhất trí về chính trị và tinh thần trong toàn xã hội trên nền tảng lợi ích cơ bản thống nhất."],3],["Tính ưu việt của kiến trúc thượng tầng xã hội chủ nghĩa được biểu hiện trước hết ở hệ tư tưởng của giai cấp nào?",["Giai cấp nông dân, là lực lượng sản xuất chủ yếu.","Giai cấp tư sản dân tộc, là lực lượng kinh tế năng động.","Giai cấp công nhân, với hệ tư tưởng tiến bộ và cách mạng nhất trong lịch sử.","Tầng lớp trí thức, với tri thức khoa học – kỹ thuật hiện đại."],2],["Quy luật về mối quan hệ biện chứng giữa cơ sở hạ tầng và kiến trúc thượng tầng là cơ sở khoa học để nhận thức đúng đắn vấn đề nào sau đây?",["Mối quan hệ giữa đạo đức và pháp luật.","Mối quan hệ giữa khoa học và tôn giáo.","Mối quan hệ giữa kinh tế và chính trị.","Mối quan hệ giữa nghệ thuật và triết học."],2],["Điền vào chỗ trống: “Trong nhận thức và thực tiễn, nếu tách rời hoặc tuyệt đối hóa một yếu tố nào giữa kinh tế và chính trị đều là …”",["Tất yếu.","Đúng đắn.","Khoa học.","Sai lầm."],3],["Thành ngữ “Một con ngựa đau, cả tàu bỏ cỏ” thể hiện điều gì?",["Sự tồn tại cô lập của từng cá nhân.","Sự vận động hoàn toàn ngẫu nhiên của sự vật.","Sự phụ thuộc tuyệt đối vào ý thức cá nhân.","Các sự vật, hiện tượng và con người tồn tại trong mối liên hệ qua lại với nhau."],3],["Điền vào chỗ trống: Phương pháp siêu hình “… chỉ nhìn thấy những sự vật riêng biệt mà không nhìn thấy mối liên hệ giữa chúng, chỉ thấy sự tồn tại mà không thấy sự phát sinh và tiêu vong, chỉ thấy trạng thái tĩnh mà quên vận động của sự vật, …”",["Chỉ thấy rừng mà không thấy cây.","Chỉ thấy hiện tượng mà không thấy bản chất.","Chỉ thấy cái chung mà bỏ qua cái riêng.","Chỉ nhìn thấy cây mà không thấy rừng."],3],["Hình thái kinh tế – xã hội là gì?",["Một kiểu nhà nước cụ thể trong lịch sử.","Một giai đoạn phát triển của khoa học – kỹ thuật.","Phạm trù chỉ xã hội ở một nấc thang lịch sử nhất định, với một kiểu quan hệ sản xuất đặc trưng, phù hợp với một trình độ lực lượng sản xuất và một kiến trúc thượng tầng tương ứng.","Một hình thức ý thức xã hội trong mỗi thời kỳ lịch sử."],2],["Theo học thuyết hình thái kinh tế – xã hội, kết cấu xã hội trong mỗi giai đoạn lịch sử bao gồm ba yếu tố cơ bản nào?",["Tự nhiên, xã hội, tư duy.","Lực lượng sản xuất, nhà nước, ý thức xã hội.","Lực lượng sản xuất; quan hệ sản xuất (cơ sở hạ tầng); kiến trúc thượng tầng.","Cơ sở vật chất, con người, văn hóa."],2],["Nền tảng vật chất của xã hội, tiêu chuẩn khách quan để phân biệt các thời đại kinh tế khác nhau, xét đến cùng quyết định sự vận động và phát triển của hình thái kinh tế – xã hội là:",["Kiến trúc thượng tầng.","Hình thức sở hữu về đất đai.","Lực lượng sản xuất.","Hệ thống giá trị tinh thần."],2],["Lực lượng sản xuất giữ vai trò gì trong lịch sử phát triển xã hội?",["Chỉ là yếu tố kỹ thuật thuần túy.","Chỉ là số lượng công nhân trong xã hội.","Là nền tảng vật chất của xã hội, tiêu chuẩn khách quan để phân biệt các thời đại kinh tế khác nhau, xét đến cùng quyết định sự vận động và phát triển của hình thái kinh tế – xã hội.","Chỉ là hệ thống máy móc, công nghệ hiện đại."],2],["Quan hệ khách quan, cơ bản, chi phối và quyết định mọi quan hệ xã hội khác, đồng thời là tiêu chuẩn quan trọng nhất để phân biệt bản chất các chế độ xã hội được gọi là:",["Quan hệ dân tộc.","Quan hệ gia đình.","Quan hệ sản xuất.","Quan hệ tôn giáo."],2],["Sự thể hiện các mối quan hệ giữa người với người trong lĩnh vực tinh thần, tiêu biểu cho bộ mặt tinh thần của đời sống xã hội được gọi là:",["Cơ sở hạ tầng.","Lực lượng sản xuất.","Kiến trúc thượng tầng.","Phương thức sản xuất."],2],["Lịch sử xã hội loài người là tiến trình nối tiếp nhau từ thấp đến cao của các hình thái kinh tế – xã hội nào sau đây?",["Cộng sản nguyên thủy – phong kiến – tư bản – chiếm hữu nô lệ – xã hội chủ nghĩa.","Chiếm hữu nô lệ – cộng sản nguyên thủy – tư bản – phong kiến – xã hội chủ nghĩa.","Cộng sản nguyên thủy – chiếm hữu nô lệ – phong kiến – tư bản chủ nghĩa – xã hội chủ nghĩa.","Cộng sản nguyên thủy – tư bản chủ nghĩa – phong kiến – xã hội chủ nghĩa – chiếm hữu nô lệ."],2],["Điền vào chỗ trống: “Tiến trình lịch sử xã hội loài người là kết quả của sự thống nhất giữa …”",["Thực tiễn và lý luận.","Lôgích và lịch sử.","Cơ sở hạ tầng và kiến trúc thượng tầng.","Kinh tế và chính trị."],1],["Sự thống nhất giữa lôgích và lịch sử trong tiến trình phát triển lịch sử – tự nhiên của xã hội loài người bao hàm điều gì?",["Chỉ có sự phát triển tuần tự qua mọi hình thái kinh tế – xã hội.","Chỉ có sự “nhảy vọt”, bỏ qua tất cả các hình thái kinh tế – xã hội.","Vừa có sự phát triển tuần tự đối với lịch sử toàn thế giới, vừa có khả năng “bỏ qua” một hay vài hình thái kinh tế – xã hội ở một số quốc gia, dân tộc cụ thể.","Lịch sử phát triển hoàn toàn ngẫu nhiên, không có quy luật."],2],["Câu “Tre già măng mọc” thể hiện quan điểm nào về sự phát triển?",["Quan điểm siêu hình, phủ nhận sự kế thừa.","Quan điểm duy tâm, coi mọi cái do ý niệm quyết định.","Quan điểm bảo thủ, phủ nhận cái mới.","Quan điểm biện chứng, nhấn mạnh tính kế thừa và phát triển liên tục."],3],["Lý luận nào được xem là “kim chỉ nam”, là nền tảng lý luận cho việc đề ra đường lối, chính sách về con người ở Việt Nam hiện nay?",["Chủ nghĩa tự do cá nhân cực đoan.","Học thuyết nhân văn phương Tây hiện đại.","Tư tưởng Hồ Chí Minh về con người.","Học thuyết Khổng – Mạnh về con người."],2],["Muốn nhận thức và cải tạo xã hội cũ, xây dựng xã hội mới, theo chủ nghĩa Mác – Lênin phải tác động đồng thời vào những yếu tố cơ bản nào?",["Con người, văn hóa, môi trường.","Nhà nước, pháp luật, đạo đức.","Lực lượng sản xuất, quan hệ sản xuất (cơ sở hạ tầng) và kiến trúc thượng tầng.","Kinh tế, khoa học, giáo dục."],2],["Học thuyết hình thái kinh tế – xã hội là cơ sở khoa học để xác định con đường phát triển của Việt Nam là:",["Xây dựng chủ nghĩa tư bản hiện đại rồi mới lên chủ nghĩa xã hội.","Quay lại mô hình phong kiến tập quyền.","Quá độ lên chủ nghĩa xã hội, bỏ qua chế độ tư bản chủ nghĩa.","Phát triển một mô hình phi xã hội chủ nghĩa, phi tư bản chủ nghĩa."],2],["Một trong những đức tính của con người Việt Nam đáp ứng yêu cầu phát triển đất nước hiện nay là:",["Coi trọng chủ nghĩa cá nhân, đặt lợi ích riêng lên trên hết.","Sống khép kín, tách rời cộng đồng.","Có ý thức tập thể, đoàn kết, phấn đấu vì lợi ích chung.","Chỉ quan tâm đến lợi ích vật chất trước mắt."],2],["Một trong những đức tính của con người Việt Nam đáp ứng yêu cầu phát triển đất nước hiện nay là:",["Bằng lòng với tri thức hiện có, ngại đổi mới.","Chỉ chú trọng sức khỏe, không cần tri thức.","Thường xuyên học tập, nâng cao hiểu biết, trình độ chuyên môn, trình độ thẩm mỹ và thể lực.","Chỉ cần có kinh nghiệm thực tế, không cần học tập lý luận."],2],["Câu “Trăng quầng thì hạn, trăng tán thì mưa” là biểu hiện của loại ý thức nào?",["Ý thức khoa học.","Ý thức chính trị.","Ý thức pháp quyền.","Ý thức xã hội thông thường."],3],["Học thuyết hình thái kinh tế - xã hội là cơ sở khoa học cho việc xác định con đường phát triển nào của Việt Nam?",["Quá độ lên chủ nghĩa tư bản, sau đó mới lên chủ nghĩa xã hội.","Xây dựng nền kinh tế thị trường tự do tư bản chủ nghĩa.","Quá độ lên chủ nghĩa xã hội, bỏ qua chế độ tư bản chủ nghĩa.","Giữ nguyên xã hội phong kiến, chỉ cải cách một phần kinh tế."],2],["Luận điểm “đừng thấy đỏ tưởng là chín”, “xanh vỏ đỏ lòng” nói về:",["Nguyên nhân và kết quả.","Khả năng và hiện thực.","Nội dung và hình thức.","Bản chất và hiện tượng."],3],["Quy luật quan hệ sản xuất phù hợp với trình độ phát triển của lực lượng sản xuất là cơ sở khoa học để anh (chị) nhận thức điều gì?",["Nhận thức sâu sắc vai trò tuyệt đối của quan hệ sản xuất đối với lực lượng sản xuất.","Nhận thức rằng chỉ cần đổi mới chính trị là đủ để phát triển kinh tế.","Nhận thức sâu sắc sự đổi mới tư duy kinh tế của Đảng Cộng sản Việt Nam.","Nhận thức rằng chỉ có thể phát triển bằng cách quay lại mô hình kinh tế tự cung tự cấp."],2],["Khuynh hướng triết học cho rằng cảm tính là cơ sở và là hình thức chủ yếu, đáng tin cậy của nhận thức:",["Chủ nghĩa duy cảm.","Chủ nghĩa duy lý.","Chủ nghĩa hoài nghi.","Thuyết bất khả tri."],0],["Nghiên cứu lý luận hình thái kinh tế - xã hội, Đảng ta rút ra những ý nghĩa nào?",["Quán triệt sâu sắc đường lối của Đảng Cộng sản Việt Nam về xây dựng chủ nghĩa xã hội, củng cố niềm tin, lý tưởng cách mạng, kiên định con đường chủ nghĩa xã hội.","Nâng cao nhận thức về bản chất khoa học và cách mạng của chủ nghĩa Mác - Lênin.","Cơ sở khoa học và cách mạng trong cuộc đấu tranh tư tưởng chống lại các quan điểm phiến diện, sai lầm, phản động hòng phủ nhận mục tiêu, lý tưởng, phủ nhận con đường đi lên chủ nghĩa xã hội ở Việt Nam.","Tất cả các đáp án trên."],3],["Mâu thuẫn giữa giai cấp tư sản và giai cấp vô sản trong xã hội tư bản chủ nghĩa là:",["Mâu thuẫn đối kháng.","Mâu thuẫn không đối kháng.","Mâu thuẫn nội bộ nhân dân.","Mâu thuẫn tạm thời, có thể tự mất đi không cần đấu tranh."],0],["Thành ngữ “Tre già măng mọc” thể hiện rõ nhất:",["Quan điểm biện chứng.","Quan điểm siêu hình.","Quan điểm duy tâm thần bí.","Quan điểm bảo thủ, phủ định sự phát triển."],0],["Chương trình “Tiếp sức mùa thi” là:",["Hoạt động kinh tế.","Hoạt động tôn giáo.","Hoạt động chính trị – xã hội.","Hoạt động giải trí – thương mại."],2],["Vận dụng quy luật quan hệ sản xuất phù hợp với lực lượng sản xuất, muốn phát triển kinh tế Việt Nam phải bắt đầu từ:",["Chỉ tăng cường mở rộng thị trường xuất khẩu.","Trước hết thay đổi toàn bộ cơ cấu chính trị.","Phát triển lực lượng sản xuất, trước hết là phát triển lực lượng lao động và công cụ lao động.","Tập trung vào việc tăng thuế và siết chặt chi tiêu công."],2],["“Đời cha ăn mặn, đời con khát nước” biểu hiện rõ nhất nội dung cặp phạm trù:",["Nguyên nhân và kết quả.","Lượng và chất.","Nội dung và hình thức.","Khả năng và hiện thực."],0]];

      function hydrateCompactQuestions(arr, prefix) {
        return arr.map((item, idx) => ({
          id: prefix + '_' + (idx + 1),
          question: item[0],
          options: item[1].slice(),
          correctIndex: item[2],
          explanation: '',
          quote: ''
        }));
      }

      function createBuiltinTrietSets() {
        const now = new Date().toISOString();
        const qP1 = hydrateCompactQuestions(BUILTIN_TRIET_P1, 'tp1');
        const qP2 = hydrateCompactQuestions(BUILTIN_TRIET_P2, 'tp2');
        const qBoth = hydrateCompactQuestions(BUILTIN_TRIET_P1, 'tb1').concat(
          hydrateCompactQuestions(BUILTIN_TRIET_P2, 'tb2')
        );
        return [
          {
            id: 'builtin_triet_p1',
            title: 'Triết học Mác – Lênin — Phần 1 (P1)',
            tags: ['Triết học Mác - Lênin', 'Phần 1'],
            createdAt: now,
            sourceText: '',
            builtinMode: 'p1',
            questions: qP1
          },
          {
            id: 'builtin_triet_p2',
            title: 'Triết học Mác – Lênin — Phần 2 (P2)',
            tags: ['Triết học Mác - Lênin', 'Phần 2'],
            createdAt: now,
            sourceText: '',
            builtinMode: 'p2',
            questions: qP2
          },
          {
            id: 'builtin_triet_both',
            title: 'Triết học Mác – Lênin — Cả 2 phần (P1 + P2)',
            tags: ['Triết học Mác - Lênin', 'Tổng hợp'],
            createdAt: now,
            sourceText: '',
            builtinMode: 'both',
            questions: qBoth
          }
        ];
      }
