<!DOCTYPE html>
<html lang="vi" class="antialiased">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ÔnThiPro — Ứng dụng Ôn tập Trắc nghiệm Thông minh</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.16/400.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.16/500.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.16/600.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.16/700.css" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="js/tailwind-config.js"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-neutral-50 text-neutral-900 dark:bg-neutral-950 dark:text-neutral-100 min-h-screen transition-colors duration-200">
  <!-- Lớp hình nền tùy chỉnh toàn màn hình (Ảnh / Video ngắn) -->
  <div id="custom-bg-layer" class="fixed inset-0 z-0 pointer-events-none overflow-hidden hidden" aria-hidden="true">
    <img id="custom-bg-img" alt="" class="hidden w-full h-full object-cover scale-105 transition-[filter] duration-200" />
    <video id="custom-bg-video" autoplay loop muted playsinline class="hidden w-full h-full object-cover scale-105 transition-[filter] duration-200"></video>
    <div id="custom-bg-overlay" class="absolute inset-0 transition-colors duration-200"></div>
  </div>

  <!-- Vùng chính của ứng dụng -->
  <div id="app-root" class="relative z-10 min-h-screen flex flex-col">
    <!-- Thanh điều hướng trên cùng (gọn, trắng đen) -->
    <header class="sticky top-0 z-30 bg-white/90 dark:bg-neutral-950/90 backdrop-blur border-b border-neutral-200 dark:border-neutral-800">
      <div class="max-w-3xl mx-auto px-4 h-13 py-2.5 flex items-center justify-between gap-2">
        <button id="btn-go-home" type="button" class="flex items-center gap-2 text-left group focus:outline-none">
          <div class="w-7 h-7 rounded-lg bg-neutral-900 dark:bg-white text-white dark:text-neutral-950 flex items-center justify-center transition">
            <i data-lucide="graduation-cap" class="w-4 h-4"></i>
          </div>
          <span class="font-bold text-sm tracking-tight text-neutral-900 dark:text-white">ÔnThiPro</span>
        </button>

        <div class="flex items-center gap-1">
          <button id="btn-open-bg" type="button" class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-medium text-neutral-600 dark:text-neutral-300 hover:bg-neutral-100 dark:hover:bg-neutral-900 transition" title="Đổi hình nền (Ảnh hoặc Video ngắn)">
            <i data-lucide="image" class="w-3.5 h-3.5"></i>
            <span class="hidden sm:inline">Hình nền</span>
          </button>
          <button id="btn-open-merge" type="button" class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-medium text-neutral-600 dark:text-neutral-300 hover:bg-neutral-100 dark:hover:bg-neutral-900 transition" title="Gộp nhiều bộ đề">
            <i data-lucide="layers" class="w-3.5 h-3.5"></i>
            <span class="hidden sm:inline">Gộp đề</span>
          </button>
          <button id="btn-open-settings" type="button" class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-medium text-neutral-600 dark:text-neutral-300 hover:bg-neutral-100 dark:hover:bg-neutral-900 transition" title="Cài đặt AI & API">
            <i data-lucide="settings" class="w-3.5 h-3.5"></i>
            <span class="hidden sm:inline">AI</span>
            <span id="api-status-dot" class="w-1.5 h-1.5 rounded-full bg-neutral-400"></span>
          </button>
          <button id="btn-toggle-theme" type="button" class="p-1.5 rounded-lg text-neutral-600 dark:text-neutral-300 hover:bg-neutral-100 dark:hover:bg-neutral-900 transition" title="Chuyển chế độ sáng/tối" aria-label="Chuyển chế độ sáng tối">
            <i id="theme-icon" data-lucide="sun" class="w-4 h-4"></i>
          </button>
        </div>
      </div>
    </header>

    <!-- Nội dung động theo từng màn hình (khung thu nhỏ gọn max-w-3xl) -->
    <main id="main-content" class="flex-1 max-w-3xl w-full mx-auto px-4 py-5">
      <!-- Render bởi JavaScript -->
    </main>

    <!-- Chân trang gọn nhẹ -->
    <footer class="border-t border-neutral-200 dark:border-neutral-800 py-3 text-center text-[11px] text-neutral-500 dark:text-neutral-500">
      <div class="max-w-3xl mx-auto px-4">
        Dữ liệu bộ đề, câu đã sai và kết quả được lưu cục bộ trên trình duyệt (localStorage).
      </div>
    </footer>
  </div>

  <!-- Vùng hiển thị Modal (Hộp thoại) -->
  <div id="modal-root"></div>

  <!-- Vùng hiển thị thông báo Toast -->
  <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 max-w-sm w-[calc(100%-2rem)] pointer-events-none"></div>

  <!-- Vùng ẩn dùng riêng cho Xuất PDF / In ấn -->
  <div id="print-area" class="p-8 max-w-4xl mx-auto"></div>

  <!-- Dữ liệu & Mô-đun ứng dụng (theo thứ tự phụ thuộc) -->
  <script src="data/triet-hoc.js"></script>
  <script src="js/state.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/services.js"></script>
  <script src="js/modals.js"></script>
  <script src="js/quiz-engine.js"></script>
  <script src="js/views-home.js"></script>
  <script src="js/views-study.js"></script>
  <script src="js/background.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
